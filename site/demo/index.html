<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore Asagiri's real app interface in an interactive demo with sample containers.">
  <title>Explore Asagiri · Interactive demo</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0e1223;color:#f3f1f7;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:17px 28px;border-bottom:1px solid #343b55}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}header img{width:116px;height:auto;display:block}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}button{font:inherit;background:#242b45;color:#f3f1f7;border:1px solid #414960;border-radius:5px;padding:7px 12px;cursor:pointer}button:hover{background:#343e5d}button:focus-visible,a:focus-visible{outline:2px solid #ffa18c;outline-offset:4px}.note{padding:11px 28px;color:#b6bdd3;font-size:11px;display:flex;justify-content:space-between;gap:16px}.note strong{color:#ffa18c;font-weight:600}main{padding:0 22px 22px;overflow:auto}iframe{display:block;border:1px solid #3c435c;border-radius:10px;width:100%;min-width:920px;height:calc(100vh - 137px);min-height:640px;background:#161b33}.scroll-note{display:none}@media(max-width:760px){header{padding:14px 16px;align-items:flex-start;gap:14px}header img{width:94px}.controls{justify-content:flex-end;gap:5px}button{font-size:10px;padding:6px 8px}.note{padding:12px 16px;display:block;font-size:10px}.note span{display:block;margin-top:4px}.scroll-note{display:inline!important}main{padding:0 12px 12px}iframe{height:720px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <header><a href="../" aria-label="Asagiri home"><img src="../assets/asagiri-horizontal-dark.svg" alt="Asagiri"></a><nav class="controls" aria-label="Demo controls"><button data-view="containers">Containers</button><button data-view="images">Images</button><button data-view="volumes">Volumes</button><button id="theme">Light theme</button><button id="reset">Reset demo</button></nav></header>
  <div class="note"><div><strong>Interactive demo</strong> · Real app interface, sample data. Changes stay in this page. <span class="scroll-note">Swipe sideways to explore the full desktop window.</span></div><span>Try stopping a container, inspecting an image, or opening logs. <a href="https://github.com/AndreKurait/asagiri">Get the source ↗</a></span></div>
  <main><iframe id="app" src="window.html" title="Asagiri app demo with sample containers" sandbox="allow-scripts allow-same-origin"></iframe></main>
  <script>
    const frame=document.querySelector("#app");let theme="dark";
    const send=(value)=>frame.contentWindow.postMessage({type:"asagiri-demo",...value},location.origin);
    document.querySelectorAll("[data-view]").forEach((button)=>button.addEventListener("click",()=>send({view:button.dataset.view})));
    document.querySelector("#theme").addEventListener("click",(event)=>{theme=theme==="dark"?"light":"dark";event.currentTarget.textContent=theme==="dark"?"Light theme":"Dark theme";send({theme});});
    document.querySelector("#reset").addEventListener("click",()=>{frame.src="window.html";theme="dark";document.querySelector("#theme").textContent="Light theme";});
    frame.addEventListener("load",()=>{const view=new URLSearchParams(location.search).get("view");if(["containers","images","volumes","networks"].includes(view))send({view});});
  </script>
</body>
</html>
