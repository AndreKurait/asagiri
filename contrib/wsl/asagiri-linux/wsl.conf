# Asagiri Linux: the small WSL2 distro Asagiri's engine runs in on Windows
# (Alpine and the static asagiri binaries; made by `cargo xtask windows`).
[boot]
systemd = false
# No systemd: the engine starts each time WSL boots the distro (after a WSL
# restart or Windows sleep nothing else would start it), in the background
# so boot is not held up. asagiri-start does nothing while one runs.
command = /usr/local/bin/asagiri-start >>/var/log/asagiri.log 2>&1 &

[user]
default = root

[interop]
# Nothing in here needs to start Windows programs: with interop off, a
# process that somehow became root in this distro still cannot run one.
enabled = false
appendWindowsPath = false
