# Asagiri Linux: the small WSL2 distro Asagiri's engine runs in on Windows
# (Alpine and the static asagiri binaries; made by `cargo xtask windows`).
# Setup and asagiri-win start the engine explicitly after the distro is ready.
[boot]
systemd = false

[user]
default = root

[interop]
# Nothing in here needs to start Windows programs: with interop off, a
# process that somehow became root in this distro still cannot run one.
enabled = false
appendWindowsPath = false
