# Asagiri's container bridges (asagiri0, asagiri1, …) and their veths (kv… for a
# container's first network, kx… for the others) are set up by Asagiri itself. NetworkManager leaves them alone, so containers starting and
# stopping don't run its dispatcher scripts, which on Fedora trip SELinux
# denials for nm-dispatcher (sys_admin, sys_resource).
[keyfile]
unmanaged-devices=interface-name:asagiri*;interface-name:kv*;interface-name:kx*
