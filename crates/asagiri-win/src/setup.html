<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asagiri Setup</title>
<style>
:root{
  --bg:#161B33; --rail:#1B203C; --surface:#202643; --sunk:#12162A; --line:#394164; --line-2:#252B49; --stroke:#3A4652;
  --ink:#F6F2EA; --text-2:#C9CDD2; --muted:#9AA3AE;
  --ember:#F2684A; --lid:#FFA36C; --ember-text:#FFA18C; --ember-deep:#C64A32;
  --moss:#5CC99A; --bad:#F28B82; --primary:#C64A32; --primary-hover:#AE3D28;
  --f-text:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --f-display:"Segoe UI Variable Display","Segoe UI",sans-serif;
  --f-mono:"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
  /* Reading direction, as in the main window: rules say start and end, and
     text-align (see the right to left section) takes these. */
  --start:left;--end:right;
}
:root[dir=rtl]{--start:right;--end:left}
/* Chinese, Japanese and Korean in Windows' own fonts for each, after Segoe UI
   (which has none), so a Japanese or Traditional Chinese page doesn't draw its
   Han characters in Simplified Chinese shapes. On the page and on each tile. */
[lang|=zh-Hans]{--f-text:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;--f-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif}
[lang|=zh-Hant]{--f-text:"Segoe UI Variable Text","Segoe UI","Microsoft JhengHei UI",sans-serif;--f-display:"Segoe UI Variable Display","Segoe UI","Microsoft JhengHei UI",sans-serif}
[lang|=ja]{--f-text:"Segoe UI Variable Text","Segoe UI","Yu Gothic UI","Meiryo UI",sans-serif;--f-display:"Segoe UI Variable Display","Segoe UI","Yu Gothic UI","Meiryo UI",sans-serif}
[lang|=ko]{--f-text:"Segoe UI Variable Text","Segoe UI","Malgun Gothic",sans-serif;--f-display:"Segoe UI Variable Display","Segoe UI","Malgun Gothic",sans-serif}
[lang|=ko]{word-break:keep-all}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--ink);font:15px/1.4 var(--f-text);overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
a{color:var(--ember-text)} a:hover{color:var(--lid)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--lid);outline-offset:2px;border-radius:4px}
h1[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono)}

.app{display:flex;height:100vh;min-height:0}

/* rail */
.rail{width:280px;flex:none;padding:32px 28px;background:var(--rail);border-inline-end:1px solid var(--line-2);display:flex;flex-direction:column;gap:28px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font:700 24px/1 var(--f-display)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px;font-size:14px}
.steps li{display:flex;gap:14px}
.num{width:26px;height:26px;flex:none;border-radius:9999px;border:2px solid var(--line);color:var(--muted);font:12px/1 var(--f-mono);display:flex;align-items:center;justify-content:center}
.steps .cur .num{border-color:var(--ember);color:var(--ember-text);font-weight:600}
.steps .done .num{border:0;background:var(--moss);color:var(--bg)}
.st{display:flex;flex-direction:column;gap:2px;padding-top:3px}
.st-t{color:var(--text-2);font-weight:500}
.cur .st-t,.done .st-t{color:var(--ink);font-weight:600}
.st-s{font-size:12px;color:var(--muted)}
.cur .st-s{color:var(--ember-text)} .done .st-s{color:var(--moss)} .cur .st-s.bad{color:var(--bad)}
.rail-foot{margin:auto 0 0;font-size:12px;line-height:1.5;color:var(--muted)}

/* main */
main{flex:1;min-width:0;padding:44px 56px 28px;display:flex;flex-direction:column;gap:24px;overflow-y:auto}
main.center{align-items:center;justify-content:center;text-align:center;gap:22px}
main.choose{padding:36px 44px 28px}
.head{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ember-text)}
h1{margin:0;font:700 34px/1.1 var(--f-display)}
h1.xl{font-size:40px;line-height:1.05}
h1.l{font-size:36px}
.lede{margin:0;font-size:15px;line-height:1.5;color:var(--text-2)}
.lede.lg{font-size:17px;line-height:1.55;max-width:560px}
.lede.md{font-size:16px;line-height:1.55;max-width:680px}
.note{margin:0;font-size:13px;line-height:1.55;color:var(--muted);max-width:640px}
.small{margin:0;font-size:12px;color:var(--muted)}
.hero{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
.hero.sm{gap:24px;flex-wrap:nowrap}
.hero-t{display:flex;flex-direction:column;gap:10px;flex:1;min-width:280px}
.hero.sm .hero-t{gap:8px;min-width:0}
.hero svg{flex:none}

.card{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:22px}
.card.tight{gap:18px}
.foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:auto;padding-top:4px}
/* The language step: a header that says hello in the language picked, over a
   faint cloud of the others; then sixteen tiles, four across, each its
   greeting in its own script over its name. A short window scrolls them under
   the header, with Continue kept in view (main.choose's foot). */
.lhead{position:relative;overflow:hidden;max-width:720px;padding:22px 24px 20px;border-radius:16px;border:1px solid var(--line);
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--ember) 16%,transparent),transparent 55%),radial-gradient(120% 140% at 100% 100%,rgba(59,130,246,.16),transparent 60%),var(--rail)}
.lcloud{position:absolute;inset:0;pointer-events:none;opacity:.06}
.lcloud span{position:absolute;white-space:nowrap;font:700 1em var(--f-display);color:var(--ink)}
.lhello{position:relative;font:750 42px/1.1 var(--f-display);letter-spacing:-.5px;color:var(--ink);animation:lhello .25s ease}
@keyframes lhello{from{opacity:.2;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lhello{animation:none}}
.lhead h1{position:relative;margin-top:6px;font:600 20px/1.25 var(--f-display);color:var(--ink)}
.lhead .lede{position:relative;margin-top:4px}
.langs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:720px}
.lang{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;padding:10px 12px 9px;min-height:70px;border-radius:12px;background:var(--surface);border:2px solid var(--line);color:var(--text-2);font:inherit;font-family:var(--f-text);text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.lang:hover{border-color:var(--stroke);transform:translateY(-1px)}
.lang b{font:650 18px/1.2 var(--f-display);color:var(--ink);overflow-wrap:anywhere}
.lang span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.lang em{font-style:normal;font-size:12px;color:var(--moss)}
.lang[aria-checked=true]{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 8%,var(--surface))}
.lang:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (max-width:900px){.langs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grow{flex:1}

.btn{height:40px;padding:0 18px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 14px var(--f-text);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line-2)}
.btn:active{background:var(--line)}
.btn.primary{border:0;background:var(--primary);color:#fff;font-weight:600;padding:0 20px}
.btn.primary:hover{background:var(--primary-hover)}
.btn.lg{height:44px}
.btn.xl{height:44px;padding:0 28px;font-size:15px}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:focus-visible{outline-offset:3px;border-radius:6px}

/* welcome size block */
.size{border-radius:18px;background:radial-gradient(80% 120% at 20% 50%,rgba(224,180,32,.12),rgba(224,180,32,0) 70%),var(--surface);border:1px solid var(--line);padding:32px 36px;display:flex;align-items:center;gap:28px}
.size svg{flex:none}
.size-t{display:flex;flex-direction:column;gap:8px;min-width:0}
.size-n{font:600 clamp(44px,6vw,72px)/1 var(--f-mono);letter-spacing:-.02em}
.size-s{font-size:16px;color:var(--text-2)}

/* progress */
.prog{display:flex;flex-direction:column;gap:10px}
.prog-h{display:flex;align-items:baseline;gap:12px}
.pct{font:600 30px/1.2 var(--f-mono)}
.plabel{flex:1;font-size:14px;color:var(--text-2);min-width:0}
.eta,.pmeta{font:13px var(--f-mono);color:var(--muted)}
.pmeta{display:flex;gap:20px}
.bar{height:10px;border-radius:9999px;background:var(--line);overflow:hidden;position:relative}
.fill{height:100%;width:0;border-radius:9999px;background:linear-gradient(90deg,var(--ember-deep),var(--ember));transition:width .3s ease-out}
.bar.ind .fill{position:absolute;left:0;top:0;width:32%;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:15px}
.tasks li{display:flex;align-items:center;gap:12px}
.t-label{flex:1;min-width:0}
.t-detail{font:13px var(--f-mono);color:var(--muted);text-align:var(--end)}
.tasks .todo .t-label{color:var(--text-2)}
.tasks .active .t-label{font-weight:600}
.tasks .active .t-detail{color:var(--ember-text)}
.tasks .error .t-detail{color:var(--bad)}
.mark{width:22px;height:22px;flex:none;border-radius:9999px;display:flex;align-items:center;justify-content:center}
.mark.done{background:var(--moss);color:var(--bg)}
.mark.todo{border:2px solid var(--line)}
.mark.error{border:2px solid var(--bad);color:var(--bad);background:rgba(242,139,130,.12);font:700 12px/1 var(--f-text)}
.spin{border:3px solid var(--line);border-top-color:var(--ember);border-radius:9999px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.log{margin:0;padding:14px 16px;border-radius:10px;background:var(--sunk);font:12.5px/1.6 var(--f-mono);color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:9.8em;overflow-y:auto}
.log.hl .last{color:var(--ember-text)}
.log.hl .last::after{content:" \258D";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* error */
.err{display:flex;align-items:center;gap:14px;padding-block:14px;padding-inline:18px 16px;border-radius:12px;border:1px solid rgba(242,139,130,.45);background:rgba(242,139,130,.08);text-align:var(--start);max-width:100%}
.err-i{width:22px;height:22px;flex:none;border-radius:9999px;border:2px solid var(--bad);color:var(--bad);display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--f-text)}
.err-t{flex:1;font-size:14px;line-height:1.45;color:var(--ink);min-width:0}
main.center .err{width:min(640px,100%)}

/* choose */
.opts{flex:1 0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.opt{position:relative;display:flex;flex-direction:column;border-radius:18px;background:var(--surface);border:2px solid var(--line);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--stroke)}
.opt:has(input:checked){border-color:var(--ember);box-shadow:0 0 0 6px rgba(224,180,32,.08)}
.opt:has(input:focus-visible){outline:2px solid var(--lid);outline-offset:4px}
.opt-art{height:168px;flex:none;background:var(--rail);border-bottom:1px solid var(--line)}
.opt:has(input:checked) .opt-art{background:radial-gradient(120% 90% at 60% 40%,rgba(224,180,32,.16),rgba(224,180,32,0) 60%),var(--rail)}
.opt-art svg{display:block;width:100%;height:100%}
.opt-b{flex:1;display:flex;flex-direction:column;gap:14px;padding:20px 22px 22px}
.opt-h{display:flex;align-items:center;gap:10px}
.opt-h input{width:18px;height:18px;margin:0;accent-color:var(--ember);flex:none}
.opt-h input:focus-visible{outline:none}
.opt-n{font:700 22px/1.2 var(--f-display)}
.badge{margin-inline-start:auto;padding:3px 10px;border-radius:9999px;background:var(--ember);color:#1A1400;font-size:12px;font-weight:600}
.opt-p{margin:0;font-size:14px;line-height:1.5;color:var(--text-2)}
.facts{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:2px 0 0;font:600 15px var(--f-mono)}
.pros{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-2)}
.pros .con{color:var(--muted)}
.choose .foot .small{flex:1;line-height:1.5}
/* The choice's button stays in view when the window is too short for both
   cards (1024×768 and smaller): the cards scroll under it. */
main.choose .foot{position:sticky;bottom:-24px;margin-bottom:-24px;padding:14px 0 24px;background:var(--bg);box-shadow:0 -12px 12px -12px rgba(0,0,0,.35);z-index:1}

/* tools */
.tools{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tool{border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;align-items:center;gap:14px}
.tool.active{border:2px solid var(--ember);padding:17px}
.tool.error{border-color:rgba(242,139,130,.55)}
.ticon{width:40px;height:40px;flex:none;border-radius:10px;background:var(--rail);display:flex;align-items:center;justify-content:center;font:600 15px var(--f-mono);color:var(--ember-text)}
.ticon .spin{width:18px;height:18px}
.tt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tname{font-weight:600}
.tdetail{font:12px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tstate{font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.tool.done .tstate{color:var(--moss)} .tool.active .tstate{color:var(--ember-text)} .tool.error .tstate{color:var(--bad)}
.box{border-radius:14px;background:var(--rail);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.box-t{font-weight:600}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.45;color:var(--text-2);cursor:pointer}
.check input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--primary);flex:none;cursor:pointer}
.check.inline{align-items:center}
.check.inline input{margin:0}

/* ready */
.cmd{display:flex;align-items:center;gap:12px;padding-block:14px;padding-inline:20px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font:15px var(--f-mono);max-width:100%}
.cmd .p{color:var(--muted)}
.cmd code{font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:1100px){ main{padding:36px 36px 24px} main.choose{padding:32px 32px 24px} .rail{width:248px;padding:28px 22px} }
@media (max-height:760px){ main{padding-top:28px;gap:18px} .opt-art{height:120px} .opt-b{gap:10px;padding:16px 18px 18px} .card{padding:20px;gap:16px} .size{padding:24px 28px} .steps{gap:18px} }
@media (max-width:1000px){ .hero.lgx svg{width:170px;height:139px} .rail{width:224px;padding:24px 18px} main.choose{padding:24px 24px 24px} .opts{gap:14px} }
@media (max-height:700px){ main{padding-top:22px;gap:14px} h1{font-size:28px} .lede.md{font-size:14.5px} .opt-art{height:88px} .opt-n{font-size:19px} .opt-b{gap:8px;padding:12px 16px 14px} .facts{gap:6px 14px} .pros{gap:3px} }
@media (prefers-reduced-motion:reduce){
  .spin{animation:none;border-color:var(--ember);border-right-color:var(--line);border-bottom-color:var(--line)}
  .bar.ind .fill{animation:none;width:100%;opacity:.45;transform:none}
  .log.hl .last::after{animation:none}
  .fill,.opt{transition:none}
}
.copied-tip{position:fixed;z-index:1000;transform:translate(-50%,-100%);pointer-events:none;display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px 5px 8px;border-radius:8px;white-space:nowrap;font:600 11px var(--f-text);color:#B9F0D2;background:#0F2A1F;
  border:1px solid color-mix(in srgb,var(--moss) 55%,transparent);box-shadow:0 6px 18px rgb(0 0 0 / .45);animation:copied-rise .18s ease-out}
.copied-tip svg{width:12px;height:12px;fill:var(--moss)}
.copied-tip::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);background:#0F2A1F;
  border-right:1px solid color-mix(in srgb,var(--moss) 55%,transparent);border-bottom:1px solid color-mix(in srgb,var(--moss) 55%,transparent)}
.copied-tip.out{opacity:0;transform:translate(-50%,calc(-100% - 4px));transition:opacity .2s,transform .2s}
@keyframes copied-rise{from{opacity:0;transform:translate(-50%,calc(-100% + 4px))}}
@media (prefers-reduced-motion:reduce){.copied-tip{animation:none}}
/* Right to left (Arabic), as in the main window (index.html says why): the
   page mirrors by itself; every element takes the direction of its own first
   letter, so Windows, WSL and Ubuntu read as written inside Arabic; alignment
   is said outright; commands and the drawing behind the hello stay left to
   right; and Arabic's joined letters are never spaced apart. */
[dir=rtl] body{text-align:right}
[dir=rtl] body :not(svg,svg *){unicode-bidi:plaintext;letter-spacing:0!important}
[dir=rtl] :is(.cmd,pre,.lcloud,svg){direction:ltr}
[dir=rtl] pre{text-align:left}
/* Values are set in the monospace face, and some are words ("optional",
   "included"): Arabic letters there come from the text face, since a
   monospace one stretches every letter to one width. Latin and digits keep it. */
@font-face{font-family:"Asagiri Arabic";src:local("Segoe UI"),local("GeezaPro");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Asagiri Arabic";font-weight:600 900;src:local("Segoe UI Semibold"),local("Segoe UI Bold"),local("GeezaPro-Bold");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
[lang|=ar]{--f-mono:"Asagiri Arabic","Cascadia Mono",Consolas,monospace}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Setup steps">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><clipPath id="setup-sun"><rect x="0" y="0" width="64" height="29.5"/><rect x="0" y="39" width="64" height="4"/></clipPath>
  <g clip-path="url(#setup-sun)" fill="#F2684A"><circle cx="32" cy="33" r="20"/></g>
  <g fill="currentColor"><rect x="3" y="31.5" width="41" height="5.5" rx="2.75"/><rect x="19" y="45" width="42" height="5.5" rx="2.75"/><rect x="9" y="54.5" width="30" height="5.5" rx="2.75"/></g></svg>
      <span>Asagiri</span>
    </div>
    <ol class="steps" id="steps"></ol>
    <p class="rail-foot" id="railFoot" hidden></p>
  </aside>
  <main id="main"></main>
</div>

<script>
/* The page's words: English is the key, lang/<tag>.json (spliced in by
   assemble.rs, as for the main window) gives the system's language, or the
   one Settings picked on a setup run again. scripts/i18n-check.py checks them. */
/*LANG*/
/* Packed by lang.rs with the English keys once ({"en": [keys], tag: [its words
   in that order, null where missing]}), unpacked to a map per language. The page
   opens with one language; a tile for another asks the host (langwords, which
   engine.rs answers, setup.rs taking only setup- commands), and its answer
   calls asagiriWords with that language's words, packed the same way. */
var KEYS = [], STRINGS = {};
function addWords(p) {
  if (p.en) KEYS = p.en;
  for (var t in p) {
    if (t === 'en' || !p[t]) continue;
    var m = {};
    for (var i = 0; i < KEYS.length; i++) if (p[t][i] != null) m[KEYS[i]] = RTL.test(t) ? rtlReady(p[t][i]) : p[t][i];
    STRINGS[t] = m;
  }
}
/* Written right to left. As the main window's rtlReady and island: an Arabic
   sentence that opens with a Latin name gets a right-to-left mark in front
   (every element takes its first letter's direction), and each value filled
   into Arabic words is an island that keeps its own order. */
var RTL = /^ar/, RTL_CH = /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFC]/, STRONG_CH = /[A-Za-z\u00C0-\u024F\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFC]/;
function rtlReady(s) {
  if (!RTL_CH.test(s)) return s;
  /* The sentence's own first letter: a {placeholder}'s name and a tag's aren't its words, so they are stepped over. */
  var first = function (t) { for (var i = 0; i < t.length; i++) { var skip = (t[i] === '{' || t[i] === '<') && /^(?:\{\w+\}|<[^>]*>)/.exec(t.slice(i)); if (skip) i += skip[0].length - 1; else if (STRONG_CH.test(t[i])) return t[i]; } return ''; };

        '<label class="check inline"><input type="checkbox" id="auto">' + tr("Start Asagiri when I sign in (in the tray)") + '</label>' +
        ERR + '<button type="button" class="btn primary xl" data-cmd="setup-open">' + tr("Open Asagiri") + '</button>' };

      default: return { cls: '', html: /* welcome */
        '<div class="hero lgx">' + ART.welcome + '<div class="hero-t"><h1 class="xl" tabindex="-1">' + tr("Welcome to Asagiri") + '</h1><p class="lede lg">' + tr("Asagiri runs Linux containers on Windows without Docker Desktop. It needs Windows Subsystem for Linux (WSL), Microsoft's own way to run Linux, which this PC doesn't have yet.") + '</p></div></div>' +
        '<section class="size">' + ART.download + '<div class="size-t"><span class="size-n">' + (isNum(sz.wsl) ? mb(sz.wsl) : '—') + '</span><span class="size-s">' + tr("WSL, downloaded from Microsoft") + '</span></div></section>' +
        ERR + '<div class="foot"><a href="https://learn.microsoft.com/windows/wsl/about" data-open>' + tr("What is WSL?") + '</a><span class="grow"></span>' +
        '<button type="button" class="btn" data-cmd="setup-quit">' + tr("Quit") + '</button><button type="button" class="btn primary" data-cmd="setup-install-wsl">' + tr("Install WSL") + '</button></div>' };
    }
  }

  /* ---------- rail ---------- */
  function rail(s) {
    var step = s.step, cur = RAIL[step], p = s.progress;
    var pct = p && isNum(p.pct) ? Math.round(p.pct) + '%' : '';
    var showFuture = step === 'welcome' || step === 'wsl' || step === 'choose';
    var tasks = Array.isArray(s.tasks) ? s.tasks : [];
    var nDone = tasks.filter(function (t) { return t && t.state === 'done'; }).length;
    var ln = linuxName(s.linux, true);
    var items = [
      { t: tr("Windows Subsystem for Linux"), f: '', c: step === 'wsl' ? tr("Installing") + (pct ? ' · ' + pct : '') : step === 'restart' ? tr("Needs a restart") : tr("Now"), d: tr("Installed") },
      { t: step === 'choose' ? tr("Choose a Linux") : 'Linux', f: step === 'restart' ? tr("After the restart") : tr("Choose and install"),
        c: step === 'choose' ? tr("Now") : s.linux === 'ubuntu' ? ('Ubuntu · ' + (s.existingUbuntu ? '' : tr("downloading") + ' ') + pct).trim() : ln + (pct ? ' · ' + pct : ''), d: s.linux ? ln : '' },
      { t: tr("Asagiri’s engine"), f: tr("Runs your containers"), c: tr("Starting"), d: tr("Running") },
      { t: tr("Docker tools"), f: 'docker, Compose, buildx', c: tasks.length ? tr("{done} of {total}", { done: nDone, total: tasks.length }) : tr("Now"), d: '' },
      { t: tr("Ready"), f: tr("docker run, from any terminal"), c: '', d: '' }
    ];
    var html = items.map(function (it, i) {
      var state = step === 'ready' || i < cur ? 'done' : i === cur ? 'cur' : 'todo';
      var sub = state === 'done' ? (step === 'ready' ? '' : it.d) : state === 'cur' ? (s.error ? tr("Stopped") : it.c.replace(/ ·\s*$/, '')) : (showFuture || (step === 'restart' && i === 1) ? it.f : '');
      var sr = state === 'done' ? tr(" (done)") : state === 'cur' ? tr(" (current step)") : '';
      return '<li class="' + state + '"' + (state === 'cur' ? ' aria-current="step"' : '') + '><span class="num" aria-hidden="true">' + (state === 'done' ? CHECK_RAIL : i + 1) + '</span>' +
        '<span class="st"><span class="st-t">' + it.t + '<span class="sr">' + sr + '</span></span>' + (sub ? '<span class="st-s' + (state === 'cur' && s.error ? ' bad' : '') + '">' + esc(sub) + '</span>' : '') + '</span></li>';
    }).join('');
    var steps = document.getElementById('steps');
    if (steps.innerHTML !== html) steps.innerHTML = html;
    var foot = { welcome: tr("Asagiri sets itself up for your Windows account only."), wsl: tr("Keep using your PC meanwhile."), choose: tr("Step 2 of 5. Nothing else on this PC changes: Asagiri sets itself up for your Windows account only.") }[step];
    var rf = document.getElementById('railFoot');
    rf.hidden = !foot; setText(rf, foot || '');
  }

  /* ---------- live parts ---------- */
  function updProgress(el, p) {
    if (!el) return;
    if (!p || typeof p !== 'object') { el.hidden = true; return; }
    el.hidden = false;
    var ind = !isNum(p.pct), pct = ind ? 0 : Math.max(0, Math.min(100, p.pct));
    var pctEl = el.querySelector('.pct'); setText(pctEl, ind ? '' : Math.round(pct) + '%'); pctEl.hidden = ind;
    setText(el.querySelector('.plabel'), p.label || '');
    var eta = '';
    if (isNum(p.eta) && p.eta >= 0) eta = p.eta >= 120 ? tr("about {min} min left", { min: Math.round(p.eta / 60) }) : tr("about {sec} s left", { sec: Math.max(1, Math.round(p.eta)) });
    setText(el.querySelector('.eta'), eta);
    var bar = el.querySelector('.bar'), fill = bar.firstChild;
    bar.classList.toggle('ind', ind);
    fill.style.width = ind ? '' : pct + '%';
    if (ind) bar.removeAttribute('aria-valuenow'); else bar.setAttribute('aria-valuenow', String(Math.round(pct)));
    bar.setAttribute('aria-label', p.label || tr("Progress"));

    el.querySelector('.pmeta').hidden = !sized;
    if (sized) {
      setText(el.querySelector('.bytes'), tr("{done} of {total}", { done: isNum(p.done) ? mbN(p.done) : 0, total: mb(p.total) }));
      setText(el.querySelector('.rate'), isNum(p.rate) && p.rate > 0 ? (p.rate / 1e6).toFixed(1) + ' MB/s' : '');
    }
  }

  var STATE_WORD = { done: tr("done"), active: tr("in progress"), todo: tr("to do"), error: tr("failed") };
  var normState = function (st) { return STATE_WORD[st] ? st : 'todo'; };

  function updTasks(ol, tasks) {
    if (!ol) return;
    tasks = Array.isArray(tasks) ? tasks.filter(Boolean) : [];
    while (ol.children.length > tasks.length) ol.lastChild.remove();
    tasks.forEach(function (t, i) {
      var li = ol.children[i];
      if (!li) {
        li = document.createElement('li');
        li.innerHTML = '<span class="mark" aria-hidden="true"></span><span class="t-label"></span><span class="sr"></span><span class="t-detail"></span>';
        ol.appendChild(li);
      }
      var st = normState(t.state);
      if (li.dataset.state !== st) {
        li.dataset.state = st; li.className = st;
        var m = li.children[0];
        m.className = 'mark ' + (st === 'active' ? 'spin' : st);
        m.innerHTML = st === 'done' ? CHECK : st === 'error' ? '!' : '';
      }
      setText(li.children[1], t.label);
      setText(li.children[2], ', ' + STATE_WORD[st]);
      setText(li.children[3], t.detail != null ? t.detail : '');
    });
    ol.hidden = !tasks.length;
  }

  var TOOL_STATE = { done: tr("✓ Installed"), active: tr("Setting up"), todo: tr("Waiting"), error: tr("Failed") };
  function updTools(ul, tasks) {
    if (!ul) return;
    tasks = Array.isArray(tasks) ? tasks.filter(Boolean) : [];
    while (ul.children.length > tasks.length) ul.lastChild.remove();
    tasks.forEach(function (t, i) {
      var li = ul.children[i];
      if (!li) {
        li = document.createElement('li');
        li.innerHTML = '<span class="ticon" aria-hidden="true"></span><span class="tt"><span class="tname"></span><span class="tdetail"></span></span><span class="tstate"></span>';
        ul.appendChild(li);
      }
      var st = normState(t.state), key = st + '|' + t.label;
      if (li.dataset.key !== key) {
        li.dataset.key = key; li.className = 'tool ' + st;
        li.children[0].innerHTML = st === 'active' ? '<span class="spin"></span>' : toolIcon(t.label);
      }
      setText(li.querySelector('.tname'), t.label);
      setText(li.querySelector('.tdetail'), t.detail != null ? t.detail : '');
      setText(li.querySelector('.tstate'), TOOL_STATE[st]);
    });
    ul.hidden = !tasks.length;
  }

  function updLog(pre, log) {
    if (!pre) return;
    var lines = Array.isArray(log) ? log.map(String) : [];
    pre.hidden = !lines.length;
    var key = lines.join('\n');
    if (pre.dataset.key === key) return;
    pre.dataset.key = key;
    var atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
    if (pre.classList.contains('hl') && lines.length) {
      pre.innerHTML = lines.slice(0, -1).map(function (l) { return esc(l) + '\n'; }).join('') + '<span class="last">' + esc(lines[lines.length - 1]) + '</span>';
    } else pre.textContent = key;
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  }

  function updError(slot, err) {
    if (!slot) return;
    if (err == null || err === '') { if (slot.firstChild) slot.innerHTML = ''; return; }
    if (!slot.firstChild) {
      slot.innerHTML = '<div class="err"><span class="err-i" aria-hidden="true">!</span><span class="err-t"></span><button type="button" class="btn" data-cmd="setup-retry">' + tr("Try again") + '</button></div>';
    }
    setText(slot.querySelector('.err-t'), err);
  }

  /* checkboxes: the host owns the value; hold the user's click until the host echoes it */
  var pending = {};
  function effective(s, name) {
    var p = pending[name], v = !!s[name];
    if (p && (p.v === v || Date.now() - p.t > 1500)) { delete pending[name]; p = null; }
    return p ? p.v : v;
  }

  /* ---------- render ---------- */
  var S = null, hadState = false, builtKey = null, choice = 'asagiri', main = document.getElementById('main');
  function render() {
    var s = Object.assign({ step: 'welcome' }, S || {});
    if (STEPS.indexOf(s.step) < 0) s.step = 'welcome';
    var key = JSON.stringify([s.step, s.step === 'linux' || s.step === 'engine' ? s.linux : null, s.existingUbuntu, s.otherDocker, s.sizes, !!s.askLang && !langDone, LANG, langId(PICK)]);
    if (key !== builtKey) {
      var first = builtKey === null || !hadState, prevStep = builtKey && JSON.parse(builtKey)[0];
      var sc = screen(s);
      main.className = sc.cls;
      main.innerHTML = sc.html;
      main.scrollTop = 0;
      builtKey = key;
      if (!first && prevStep !== s.step) { var h = main.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }

    rail(s);
    var q = function (sel) { return main.querySelector(sel); };
    updProgress(q('[data-slot=progress]'), s.progress);
    updTasks(q('[data-slot=tasks]'), s.tasks);
    updTools(q('[data-slot=tools]'), s.tasks);
    updLog(q('[data-slot=log]'), s.log);
    updError(q('[data-slot=error]'), s.error);
    var r = main.querySelectorAll('input[name=linux]');
    for (var i = 0; i < r.length; i++) r[i].checked = r[i].value === choice;
    var cb = document.getElementById('chooseBtn');
    if (cb) setText(cb, choice === 'ubuntu' ? tr("Set up with Ubuntu") : tr("Set up with Asagiri Linux"));
    var mk = document.getElementById('mk'); if (mk) mk.checked = effective(s, 'makeDefault');
    var au = document.getElementById('auto'); if (au) au.checked = effective(s, 'autostart');
    // Asagiri as docker's default builds on Asagiri anyway: the question is only for docker staying elsewhere.
    var bw = q('[data-slot=bw]'); if (bw) bw.hidden = effective(s, 'makeDefault');
    var bk = effective(s, 'buildAsagiri'), rb = main.querySelectorAll('input[name=bw]');

  function schedule() { if (!queued) { queued = true; requestAnimationFrame(function () { queued = false; render(); }); } }

  /* The picked tile keeps the focus as the page redraws in its language. */
  function focusLang() { var f = main.querySelector('[data-lang="' + langId(PICK) + '"]'); if (f) f.focus(); }

  /* ---------- input ---------- */

  var copyTimer = 0;
  function copiedTip(el) {
    document.querySelectorAll('.copied-tip').forEach(function (x) { x.remove(); });
    var r = el.getBoundingClientRect(), tip = document.createElement('div');
    tip.className = 'copied-tip'; tip.setAttribute('role', 'status');
    tip.innerHTML = '<svg viewBox="0 0 256 256" aria-hidden="true"><path d="M229.7 77.7l-128 128a8 8 0 0 1-11.3 0l-56-56a8 8 0 0 1 11.3-11.3L96 188.7 218.3 66.3a8 8 0 0 1 11.3 11.3Z"/></svg>';
    tip.append(tr("Copied"));
    tip.style.left = (r.left + r.width / 2) + 'px'; tip.style.top = (r.top - 8) + 'px';
    document.body.append(tip);
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { tip.classList.add('out'); setTimeout(function () { tip.remove(); }, 220); }, 1200);
  }
  main.addEventListener('click', function (ev) {
    var a = ev.target.closest('a[data-open]');
    if (a) { ev.preventDefault(); send('open', { name: a.href }); return; }
    var b = ev.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.cmd) { send(b.dataset.cmd, b.dataset.value ? { value: b.dataset.value } : null); return; }
    if (b.dataset.lang) {
      var v = b.dataset.lang === sysLang ? 'system' : b.dataset.lang;
      send('setpref', { name: 'lang', value: v });

      return;
    }
    if (b.dataset.act === 'lang-done') { langDone = true; send('setpref', { name: 'langAsked', value: true }); render(); return; }
    if (b.dataset.act === 'choose') send('setup-choose', { value: choice });
    else if (b.dataset.act === 'copy') {
      send('copy', { value: 'docker run --rm alpine echo hello' });
      copiedTip(b);
    }
  });
  main.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.name === 'linux') { choice = t.value === 'ubuntu' ? 'ubuntu' : 'asagiri'; render(); }
    else if (t.name === 'bw') {
      pending.buildAsagiri = { v: t.value === 'asagiri', t: Date.now() };
      send('setup-build', { value: t.value === 'asagiri' ? 'asagiri' : 'docker' });
    }
    else if (t.id === 'mk' || t.id === 'auto') {
      var name = t.id === 'mk' ? 'makeDefault' : 'autostart';
      pending[name] = { v: t.checked, t: Date.now() };
      send(t.id === 'mk' ? 'setup-default' : 'setup-autostart', { value: t.checked });
    }
  });

  /* ---------- host → page ---------- */
  window.asagiri = Object.assign(window.asagiri || {}, {
    on: function (e) {
      if (typeof e === 'string') { try { e = JSON.parse(e); } catch (x) { return; } }
      if (!e || e.type !== 'setup') return;
      S = e; schedule();
    }
  });

  render();
  send('setup-ready');
})();
