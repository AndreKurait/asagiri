[package]
name = "asagiri-init"
description = "PID 1 and agent of the Asagiri guest VM"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
asagiri-proto = { path = "../asagiri-proto" }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
libc = "0.2"
serde_json = "1"
ruzstd = "0.9"
tar = "0.4"

[dev-dependencies]
tar = "0.4"

[lints]
workspace = true

[[test]]
name = "trim-process"
harness = false

[[test]]
name = "removal-process"
harness = false

[[test]]
name = "clock-read"
harness = false

[[test]]
name = "seccomp-default"
harness = false

[[test]]
name = "shared-root-process"
harness = false
