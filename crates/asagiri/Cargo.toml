[package]
name = "asagiri"
description = "Tiny, fast container runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
asagiri-image = { path = "../asagiri-image" }
asagiri-proto = { path = "../asagiri-proto" }
asagiri-share-proto = { path = "../asagiri-share-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Docker name filters use bounded, non-backtracking regular expressions.
regex = "1"
sha2 = "0.11"
# gzip uploads to PUT /containers/{id}/archive (DDEV sends them).
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# HTTPS for container names: the same rustls and ring ureq already brings in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Roots for `asagiri share`'s connection to the edge.
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
# Docker's attach WebSocket framing and handshake, without a TLS stack.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The local browser uses a maintained HTTP parser and password verifier.
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
argon2 = { version = "0.6", features = ["zeroize"] }
base64 = "0.23"
rpassword = "7.5"
zeroize = "1.9"

[target.'cfg(any(unix, windows))'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
asagiri-vmm = { path = "../asagiri-vmm" }
# Docker's BuildKit driver uses HTTP/2 over the existing local engine socket.
h2 = "0.4"
bytes = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAlert", "NSButton", "NSControl", "NSResponder", "NSWindow", "NSView", "NSGraphics", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFontCollection", "CTFontDescriptor", "CTFontTraits"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSNotification", "NSGeometry", "NSObject", "NSAppleScript", "NSDictionary"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKNavigation"] }

# The Linux window (`asagiri ui`), only with `--features window`: the engine and
# CLI stay one static binary with no desktop libraries; the window is a
# separate build that links the system's GTK 3 and WebKitGTK 4.1.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", optional = true, features = ["v2_40"] }
javascriptcore-rs = { version = "1", optional = true }
# The tray (issue #405): StatusNotifierItem over D-Bus, pure Rust, no
# libappindicator and no deprecated GTK StatusIcon. `blocking` for the
# spawn/update/shutdown API; `async-io` instead of the default tokio, so
# the window pulls in no async runtime it doesn't already use. Unlicense,
# which deny.toml allows.
# ksni PR 48 migrates the tray to zbus 6. Pin until the port is released.
ksni = { path = "../../vendor/ksni", optional = true, default-features = false, features = ["async-io", "blocking"] }

# The tests read back the tar archives the managed builder writes.
[dev-dependencies]
tar = "0.4"

[features]
window = ["dep:gtk", "dep:webkit2gtk", "dep:javascriptcore-rs", "dep:ksni"]

[lints]
workspace = true
