name: Compare Windows Docker CLI context selection
on:
  push:
    branches: [qualification/windows-running-111]
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    steps:
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $terminal = (Get-Command docker.exe).Source
          gh run download 45265682170 -R AndreKurait/asagiri -n packages-windows-x86_64
          if ($LASTEXITCODE) { throw 'Package download failed' }
          Expand-Archive Asagiri-0.1.14-dev.247-windows-x86_64.zip bundle
          $packaged = (Get-ChildItem bundle -Recurse -Filter docker.exe | Select-Object -First 1).FullName
          if (!$packaged -or $terminal -eq $packaged) { throw 'Two distinct clients required' }
          $env:DOCKER_CONFIG = Join-Path $env:RUNNER_TEMP 'issue175-config'
          Remove-Item Env:DOCKER_HOST,Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          Write-Host "Terminal=$terminal Packaged=$packaged"
          & $packaged context create asagiri --docker 'host=npipe:////./pipe/asagiri'
          if ($LASTEXITCODE) { throw 'Context creation failed' }
          foreach ($name in 'default','asagiri') {
            & $packaged context use $name
            if ($LASTEXITCODE) { throw 'Context selection failed' }
            foreach ($cli in $packaged,$terminal) {
              $selected = & $cli context show
              $endpoint = & $cli context inspect --format '{{.Endpoints.docker.Host}}' $selected
              Write-Host "$cli selected=$selected endpoint=$endpoint"
              if ($LASTEXITCODE -or $selected -ne $name) { throw 'Context mismatch' }
              if ($name -eq 'asagiri' -and $endpoint -ne 'npipe:////./pipe/asagiri') { throw 'Endpoint mismatch' }
            }
          }
          $app = (Get-ChildItem bundle -Recurse -Filter asagiri-win.exe).FullName
          $rootfs = Join-Path (Split-Path $app) 'asagiri-linux.tar.gz'
          wsl.exe --import Asagiri-context175 "$env:RUNNER_TEMP\context175-distro" $rootfs --version 2
          if ($LASTEXITCODE) { throw 'Could not import the packaged WSL distro' }
          $launcher = Start-Process $app -ArgumentList '--distro','Asagiri-context175','--pipe','\\.\pipe\asagiri' -PassThru
          try {
            for ($i=0; $i -lt 90; $i++) {
              & $packaged info 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 2
            }
            if ($LASTEXITCODE) { throw 'Packaged engine did not answer' }
            & $packaged pull alpine:3.21
            if ($LASTEXITCODE) { throw 'Image pull failed' }
            $expected = & $packaged image inspect alpine:3.21 --format '{{.Id}}'
            if ($LASTEXITCODE -or $expected -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing packaged image ID' }
            foreach ($cli in $packaged,$terminal) {
              $server = & $cli version --format '{{.Server.Version}}'
              if ($LASTEXITCODE -or $server -notmatch 'asagiri') { throw 'Unexpected serving engine' }
              $actual = & $cli image inspect alpine:3.21 --format '{{.Id}}'
              if ($LASTEXITCODE -or $actual -ne $expected) { throw 'Image inventory mismatch' }
              Write-Host "$cli server=$server alpine=$actual"
            }
            $saved = & $packaged run -d --restart always --name retained189 alpine:3.21 sleep 3600
            if ($LASTEXITCODE) { throw 'Creating the pre-restart container failed' }
            & $packaged exec retained189 sh -c 'echo before-interruption > /tmp/marker'
            if ($LASTEXITCODE) { throw 'Running workload baseline failed' }
            wsl.exe --terminate Asagiri-context175
            if ($LASTEXITCODE) { throw 'WSL termination failed' }
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $restored = & $terminal inspect retained189 --format '{{.Id}}'
            $elapsed = $timer.Elapsed.TotalSeconds
            Write-Host "First inspect after WSL termination took $elapsed seconds; exit=$LASTEXITCODE"
            if ($LASTEXITCODE -or $restored -ne $saved) { throw 'First inspect did not recover the existing container' }
            for ($i=0; $i -lt 30; $i++) {
              $marker = & $terminal exec retained189 cat /tmp/marker
              if ($LASTEXITCODE -eq 0 -and $marker -eq 'before-interruption') { break }
              Start-Sleep -Seconds 2
            }
            if ($LASTEXITCODE -or $marker -ne 'before-interruption') { throw 'Previously running workload did not recover automatically' }
            Write-Host 'Running workload recovered with original ID and filesystem marker'
          } finally {
            if (!$launcher.HasExited) { Stop-Process -Id $launcher.Id }
            wsl.exe --terminate Asagiri-context175
          }
