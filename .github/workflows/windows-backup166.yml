name: Windows storage backup restoration
on:
  push:
    branches: [qualification/windows-backup-166]
permissions:
  contents: read
jobs:
  restore:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Move storage, import a fresh distro and restore the independent backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/windows-storage-move.ps1
