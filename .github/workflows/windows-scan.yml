name: Windows CLI scan through Asagiri WSL
on:
  push:
    branches: [qualification/windows-scan-248]
    paths: [.github/workflows/windows-scan.yml]
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sh scripts/ci/build-linux.sh "$RUNNER_TEMP/guest" "$RUNNER_TEMP/target" "$RUNNER_TEMP/registry" build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guest-engine
          path: ${{ runner.temp }}/guest/asagiri
  windows:
    needs: guest
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: guest-engine
          path: candidate
      - name: Exercise the Windows executable with a real WSL image store
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p asagiri
          $cli = (Resolve-Path target/debug/asagiri.exe).Path
          $asset = 'Asagiri-0.1.14-dev.158-windows-x86_64.zip'
          gh release download v0.1.14-dev.158 -R AndreKurait/asagiri -p $asset -D $env:RUNNER_TEMP
          $zip = Join-Path $env:RUNNER_TEMP $asset
          if ((Get-FileHash $zip).Hash.ToLower() -ne '62299f7f19506e2fc01d91b2f55f8a56347eb9c0a754afd75796d6fd6bfb5db6') { throw 'Bundle hash mismatch' }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/bundle"
          $rootfs = (Get-ChildItem "$env:RUNNER_TEMP/bundle" -Recurse -Filter asagiri-linux.tar.gz).FullName
          $distro = 'Asagiri-scan-248'
          wsl.exe --import $distro "$env:RUNNER_TEMP/scan-distro" $rootfs --version 2
          wsl.exe -d $distro --cd "$env:GITHUB_WORKSPACE" -u root --exec install -m 755 candidate/asagiri /usr/local/bin/asagiri-candidate
          wsl.exe -d $distro -u root --exec mv /usr/local/bin/asagiri-candidate /usr/local/bin/asagiri
          wsl.exe -d $distro -u root --exec env HOME=/var/lib/asagiri-daemon /usr/local/bin/asagiri raw pull alpine:3.22
          $setup = New-Item -Force -Type Directory "$env:LOCALAPPDATA/Asagiri"
          @{distro=$distro} | ConvertTo-Json | Set-Content "$setup/setup.json" -Encoding utf8NoBOM
          $empty = & $cli scan --history --json alpine:3.22 | ConvertFrom-Json
          if ($empty.scans.Count -ne 0) { throw 'Expected empty history' }
          $report = & $cli scan --json alpine:3.22 | ConvertFrom-Json
          if (!$report.db -or $report.packages -le 0) { throw 'Missing scan data' }
          $history = & $cli scan --history --json alpine:3.22 | ConvertFrom-Json
          if ($history.id -ne $empty.id -or $history.scans.Count -ne 1) { throw 'Invalid history' }
          Write-Host "PASS Windows CLI scan $($report.packages) packages, database $($report.db), image $($history.id)"
