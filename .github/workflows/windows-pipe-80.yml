name: Native Windows Docker API connection reuse
on:
  push:
    branches: [qualification/windows-pipe-80]
permissions:
  actions: read
  contents: read
jobs:
  transport:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Verify two Docker API responses on one native pipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          cd $env:RUNNER_TEMP
          $asset = "Asagiri-0.1.14-dev.161-windows-x86_64.zip"
          gh release download v0.1.14-dev.161 -R AndreKurait/asagiri -p $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne "9e6802f5040fcc6e24827bbfaf996f96ce00648707b2077a2fad6a6f315a119b") { throw "bundle hash" }
          Expand-Archive $asset bundle
          gh run download 45010054727 -R AndreKurait/asagiri -n windows-X64 -D candidate
          if ((Get-FileHash candidate/asagiri-win.exe).Hash.ToLower() -ne "acddd4b265ec4558199bea2dbf75d40f5ea5cd57cd0ae631a6f67cb9f8c5e4a8") { throw "candidate hash" }
          $env:PIPE_APP = (Get-ChildItem bundle -Recurse -Filter asagiri-win.exe).FullName
          Copy-Item candidate/asagiri-win.exe $env:PIPE_APP -Force
          gh run download 45010054727 -R AndreKurait/asagiri -n linux-X64 -D portable
          if ($LASTEXITCODE) { throw "portable artifact download" }
          if ((Get-Content portable/SOURCE_COMMIT -Raw).Trim() -ne "988bfbbf7851160b16933684961db96910f954b7") { throw "engine source" }
          @'
          import hashlib, os, pathlib, shutil, tarfile
          root = pathlib.Path("portable")
          appdir = pathlib.Path(os.environ["PIPE_APP"]).parent
          hashes = dict(line.split()[::-1] for line in (root / "SHA256SUMS").read_text().splitlines())
          expected = {"asagiri", "asagiri-init"}
          for name in expected:
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == hashes[name]
              shutil.copyfile(root / name, appdir / name)
          installed = set()
          with tarfile.open(appdir / "asagiri-linux.tar.gz", "r:gz") as src, tarfile.open("qualification.tar.gz", "w:gz") as dst:
              for member in src:
                  path = pathlib.PurePosixPath(member.name)
                  if path.parent == pathlib.PurePosixPath("usr/local/bin") and path.name in expected:
                      assert member.isfile()
                      member.size = (root / path.name).stat().st_size
                      with (root / path.name).open("rb") as binary:
                          dst.addfile(member, binary)
                      installed.add(path.name)
                  else:
                      dst.addfile(member, src.extractfile(member) if member.isfile() else None)
          assert installed == expected, installed
          '@ | python -
          if ($LASTEXITCODE) { throw "qualified root filesystem assembly" }
          wsl.exe --import Asagiri-pipe80 "$env:RUNNER_TEMP\picker-distro" "$env:RUNNER_TEMP\qualification.tar.gz" --version 2
          if ($LASTEXITCODE) { throw "WSL import" }
          @'
          import http.client, io, json, os, subprocess, time
          class Connection:
              def __init__(self, pipe):
                  self.pipe = pipe
              def makefile(self, mode):
                  return io.BufferedReader(io.FileIO(self.pipe.fileno(), "rb", closefd=False))
          name = r"\\.\pipe\asagiri-qualification80"
          app = subprocess.Popen([os.environ["PIPE_APP"], "--background", "--distro", "Asagiri-pipe80", "--pipe", name])
          try:
              deadline = time.monotonic() + 120
              while True:
                  try:
                      pipe = open(name, "r+b", buffering=0)
                      break
                  except OSError:
                      if app.poll() is not None or time.monotonic() >= deadline:
                          raise
                      time.sleep(1)
              with pipe:
                  for path in ("/_ping", "/version"):
                      pipe.write(f"GET {path} HTTP/1.1\r\nHost: localhost\r\n\r\n".encode("ascii"))
                      response = http.client.HTTPResponse(Connection(pipe))
                      response.begin()
                      body = response.read()
                      assert response.status == 200, (path, response.status, body)
                      if path == "/_ping":
                          assert body.strip() == b"OK", body
                      else:
                          print("Engine version", json.loads(body)["Version"])
                      print("PASS", path, "on the same named pipe", flush=True)
              # Read beyond the complete ping response on a separate connection.
              # A subprocess bounds the wait even if the synchronous pipe never closes.
              probe = r'''
          import http.client, io, sys
          with open(sys.argv[1], "r+b", buffering=0) as pipe:
              pipe.write(b"GET /v1.47/_ping HTTP/1.1\r\nHost: docker\r\nConnection: close\r\n\r\n")
              reader = io.BufferedReader(io.FileIO(pipe.fileno(), "rb", closefd=False))
              class Connection:
                  def makefile(self, mode):
                      return reader
              response = http.client.HTTPResponse(Connection())
              response.begin()
              assert response.status == 200, response.status
              assert response.read().strip() == b"OK"
              try:
                  trailing = pipe.read(1)
              except BrokenPipeError:
                  trailing = b""
              assert trailing == b"", trailing
              print("PASS connection closed after versioned ping", flush=True)
          '''
              import sys
              subprocess.run([sys.executable, "-c", probe, name], timeout=12, check=True)
              import pathlib
              project = pathlib.Path("start-probe")
              subprocess.run(["dotnet", "new", "console", "-o", str(project)], check=True)
              subprocess.run(["dotnet", "add", "package", "Testcontainers", "--version", "4.11.0"], cwd=project, check=True)
              (project / "Program.cs").write_text('''
          using DotNet.Testcontainers.Builders;
          using var timeout = new CancellationTokenSource(TimeSpan.FromMinutes(4));
          await using var container = new ContainerBuilder()
              .WithImage("alpine:3.21")
              .WithCommand("sh", "-c", "echo asagiri-ready && sleep 120")
              .WithWaitStrategy(Wait.ForUnixContainer().UntilMessageIsLogged("asagiri-ready"))
              .Build();
          await container.StartAsync(timeout.Token);
          Console.WriteLine("PASS Testcontainers start and log readiness: " + container.Id);
          ''', encoding="utf-8")
              env = dict(os.environ, DOCKER_HOST="npipe://./pipe/asagiri-qualification80")
              subprocess.run(["dotnet", "run"], cwd=project, env=env, timeout=360, check=True)
          finally:
              app.terminate()
              app.wait(timeout=30)
          '@ | python -
          if ($LASTEXITCODE) { throw "Named pipe qualification failed" }
