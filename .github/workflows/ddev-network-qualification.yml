name: Combined DDEV network qualification
on:
  push:
    branches: [qualification/ddev-network-142-combined]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.99.1
jobs:
  ddev:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] run the action from the exact checkout under test; supported by our actionlint
      - name: Restore Linux dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v2-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/ci/images.json', 'scripts/ci/build-linux.sh') }}
      - name: Build combined engine and guest
        run: sh scripts/ci/build-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/cargo-registry" build
      - name: Test a real DDEV PHP, MariaDB and HTTPS project
        run: python3 scripts/ci/ddev.py "$RUNNER_TEMP/bin" --output "$RUNNER_TEMP/ddev"
      - name: Preserve DDEV runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddev-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/ddev/*.json
            ${{ runner.temp }}/ddev/*.log
          retention-days: 90
