# Asagiri's speed check on every pull request: main and the change, built the
# same way and run side by side on one machine (scripts/perf-run.sh), with
# requests alternating between them. The table lands in the run's summary;
# the check fails when the change is slower than main past the limits in
# scripts/perf.py: docker run, API round trips, the daemon's memory and the
# system calls one container costs.
#
# The limits come from main's copy of the script when it has one, so a pull
# request can't loosen them for itself.
#
# Safe for pull requests from forks: it runs on GitHub's machines with a
# read-only token and no secrets, and uses pull_request (never
# pull_request_target), so a fork's code can't write to the repository.
name: Speed

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1

concurrency:
  group: speed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The change as it would merge (GitHub's merge commit), and main as
      # that commit's first parent, so both sides start from the same main.
      - name: Check out this change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: head
          persist-credentials: false
      - name: Find the comparison baseline
        id: main
        env:
          PREVIOUS_MAIN: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # A push can contain several commits. Compare the previous main,
            # not just the last commit on the new branch.
            [[ "$PREVIOUS_MAIN" =~ ^[0-9a-f]{40}$ ]]
            git -C head fetch --no-tags --depth=1 origin "$PREVIOUS_MAIN"
            sha=$PREVIOUS_MAIN
          else
            sha=$(git -C head rev-parse HEAD^1)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.main.outputs.sha }}
          path: base
          persist-credentials: false
      - name: Restore Linux dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v1-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('head/Cargo.lock', 'head/**/Cargo.toml', 'head/.cargo/config.toml') }}
      - name: Build main and this change
        run: |
          build="$GITHUB_WORKSPACE/head/scripts/ci/build-linux.sh"
          for e in base head; do
            # Only dependencies are reused; both engines are freshly compiled.
            (cd "$e" && sh "$build" "$RUNNER_TEMP/$e-bin" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/cargo-registry" build)
          done
          ls -l "$RUNNER_TEMP"/base-bin "$RUNNER_TEMP"/head-bin
      - name: Check whether the engine binaries changed
        id: binaries
        run: |
          if cmp -s "$RUNNER_TEMP/base-bin/asagiri" "$RUNNER_TEMP/head-bin/asagiri" &&
             cmp -s "$RUNNER_TEMP/base-bin/asagiri-init" "$RUNNER_TEMP/head-bin/asagiri-init"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Both freshly compiled engine binaries match the baseline byte for byte; no performance measurement is needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install strace
        if: steps.binaries.outputs.changed == 'true'
        run: sudo apt-get install -y -qq strace >/dev/null
      - name: Compare
        if: steps.binaries.outputs.changed == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          scripts=base/scripts
          [ -f "$scripts/perf.py" ] || scripts=head/scripts
          set +e
          sh "$scripts/perf-run.sh" "$RUNNER_TEMP/base-bin" "$RUNNER_TEMP/head-bin" "$RUNNER_TEMP/perf"
          status=$?
          if [ -f "$RUNNER_TEMP/perf/report.md" ]; then
            [ -n "$PR" ] && echo "Pull request #$PR" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/perf/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
