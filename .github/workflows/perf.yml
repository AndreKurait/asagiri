# Asagiri's speed check on every pull request: main and the change, built the
# same way and run side by side on one machine (scripts/perf-run.sh), with
# requests alternating between them. The table lands in the run's summary;
# the check fails when the change is slower than main past the limits in
# scripts/perf.py: docker run, API round trips, the daemon's memory and the
# system calls one container costs.
#
# The limits come from main's copy of the script when it has one, so a pull
# request can't loosen them for itself.
#
# Safe for pull requests from forks: it runs on GitHub's machines with a
# read-only token and no secrets, and uses pull_request (never
# pull_request_target), so a fork's code can't write to the repository.
name: Speed

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline:
        description: Optional full main-ancestor commit to compare (same commit runs a noise control)
        type: string
      harness:
        description: Harness for this experiment; current can measure older commits with new metrics
        type: choice
        options: [baseline, current]
        default: baseline

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1

concurrency:
  # Keep every main measurement; only superseded PR measurements are canceled.
  group: speed-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  speed:
    # An experiment must never satisfy the PR's required "speed" check.
    name: ${{ github.event_name == 'workflow_dispatch' && 'speed experiment' || 'speed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The change as it would merge (GitHub's merge commit), and main as
      # that commit's first parent, so both sides start from the same main.
      - name: Check out this change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: head
          persist-credentials: false
      - name: Find the comparison baseline
        id: main
        env:
          PREVIOUS_MAIN: ${{ github.event.before }}
          REQUESTED_BASELINE: ${{ inputs.baseline }}
        run: |
          if [ -n "$REQUESTED_BASELINE" ]; then
            [[ "$REQUESTED_BASELINE" =~ ^[0-9a-f]{40}$ ]]
            git -C head fetch --unshallow --no-tags origin main
            git -C head fetch --no-tags origin "$REQUESTED_BASELINE"
            git -C head merge-base --is-ancestor "$REQUESTED_BASELINE" HEAD
            sha=$REQUESTED_BASELINE
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # A push can contain several commits. Compare the previous main,
            # not just the last commit on the new branch.
            [[ "$PREVIOUS_MAIN" =~ ^[0-9a-f]{40}$ ]]
            git -C head fetch --no-tags --depth=1 origin "$PREVIOUS_MAIN"
            sha=$PREVIOUS_MAIN
          else
            sha=$(git -C head rev-parse HEAD^1)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.main.outputs.sha }}
          path: base
          persist-credentials: false
      - name: Restore Linux dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v2-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('head/Cargo.lock', 'head/**/Cargo.toml', 'head/.cargo/config.toml', 'head/scripts/ci/images.json', 'head/scripts/ci/build-linux.sh') }}
      - uses: ./head/.github/actions/container-cache # zizmor: ignore[self-repository] use the explicit head checkout alongside the separate baseline
        with:
          source-directory: head
      - name: Build main and this change
        run: |
          build="$GITHUB_WORKSPACE/head/scripts/ci/build-linux.sh"
          for e in base head; do
            # Only dependencies are reused; both engines are freshly compiled.
            (cd "$e" && sh "$build" "$RUNNER_TEMP/$e-bin" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/cargo-registry" build)
          done
          ls -l "$RUNNER_TEMP"/base-bin "$RUNNER_TEMP"/head-bin
      - name: Check whether the engine binaries changed
        id: binaries
        run: |
          if cmp -s "$RUNNER_TEMP/base-bin/asagiri" "$RUNNER_TEMP/head-bin/asagiri" &&
             cmp -s "$RUNNER_TEMP/base-bin/asagiri-init" "$RUNNER_TEMP/head-bin/asagiri-init"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Both freshly compiled engine binaries match the baseline byte for byte. PR measurements can be skipped; main and manual runs still collect history." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install strace
        if: steps.binaries.outputs.changed == 'true' || github.event_name != 'pull_request'
        run: sudo apt-get install -y -qq strace >/dev/null
      - name: Compare
        id: compare
        if: steps.binaries.outputs.changed == 'true' || github.event_name != 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          REQUESTED_HARNESS: ${{ inputs.harness }}
        run: |
          scripts=base/scripts
          # Only the separately named manual experiment can select the current
          # harness. PR and push regression checks retain baseline-owned limits.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REQUESTED_HARNESS" = current ]; then
            scripts=head/scripts
          fi
          [ -f "$scripts/perf.py" ] || scripts=head/scripts
          echo "harness=$(git -C "${scripts%/scripts}" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          set +e
          sh "$scripts/perf-run.sh" "$RUNNER_TEMP/base-bin" "$RUNNER_TEMP/head-bin" "$RUNNER_TEMP/perf"
          status=$?
          if [ -f "$RUNNER_TEMP/perf/report.md" ]; then
            [ -n "$PR" ] && echo "Pull request #$PR" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/perf/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Record measurements and source identities
        if: ${{ !cancelled() && (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure') }}
        env:
          BASE_COMMIT: ${{ steps.main.outputs.sha }}
          HARNESS_COMMIT: ${{ steps.compare.outputs.harness }}
          COMPARISON_OUTCOME: ${{ steps.compare.outcome }}
          PERF_RUNNER_IMAGE: ${{ runner.os }}-${{ runner.arch }}
        run: >-
          python3 head/scripts/ci/performance.py record
          --directory "$RUNNER_TEMP/perf"
          --base-binaries "$RUNNER_TEMP/base-bin"
          --head-binaries "$RUNNER_TEMP/head-bin"
      - name: Keep benchmark data and report
        if: ${{ !cancelled() && (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/perf/record.json
            ${{ runner.temp }}/perf/results.json
            ${{ runner.temp }}/perf/sizes.json
            ${{ runner.temp }}/perf/report.md
          if-no-files-found: error
          retention-days: 90
