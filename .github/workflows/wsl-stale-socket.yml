name: WSL2 bridge stale socket and recovery
on:
  push:
    branches: [qualification/wsl-stale-socket-189]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo test --locked --target x86_64-unknown-linux-musl -p asagiri --bin asagiri --no-run --message-format=json > build.jsonl
          exe=$(jq -rs 'map(select(.reason == "compiler-artifact" and .target.name == "asagiri" and .profile.test and .executable != null)) | last.executable' build.jsonl)
          install -m 755 "$exe" bridge-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bridge-tests
          path: bridge-tests
  wsl:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bridge-tests
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = 'Asagiri-0.1.14-windows-x86_64.zip'
          gh release download v0.1.14 --repo AndreKurait/asagiri --pattern $name
          Expand-Archive $name -DestinationPath bundle
          $guest = (Get-ChildItem bundle -Recurse -Filter asagiri-linux.tar.gz).FullName
          wsl.exe --import AsagiriBridge189 "$env:RUNNER_TEMP/bridge189" $guest --version 2
          if ($LASTEXITCODE) { throw 'WSL2 import failed' }
          wsl.exe -d AsagiriBridge189 -u root -- sh -ec 'cp ./bridge-tests /tmp/bridge-tests; chmod 755 /tmp/bridge-tests; uname -r; /tmp/bridge-tests bridge::tests --nocapture --test-threads=1'
          exit $LASTEXITCODE
