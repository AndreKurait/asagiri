name: Verify native Linux registry settings
on:
  push:
    branches: [qualification/linux-registry-settings-153]
permissions:
  actions: read
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exercise packaged GTK dashboard against a private daemon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb xauth dbus-x11 python3-pyatspi xdotool at-spi2-core
          gh run download 45098441101 -R AndreKurait/asagiri -n appimage-X64 -D package
          app="$PWD/package/Asagiri-0.0.0-x86_64.AppImage"
          echo "e8dc0b86afc72080c0ef8f9cac958a5782ba707bd3619227392ab2a928f94be3  $app" | sha256sum -c -
          chmod +x "$app"
          "$app" --appimage-extract >/dev/null
          export HOME="$RUNNER_TEMP/test-home" ASAGIRI_SOCKET="/run/asagiri/docker.sock" ASAGIRI_DATA_DIR="$RUNNER_TEMP/test-store"
          test ! -e "$ASAGIRI_SOCKET"
          sudo mkdir -p /run/asagiri
          mkdir -p "$HOME/.asagiri/run"
          echo '{"lang":"en","langAsked":true,"domainsAsked":true,"setupSkip":["docker","builds"]}' > "$HOME/.asagiri/ui.json"
          sudo env HOME="$HOME" ASAGIRI_SOCKET="$ASAGIRI_SOCKET" ASAGIRI_DATA_DIR="$ASAGIRI_DATA_DIR" "$PWD/squashfs-root/usr/bin/asagiri" daemon >daemon.log 2>&1 &
          for i in {1..40}; do test -S "$ASAGIRI_SOCKET" && break; sleep 1; done
          sudo chown "$(id -u):$(id -g)" "$ASAGIRI_SOCKET"
          curl -fsS --unix-socket "$ASAGIRI_SOCKET" http://localhost/_ping
          export GTK_MODULES=gail:atk-bridge
          dbus-run-session -- xvfb-run -a bash -eu -s -- "$app" <<'SH'
          "$1" --appimage-extract-and-run ui --view settings >ui.log 2>&1 &
          /usr/bin/python3 - <<'PY'
          import pyatspi as a, time
          def controls():
              return a.findAllDescendants(a.Registry.getDesktop(0), lambda n: True)
          def press(label):
              for _ in range(45):
                  for n in controls():
                      if n.name == label:
                          try:
                              if n.queryAction().doAction(0): return
                          except NotImplementedError: pass
                  time.sleep(1)
              raise RuntimeError((label, [(n.getRoleName(), n.name) for n in controls() if n.name][-100:]))
          press('English Same as Linux Hello')
          press('Continue')
          press('Keep building with Docker')
          for expected in (1, 2):
              press('Skip')
              for _ in range(45):
                  undo_count = sum(n.name == 'Undo' for n in controls())
                  if undo_count >= expected:
                      break
                  time.sleep(1)
              else:
                  raise RuntimeError(('Skip was not acknowledged', expected, [(n.getRoleName(), n.name) for n in controls() if n.name][-100:]))
          press('Open Asagiri')
          press('Registry mirrors')
          time.sleep(2)
          print([(n.getRoleName(),n.name) for n in controls() if n.name or n.getRoleName()=='text'],flush=True)
          # Runs in the packaged dashboard's AT-SPI test after opening Registry mirrors.
          import json
          import os
          import subprocess


          def exception_field():
              for _ in range(30):
                  for control in controls():
                      if control.name == 'Insecure registries':
                          return control
                  time.sleep(0.5)
              raise RuntimeError('Missing editable Insecure registries field')


          def exceptions():
              data = subprocess.check_output(['curl', '-fsS', '--unix-socket', os.environ['ASAGIRI_SOCKET'], 'http://localhost/asagiri/daemon-config'])
              return json.loads(data).get('insecure-registries', [])


          assert exceptions() == []
          for value in ['registry.test:5153', '']:
              field = exception_field()
              if not field.queryComponent().grabFocus(): raise RuntimeError('Registry field could not receive focus')
              subprocess.run(['xdotool','key','ctrl+a','BackSpace'],check=True)
              if value: subprocess.run(['xdotool','type',value],check=True)
              press('Save')
              expected = [value] if value else []
              for _ in range(30):
                  if exceptions() == expected:
                      break
                  time.sleep(0.5)
              else:
                  raise RuntimeError(('Saved exceptions differ', expected, exceptions()))
              press('Appearance')
              press('Registry mirrors')
              text = exception_field().queryText().getText(0, -1)
              assert text == value, (text, value)
              print('Verified saved exceptions through daemon and reopened GTK field:', expected, flush=True)
          PY
          SH
