name: Resume release publication

on:
  # Inspect trusted metadata only. Never execute a triggering workflow's code
  # or artifacts with the token that can request a retry.
  workflow_run: # zizmor: ignore[dangerous-triggers] same-repository main checks or official release; trusted workflow checkout, no artifact execution
    workflows: [Platform builds, UI tests, Security, Speed, CodeQL, Engine comparison, Release]
    types: [completed]

permissions: {}

concurrency:
  # A completion during an active check gets one follow-up, without duplicate retries.
  group: release-retry-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.repository == 'AndreKurait/asagiri' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      ((github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name != 'Release') ||
       (github.event.workflow_run.name == 'Release' &&
        github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resume publication after the exact source checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release.py retry
