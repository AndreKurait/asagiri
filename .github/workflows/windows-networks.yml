name: Published WSL network drivers and bridge options
on:
  push:
    branches: [qualification/windows-networks-114]
    paths: [.github/workflows/windows-networks.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the network fixtures in the published WSL distro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.205-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.205 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '6c418ff6b768dffbabad468e0b9c4ab0b2a73729249ed3c02a52a4c22712e3a7') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          wsl.exe --import Asagiri-net-114 "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','Asagiri-net-114','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Invoke-Docker @('pull','alpine:3.21')
            wsl.exe -d Asagiri-net-114 -u root -- ip link show dev eth0
            if ($LASTEXITCODE) { throw 'Missing WSL eth0 parent for driver check' }
            foreach ($driver in 'macvlan','ipvlan') {
              $name = "explicit-parent-$driver"
              $diagnostic = (& $docker network create -d $driver -o parent=eth0 $name 2>&1 | Out-String)
              if ($LASTEXITCODE -eq 0) {
                Invoke-Docker @('network','rm',$name)
                throw "Unexpected explicit parent support for $driver"
              }
              if (!$diagnostic.Contains("$driver networks have no parent interface (-o parent=eth0)")) { throw $diagnostic }
              Write-Host "PASS $driver explicit eth0 parent diagnostic"
            }
            $address = '2606:4700:4700::1111'
            curl.exe -6 --noproxy '*' --connect-timeout 8 --max-time 15 --silent --show-error --output NUL "http://[$address]/"
            if ($LASTEXITCODE) { throw 'Windows host has no verified external IPv6 HTTP path; container egress inconclusive' }
            wsl.exe -d Asagiri-net-114 -u root -- ip -6 route get $address
            if ($LASTEXITCODE) { throw 'Windows host reached IPv6 but the WSL guest lacks an external route' }
            Invoke-Docker @('network','create','--ipv6','--subnet','fd42:114::/64','egress114')
            try {
              Invoke-Docker @('run','--rm','--network','egress114','alpine:3.21','sh','-ec','ip -6 route; wget -T 15 -S -O /dev/null http://[2606:4700:4700::1111]/')
            } finally {
              Invoke-Docker @('network','rm','egress114')
            }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate Asagiri-net-114
          }
