name: Published WSL network drivers and bridge options
on:
  push:
    branches: [qualification/windows-networks-114]
    paths: [.github/workflows/windows-networks.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the network fixtures in the published WSL distro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.188-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.188 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '3ee017d9c8ee94292197badf38f432fc5eeb134892bf6311f1e85aa1ddebc854') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          wsl.exe --import Asagiri-net-114 "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','Asagiri-net-114','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Invoke-Docker @('pull','alpine:3.21')
            $repo = (wsl.exe -d Asagiri-net-114 --cd "$env:GITHUB_WORKSPACE" --exec pwd)
            if ($LASTEXITCODE -or !$repo) { throw 'Cannot resolve checkout inside WSL' }
            $repo = $repo.Trim()
            wsl.exe -d Asagiri-net-114 -u root -- apk add --no-cache python3 docker-cli ca-certificates
            if ($LASTEXITCODE) { throw 'Cannot install native WSL test clients' }
            $failed = @()
            foreach ($suite in 'network-internal-gateway','inspect-port-bindings') {
              Write-Host "Running $suite"
              wsl.exe -d Asagiri-net-114 -u root -- python3 "$repo/tests/$suite.py" /var/lib/asagiri-daemon/.asagiri/run/docker.sock alpine:3.21
              if ($LASTEXITCODE) { $failed += $suite } else { Write-Host "PASS $suite" }
            }
            if ($failed.Count) { throw "Failed suites: $($failed -join ', ')" }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate Asagiri-net-114
          }
