name: Published Windows default Docker CLI endpoint
on:
  push:
    branches: [qualification/windows-default-cli-98]
    paths: [.github/workflows/windows-networks.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the bundled CLI with an empty Docker configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.188-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.188 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '3ee017d9c8ee94292197badf38f432fc5eeb134892bf6311f1e85aa1ddebc854') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          wsl.exe --import Asagiri-net-114 "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','Asagiri-net-114','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Invoke-Docker @('pull','alpine:3.21')
            $id = (& $docker create alpine:3.21 echo default-endpoint-98).Trim()
            if ($LASTEXITCODE -or !$id) { throw 'Could not create reference container on Asagiri' }
            $other = Get-Service docker -ErrorAction SilentlyContinue
            if ($other -and $other.Status -eq 'Running') { Stop-Service docker }
            Remove-Item Env:DOCKER_HOST
            $env:DOCKER_CONFIG = Join-Path $env:RUNNER_TEMP 'fresh-docker-config'
            New-Item -ItemType Directory -Path $env:DOCKER_CONFIG | Out-Null
            if ((& $docker context show) -ne 'default') { throw 'Expected the default Docker context' }
            for ($i = 0; $i -lt 45; $i++) {
              $seen = & $docker inspect --format '{{.Id}}' $id 2>$null
              if ($LASTEXITCODE -eq 0 -and $seen -eq $id) { break }
              Start-Sleep -Seconds 2
            }
            if ($seen -ne $id) { throw 'Default endpoint did not find the Asagiri container' }
            $marker = & $docker start -a $id
            if ($LASTEXITCODE -or $marker -ne 'default-endpoint-98') { throw 'Default endpoint execution failed' }
            Write-Host 'PASS default context found and executed the Asagiri container through the bundled CLI'
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate Asagiri-net-114
          }
