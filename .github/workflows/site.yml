name: Website

on:
  pull_request:
    paths:
      - 'site/**'
      - 'brand/**'
      - 'docs/images/**'
      - 'crates/asagiri/src/ui/**'
      - 'scripts/build-site.py'
      - 'scripts/ui-test.py'
      - 'scripts/check-site.py'
      - 'scripts/render-demo.py'
      - 'scripts/ci/requirements-browser.txt'
      - 'scripts/ci/verify-pages.py'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  # Complete the active deployment before the latest main push takes its turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/build-site.py
      - run: python3 scripts/check-site.py
      - name: Check the interactive demo and responsive layouts
        run: |
          python3 -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/pip" install --require-hashes -r scripts/ci/requirements-browser.txt
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/site-chrome"
          chmod +x "$RUNNER_TEMP/site-chrome"
          CHROME="$RUNNER_TEMP/site-chrome" "$RUNNER_TEMP/site-venv/bin/python" scripts/render-demo.py --check
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Verify the published commit, pages, and assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/ci/verify-pages.py "$PAGE_URL" "$GITHUB_SHA"
      - name: Exercise the live demo
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/pip" install --require-hashes -r scripts/ci/requirements-browser.txt
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/site-chrome"
          chmod +x "$RUNNER_TEMP/site-chrome"
          CHROME="$RUNNER_TEMP/site-chrome" "$RUNNER_TEMP/site-venv/bin/python" scripts/render-demo.py --check --base-url "$PAGE_URL"
