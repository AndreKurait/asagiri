name: Website

on:
  pull_request:
    paths:
      - 'site/**'
      - 'brand/**'
      - 'docs/images/**'
      - 'crates/asagiri/src/ui/**'
      - 'scripts/build-site.py'
      - 'scripts/ui-test.py'
      - 'scripts/check-site.py'
      - 'scripts/render-demo.py'
      - 'scripts/ci/requirements-browser.txt'
      - 'scripts/ci/browser.*'
      - 'scripts/ci/verify-pages.py'
      - 'scripts/ci/distribution.py'
      - 'packaging/keys/**'
      - 'tests/ci-distribution.py'
      - 'tests/installer.py'
      - 'tests/ci-browser.py'
      - 'tests/performance-browser.py'
      - 'tests/ci-performance.py'
      - 'tests/ci-pages.py'
      - 'scripts/ci/performance.py'
      - '.github/actions/browser/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers] only successful same-repository releases; checkout is the trusted default-branch SHA, never release artifacts or a PR head
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Job conditions run after workflow concurrency. An ignored release event
  # must not replace a pending deployment from a main push or successful release.
  group: >-
    website-${{ github.event_name == 'workflow_run' &&
    (github.event.workflow_run.conclusion != 'success' ||
    github.event.workflow_run.head_repository.full_name != github.repository ||
    (github.event.workflow_run.event != 'push' && github.event.workflow_run.event != 'workflow_dispatch')) &&
    github.run_id || github.ref }}
  # Complete the active deployment before the latest main push takes its turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    outputs:
      publication: ${{ steps.publication.outputs.id }}
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 scripts/build-site.py
      - name: Check distribution selection and integrity rules
        run: |
          python3 tests/ci-distribution.py
          python3 tests/installer.py
          python3 tests/ci-browser.py
          python3 tests/ci-pages.py
      - run: python3 scripts/check-site.py
      - uses: ./.github/actions/browser # zizmor: ignore[self-repository] use the trusted exact-SHA checkout, consistent with the other local actions and our actionlint
        id: browser
      - name: Check the interactive demo and responsive layouts
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
          SITE_PYTHON: ${{ steps.browser.outputs.python }}
        run: '"$SITE_PYTHON" scripts/render-demo.py --check'
      - name: Check benchmark plots, filters, and responsive layouts
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
          SITE_PYTHON: ${{ steps.browser.outputs.python }}
        run: '"$SITE_PYTHON" tests/performance-browser.py'
      - name: Install repository publishing tools
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm gnupg createrepo-c
      - name: Publish verified downloads and signed RPM repositories
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ASAGIRI_RPM_SIGNING_KEY: ${{ secrets.ASAGIRI_RPM_SIGNING_KEY }}
        run: python3 scripts/ci/distribution.py target/site
      - name: Identify the generated publication
        if: github.event_name != 'pull_request'
        id: publication
        run: |
          publication="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '{"commit":"%s","publication":"%s"}\n' "$GITHUB_SHA" "$publication" > target/site/deployment.json
          printf 'id=%s\n' "$publication" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Verify the published commit, pages, and assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLICATION: ${{ needs.site.outputs.publication }}
        run: |
          test -n "$PUBLICATION"
          python3 scripts/ci/verify-pages.py "$PAGE_URL" "$GITHUB_SHA" --publication "$PUBLICATION"
      - name: Prepare the live browser checks
        uses: ./.github/actions/browser # zizmor: ignore[self-repository] use the trusted exact-SHA checkout, consistent with the other local actions and our actionlint
        id: browser
      - name: Check the live interactive demo and installation page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CHROME: ${{ steps.browser.outputs.chrome }}
          SITE_PYTHON: ${{ steps.browser.outputs.python }}
        run: '"$SITE_PYTHON" scripts/render-demo.py --check --base-url "$PAGE_URL"'
