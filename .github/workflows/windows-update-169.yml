name: Published Windows update and restart
on:
  push:
    branches: [qualification/windows-update-169]
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python -m pip install pywinauto pywin32
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.13 --pattern Asagiri-0.1.13-x86_64.msi
          $msi = (Resolve-Path Asagiri-0.1.13-x86_64.msi).Path
          if ((Get-FileHash $msi).Hash -ne 'd51f996ca5fcd8258b82af05cf10e4ac8fd66d95251ea7285ce44731bb9cad89') { throw 'Baseline hash mismatch' }
          $install = Start-Process msiexec -ArgumentList @('/i', $msi, '/qn', '/norestart') -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $env:ASAGIRI_UPDATE_URL = 'https://github.com/AndreKurait/asagiri/releases/download/v0.1.14/latest-windows-x86_64.json'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP "AsagiriUpdateWebView"
          $exe = (Get-ChildItem "$env:LOCALAPPDATA/Asagiri" -Recurse -Filter asagiri-win.exe | Select-Object -First 1).FullName
          if (!$exe) { throw 'Installed launcher missing' }
          $bundle = Split-Path $exe
          $guest = (Get-ChildItem $bundle -Recurse -Filter asagiri-linux.tar.gz | Select-Object -First 1).FullName
          wsl.exe --import Asagiri "$env:RUNNER_TEMP/Asagiri-distro" $guest --version 2
          if ($LASTEXITCODE) { throw 'Could not import the published WSL distro' }
          # Model an existing install that has already completed onboarding.
          @{done=$true; linux='asagiri'; distro='Asagiri'} | ConvertTo-Json | Set-Content "$env:LOCALAPPDATA/Asagiri/setup.json" -Encoding utf8NoBOM
          Start-Process $exe
          @'
          from pywinauto import Desktop
          window = Desktop(backend='uia').window(title='Asagiri', class_name_re='.*')
          window.wait('visible', timeout=90)
          for label in ('Download', 'Restart now'):
              button = window.child_window(title=label, control_type='Button', found_index=0)
              try:
                  button.wait('visible enabled', timeout=120)
                  button.invoke()
                  print('Invoked', label, flush=True)
              except Exception:
                  print('Visible buttons:', [b.window_text() for b in window.descendants(control_type='Button') if b.is_visible()], flush=True)
                  raise
          '@ | python -
          if ($LASTEXITCODE) { throw 'Update card interaction failed' }
          $deadline = (Get-Date).AddMinutes(3)
          do {
            $product = Get-ItemProperty 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/*' | Where-Object { $_.DisplayName -like '*Asagiri*' -and $_.DisplayVersion -eq '0.1.14' }
            if ($product -and (Get-Process asagiri-win -ErrorAction SilentlyContinue)) { break }
            Start-Sleep 2
          } while ((Get-Date) -lt $deadline)
          if (!$product -or !(Get-Process asagiri-win -ErrorAction SilentlyContinue)) { throw 'New version failed to install and relaunch' }
          if (Test-Path "$env:LOCALAPPDATA/Asagiri/update/version") { throw 'Update still staged after restart' }
          @'
          from pywinauto import Desktop
          import time
          window = Desktop(backend='uia').window(title='Asagiri')
          window.wait('visible', timeout=90)
          for _ in range(30):
              labels = [item.window_text() for item in window.descendants() if item.is_visible()]
              assert all('Restart now' != label and '0.1.14 is ready to install' not in label for label in labels), labels
              assert len(set(labels) - {'', 'Asagiri'}) >= 3, labels
              time.sleep(1)
          print('The relaunched dashboard stayed visible for 30 seconds without the restart prompt.')
          '@ | python -
          if ($LASTEXITCODE) { throw 'Relaunched dashboard verification failed' }
      - name: Inspect launcher startup after failure
        if: failure()
        shell: pwsh
        run: |
          Get-Process asagiri-win,msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Name,Id,SessionId,MainWindowTitle
          Get-NetTCPConnection -LocalPort 9222 -ErrorAction SilentlyContinue | Select-Object State,OwningProcess
          $log = Join-Path $env:LOCALAPPDATA 'Asagiri/asagiri-win.log'
          if (Test-Path $log) { Get-Content $log -Tail 60 }
