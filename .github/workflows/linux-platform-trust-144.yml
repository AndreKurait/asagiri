name: Linux certificate bundle verification
on:
  push:
    branches: [qualification/linux-platform-trust-144]
permissions:
  contents: read
jobs:
  certificate-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo build --locked -p asagiri --bin asagiri
      - name: Verify HTTPS using SSL_CERT_FILE
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/target/debug/asagiri"
          cd "$RUNNER_TEMP"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=fixture-144-root -keyout ca.key -out ca.pem
          openssl req -new -newkey rsa:2048 -nodes -subj /CN=localhost -keyout leaf.key -out leaf.csr
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\n' > extensions
          openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -extfile extensions -out leaf.pem
          mkdir feed
          echo '{"version":"99.0.0","url":"https://localhost/unused","sha256":"unused"}' >feed/latest.json
          python3 - <<'PY' &
          import http.server, ssl, functools, json
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_POST(self):
                  if self.path != '/v1/login/dev':
                      self.send_error(404)
                      return
                  request = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                  body = json.dumps({'login': request['login'], 'token': 'fixture-only'}).encode()
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          server = http.server.HTTPServer(('127.0.0.1', 0), functools.partial(Handler, directory='feed'))
          tls = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          tls.load_cert_chain('leaf.pem', 'leaf.key')
          server.socket = tls.wrap_socket(server.socket, server_side=True)
          with open('port', 'w') as port: print(server.server_port, file=port)
          server.serve_forever()
          PY
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..50}; do [[ -s port ]] && break; sleep 0.1; done
          port=$(cat port)
          export FIXTURE_URL="https://localhost:$port/latest.json"
          unset SSL_CERT_FILE SSL_CERT_DIR ASAGIRI_SHARE_CA
          export ASAGIRI_SHARE_SERVER="localhost:$port" ASAGIRI_SHARE_CONNECT="127.0.0.1:$port"
          export ASAGIRI_DATA_DIR="$RUNNER_TEMP/share-store"
          if "$app" share login --dev probe144 >untrusted.log 2>&1; then exit 1; fi
          grep -F 'UnknownIssuer' untrusted.log
          curl --cacert ca.pem -fsS "$FIXTURE_URL"
          export SSL_CERT_FILE="$PWD/ca.pem"
          "$app" share login --dev probe144 | grep -F 'probe144'
          if ASAGIRI_SHARE_SERVER="127.0.0.1:$port" "$app" share login --dev probe144 >wrong-name.log 2>&1; then exit 1; fi
          grep -F 'NotValidForName' wrong-name.log
