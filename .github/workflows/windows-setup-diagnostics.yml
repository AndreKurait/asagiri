name: Windows first-run setup pull diagnostics
on:
  push:
    branches: [qualification/published-windows-setup-110]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify first-run diagnostics when the configured HTTP proxy refuses connections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.1.14-dev.188'
          $asset = "Asagiri-$version-x86_64.msi"
          Set-Location $env:RUNNER_TEMP
          gh release download "v$version" --repo AndreKurait/asagiri --pattern $asset --pattern SHA256SUMS
          if ($LASTEXITCODE) { throw 'Published installer download failed' }
          $digest = (Get-FileHash $asset).Hash.ToLowerInvariant()
          if (!(Select-String -Path SHA256SUMS -Pattern "^$digest\s+\*?$([regex]::Escape($asset))$" -Quiet)) { throw 'Published MSI checksum mismatch' }
          $bundle = Join-Path $env:LOCALAPPDATA 'Asagiri'
          if (Test-Path $bundle) { throw 'Expected a fresh hosted user profile before installation' }
          $install = Start-Process msiexec -ArgumentList "/i `"$env:RUNNER_TEMP\$asset`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode) { throw "Installer failed: $($install.ExitCode)" }
          $app = Join-Path $bundle 'asagiri-win.exe'
          if ((Get-Item $app).VersionInfo.ProductVersion -ne $version) { throw 'Unexpected installed launcher version' }
          Write-Host "Installed $asset SHA256 $digest"
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          python -m pip install pywinauto
          if ($LASTEXITCODE) { throw 'Unable to install UI automation' }
          $chooseScript = Join-Path $env:GITHUB_WORKSPACE 'tests/windows-choose-linux-109.py'
          $profileDir = Join-Path $env:LOCALAPPDATA 'Asagiri'
          $setupPath = Join-Path $profileDir 'setup.json'
          @{ lang='en'; langAsked=$true } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $profileDir 'ui.json')
          $settings = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          $old = Get-ItemProperty $settings
          try {
            Set-ItemProperty $settings ProxyServer '127.0.0.1:17892'
            Set-ItemProperty $settings ProxyEnable 1
            $process = Start-Process $app -PassThru
            python $chooseScript $process.Id $docker
            if ($LASTEXITCODE) { throw "Could not select Asagiri Linux" }
            $deadline = [DateTime]::UtcNow.AddMinutes(5)
            do {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw "Desktop exited $($process.ExitCode)" }
              if (Test-Path $setupPath) { $saved = Get-Content $setupPath -Raw | ConvertFrom-Json }
            } until ($saved.testError -or [DateTime]::UtcNow -ge $deadline)
            foreach ($detail in 'pull alpine','Docker Hub','127.0.0.1:17892','CONNECT') {
              if ($saved.testError -notmatch [regex]::Escape($detail)) { throw "Missing '$detail' in pull diagnostic: $($saved.testError)" }
            }
            Write-Host "PASS persisted first-run error: $($saved.testError)"
          } finally {
            foreach ($key in 'ProxyServer','ProxyEnable') {
              if ($null -eq $old.$key) { Remove-ItemProperty $settings $key -ErrorAction SilentlyContinue }
              else { Set-ItemProperty $settings $key $old.$key }
            }
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force; $process.WaitForExit() }
          }
          if ($saved.done -ne $false -or $saved.distro -ne 'asagiri') { throw 'Missing incomplete setup state' }
          wsl.exe --terminate asagiri
          if ($LASTEXITCODE) { throw 'Could not stop the guest before relaunch' }
          try {
            $process = Start-Process $app -PassThru
            python (Join-Path $env:GITHUB_WORKSPACE 'tests/windows-observe-setup-recovery.py') $process.Id
            if ($LASTEXITCODE) { throw 'Recovery window did not reach the tools step' }
            $after = Get-Content $setupPath -Raw | ConvertFrom-Json
            if ($after.testError) { throw "Setup still reports a failed pull: $($after.testError)" }
            $reply = & $docker --host npipe:////./pipe/asagiri run --pull=never --rm alpine echo recovered
            if ($LASTEXITCODE -or $reply -notcontains 'recovered') { throw "Container recovery failed: $reply" }
            Write-Host 'PASS recovered the saved setup and ran alpine through the Windows pipe'
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
            $log = Join-Path $profileDir 'asagiri-win.log'
            if (Test-Path $log) { Get-Content $log -Tail 35 }
            wsl.exe --terminate asagiri
          }
