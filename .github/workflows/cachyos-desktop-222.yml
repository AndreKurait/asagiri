name: Boot the CachyOS desktop qualification guest
on:
  push:
    branches: [qualification/cachyos-desktop-222]
    paths: [.github/workflows/cachyos-desktop-222.yml]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Boot the checksum-pinned CachyOS live image on KVM
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso >/dev/null
          iso=cachyos-desktop-linux-261123.iso
          curl --fail --location --retry 3 --output "$iso" "https://mirror.cachyos.org/ISO/desktop/261123/$iso"
          echo "bb9d4c4091ef6445e78f1a67052d9d3f22bdff2608f3b2e226bac99bb0b708ec  $iso" | sha256sum -c -
          mkdir live
          sudo mount -o loop,ro "$iso" live
          find live -iname '*vmlinuz*' -o -iname '*initramfs*' -o -iname 'grub.cfg'
          grep -rhE 'archisolabel=|archisobasedir=' live/boot live/loader 2>/dev/null | head -12 || true
          kernel=live/arch/boot/x86_64/vmlinuz-linux-cachyos-lts
          initrd=live/arch/boot/x86_64/initramfs-linux-cachyos-lts.img
          test -f "$kernel" && test -f "$initrd"
          uuid=$(sudo blkid -s UUID -o value "$iso")
          test -n "$uuid"
          sudo apt-get install -y -qq python3-pexpect >/dev/null
          mkdir payload
          for i in {1..40}; do
            if gh api repos/AndreKurait/asagiri/actions/runs/45580833001/artifacts --jq '.artifacts[].name' | grep -Fxq linux-jammy-inputs; then break; fi
            sleep 10
          done
          gh run download 45580833001 -R AndreKurait/asagiri -n linux-jammy-inputs -D packages
          cp packages/Asagiri-0.1.14-dev.330-x86_64.AppImage payload/asagiri.AppImage
          (cd payload && sha256sum asagiri.AppImage | sed s/asagiri.AppImage/Asagiri.AppImage/ > SHA256SUMS)
          python3 -m http.server 8222 --bind 127.0.0.1 --directory payload >http.log 2>&1 &
          echo  | base64 -d > guest-check.sh
          echo  | base64 -d > console.py
          truncate -s 12G guest-data.raw
          sudo qemu-system-x86_64 -enable-kvm -cpu host -m 8192 -smp 2 -display none -chardev socket,id=serial0,path=console.sock,server=on,wait=off,logfile=guest.log -serial chardev:serial0 -monitor none -no-reboot -drive "file=$iso,format=raw,if=virtio,readonly=on" -drive file=guest-data.raw,format=raw,if=none,id=akdata -device virtio-blk-pci,drive=akdata,serial=ak222data -kernel "$kernel" -initrd "$initrd" -append "archisobasedir=arch archisosearchuuid=$uuid cow_spacesize=5G copytoram=n console=ttyS0,115200 systemd.show_status=1" &
          pid=$!
          trap 'sudo kill "$pid" 2>/dev/null || true; tail -60 guest.log || true' EXIT
          for i in {1..30}; do
            sudo kill -0 "$pid"
            if sudo test -S console.sock; then break; fi
            sleep 1
          done
          sudo /usr/bin/python3 console.py console.sock guest-check.sh
