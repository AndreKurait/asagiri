name: Boot the CachyOS desktop qualification guest
on:
  push:
    branches: [qualification/cachyos-desktop-222]
    paths: [.github/workflows/cachyos-desktop-222.yml]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Boot the checksum-pinned CachyOS live image on KVM
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso >/dev/null
          iso=cachyos-desktop-linux-261123.iso
          curl --fail --location --retry 3 --output "$iso" "https://mirror.cachyos.org/ISO/desktop/261123/$iso"
          echo "bb9d4c4091ef6445e78f1a67052d9d3f22bdff2608f3b2e226bac99bb0b708ec  $iso" | sha256sum -c -
          mkdir live
          sudo mount -o loop,ro "$iso" live
          find live -iname '*vmlinuz*' -o -iname '*initramfs*' -o -iname 'grub.cfg'
          grep -rhE 'archisolabel=|archisobasedir=' live/boot live/loader 2>/dev/null | head -12 || true
          kernel=live/arch/boot/x86_64/vmlinuz-linux-cachyos-lts
          initrd=live/arch/boot/x86_64/initramfs-linux-cachyos-lts.img
          test -f "$kernel" && test -f "$initrd"
          uuid=$(sudo blkid -s UUID -o value "$iso")
          test -n "$uuid"
          sudo qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 -display none -serial file:guest.log -monitor none -no-reboot -drive "file=$iso,format=raw,if=virtio,readonly=on" -kernel "$kernel" -initrd "$initrd" -append "archisobasedir=arch archisosearchuuid=$uuid copytoram=n console=ttyS0,115200 systemd.show_status=1" &
          pid=$!
          trap 'sudo kill "$pid" 2>/dev/null || true; tail -60 guest.log || true' EXIT
          for i in {1..120}; do
            if grep -Eiq 'Reached target .*Graphical Interface|Started .*Display Manager' guest.log 2>/dev/null; then exit 0; fi
            if grep -q "Falling back to interactive prompt" guest.log 2>/dev/null; then exit 1; fi
            kill -0 "$pid" || exit 1
            sleep 3
          done
          exit 1
