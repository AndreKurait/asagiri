name: Published Windows browser named-pipe qualification
on:
  push:
    branches: [qualification/windows-browser-106]
    paths: [.github/workflows/windows-browser-106.yml, tests/windows-browser-106.py]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read a real container through the browser service and Windows named pipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.158-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.158 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '62299f7f19506e2fc01d91b2f55f8a56347eb9c0a754afd75796d6fd6bfb5db6') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          wsl.exe --import Asagiri-browser-106 "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:BROWSER_BUNDLE = $bundle
          try {
            python "$env:GITHUB_WORKSPACE/tests/windows-browser-106.py"
            if ($LASTEXITCODE) { throw 'Browser named-pipe qualification failed' }
          } finally { wsl.exe --terminate Asagiri-browser-106 }
