name: Verify corrected Buildx on native Windows Arm
on:
  push:
    branches: [qualification/stable-windows-buildx-100]
    paths: [.github/workflows/windows-arm-buildx-100.yml]
permissions:
  contents: read
jobs:
  native-plugin:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6686777f39aeaa8df95a4bb9e712f3ebc438dcca
          persist-credentials: false
      - name: Build, verify and execute the pinned ARM64 plugin
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'Expected native Windows ARM64' }
          $exe = "$env:RUNNER_TEMP/docker-buildx.exe"
          python scripts/windows-buildx.py arm64 $exe 25074619db2b6dcc9e9dbd07f09841528796470e11993fd279af6922cd388d1a
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = & $exe version
          if ($LASTEXITCODE -or $version -notmatch 'v0\.38\.1-asagiri\.1') { throw "Unexpected plugin version: $version" }
          $version
          $metadata = & $exe docker-cli-plugin-metadata | ConvertFrom-Json
          if ($LASTEXITCODE -or $metadata.Version -ne 'v0.38.1-asagiri.1') { throw 'Plugin discovery returned an unexpected version' }
