name: Candidate Windows terminal focus
on:
  push:
    branches: [qualification/windows-terminal-focus-candidate-286]
permissions:
  actions: read
  contents: read
jobs:
  terminal:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Exercise terminal input across live engine refreshes
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8:backslashreplace
        run: |
          $ErrorActionPreference = "Stop"
          cd $env:RUNNER_TEMP
          $asset = "Asagiri-0.1.14-dev.188-windows-x86_64.zip"
          gh release download v0.1.14-dev.188 -R AndreKurait/asagiri -p $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne "3ee017d9c8ee94292197badf38f432fc5eeb134892bf6311f1e85aa1ddebc854") { throw "bundle hash" }
          Expand-Archive $asset bundle
          $env:PICKER_APP = (Get-ChildItem bundle -Recurse -Filter asagiri-win.exe).FullName
          gh run download 45096964220 -R AndreKurait/asagiri -n windows-X64 -D candidate
          if ((Get-FileHash candidate/asagiri-win.exe).Hash.ToLower() -ne "6fb2592aa6895175450f376af914fd8f35e2c6122113e997960f45b25982f0f0") { throw 'Candidate binary hash mismatch' }
          Copy-Item candidate/asagiri-win.exe $env:PICKER_APP -Force
          wsl.exe --import Asagiri-focus286 "$env:RUNNER_TEMP\picker-distro" "$(Split-Path $env:PICKER_APP)\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { throw "WSL import" }
          python -m pip install pywinauto==0.6.9
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (!$runtime) {
            $installer = Join-Path $env:RUNNER_TEMP "WebView2Setup.exe"
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation,') { throw 'Invalid WebView2 installer signature' }
            $install = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            if ($install.ExitCode) { throw "WebView2 installer exited $($install.ExitCode)" }
          }
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'asagiri-test-webview-profile'
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-focus286'
          @'
          import os, pathlib, subprocess, time
          from pywinauto import Desktop
          from pywinauto.keyboard import send_keys
          app = pathlib.Path(os.environ['PICKER_APP'])
          docker = str(app.parent / 'bin' / 'docker.exe')
          proc = subprocess.Popen([str(app), '--distro', 'Asagiri-focus286', '--pipe', r'\\.\pipe\asagiri-focus286'])
          try:
              window = Desktop(backend='uia').window(process=proc.pid, class_name='AsagiriWindow')
              window.wait('visible', timeout=90)
              for attempt in range(90):
                  ready = subprocess.run([docker, 'info'], capture_output=True)
                  if ready.returncode == 0: break
                  time.sleep(1)
              else:
                  raise RuntimeError('Windows engine did not become ready')
              subprocess.run([docker,'run','-d','--name','focus286','alpine:3.21','sleep','300'], check=True)
              def click(title):
                  control = window.child_window(title=title, found_index=0)
                  control.wait('visible enabled', timeout=90)
                  control.click_input()
              click('Containers')
              deadline = time.monotonic() + 90
              while time.monotonic() < deadline:
                  visible = [c for c in window.descendants() if c.is_visible() and c.window_text()]
                  matches = [c for c in visible if c.element_info.control_type == 'DataItem' and c.window_text() == 'focus286 alpine:3.21']
                  if matches:
                      min(matches, key=lambda c: len(c.window_text())).click_input()
                      break
                  time.sleep(1)
              else:
                  raise RuntimeError(f'Container absent from dashboard. Visible controls: {[c.window_text()[:120] for c in visible][:100]}')
              tab = window.child_window(control_type='Tab').child_window(title='Terminal', control_type='Button')
              tab.wait('visible enabled', timeout=60)
              tab.click_input()
              prompt = window.child_window(title='Command to run in the container', control_type='Edit')
              try:
                  prompt.wait('visible enabled', timeout=60)
              except Exception:
                  print([(c.element_info.control_type, c.element_info.automation_id, c.window_text()[:100]) for c in window.descendants() if c.is_visible()], flush=True)
                  raise
              prompt.click_input()
              send_keys('echo pending{HOME}{RIGHT 5}', with_spaces=True)
              for i in range(4):
                  subprocess.run([docker,'create','--name',f'focus286-event-{i}','alpine:3.21','true'], check=True)
                  time.sleep(6)
                  assert prompt.has_keyboard_focus(), 'Refresh moved keyboard focus'
                  send_keys('x')
                  assert prompt.get_value() == 'echo xpending', prompt.get_value()
                  send_keys('{BACKSPACE}')
                  assert prompt.get_value() == 'echo pending'
                  print('Focus, draft and insertion position retained after refresh', i, flush=True)
          finally:
              subprocess.run(['powershell','-NoProfile','-Command',"Get-Process | Where-Object {$_.ProcessName -match 'asagiri|webview'} | Select-Object ProcessName,Id,MainWindowTitle; Get-ChildItem $env:LOCALAPPDATA/Asagiri,$env:USERPROFILE/.asagiri -Filter asagiri-win.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 30 }"],check=False)
              subprocess.run(['taskkill','/PID',str(proc.pid),'/T','/F'],check=False)
          '@ | python -
          if ($LASTEXITCODE) { throw 'Windows live focus check failed' }
