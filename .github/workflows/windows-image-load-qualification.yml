name: Published Windows C-drive bind events
on:
  push:
    branches: [qualification/windows-bind-232]
    paths: [.github/workflows/windows-image-load-qualification.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Exercise gzip through the published Windows CLI and WSL engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.158-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.158 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '62299f7f19506e2fc01d91b2f55f8a56347eb9c0a754afd75796d6fd6bfb5db6') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          wsl.exe --import Asagiri-load-test "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','Asagiri-load-test','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Invoke-Docker @('pull','alpine:3.21')
            $source = Join-Path 'C:\' ('asagiri-inotify-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $source | Out-Null
            $linuxSource = '/mnt/c/' + (Split-Path $source -Leaf)
            Invoke-Docker @('run','-d','--name','bind-watch','--network','none','--mount',"type=bind,source=$linuxSource,target=/watch",'alpine:3.21','inotifyd','-','/watch:ncd')
            function Wait-EventText($eventName, $file) {
              for ($n=0; $n -lt 25; $n++) {
                $lines = Invoke-Docker @('logs','bind-watch')
                if ($lines -match "^$eventName\s+/watch\s+$file$") { return $true }
                Start-Sleep -Milliseconds 200
              }
              return $false
            }
            Start-Sleep -Seconds 2
            Invoke-Docker @('exec','bind-watch','touch','/watch/control')
            if (!(Wait-EventText 'n' 'control')) { throw 'Guest watcher control failed' }
            if (!(Test-Path (Join-Path $source 'control'))) { throw 'Guest and Windows are not viewing the same bind' }
            $file = Join-Path $source 'host-edit'
            [IO.File]::WriteAllText($file,'first')
            $created = Wait-EventText 'n' 'host-edit'
            [IO.File]::AppendAllText($file,'-second')
            $modified = Wait-EventText 'c' 'host-edit'
            $contents = Invoke-Docker @('exec','bind-watch','cat','/watch/host-edit')
            if ($contents -notcontains 'first-second') { throw 'Host writes not visible to container' }
            Remove-Item $file
            $deleted = Wait-EventText 'd' 'host-edit'
            Invoke-Docker @('logs','bind-watch')
            Write-Host "Windows C-drive inotify create=$created modify=$modified delete=$deleted"
            if (!($created -and $modified -and $deleted)) { throw 'Missing host-originated inotify events' }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate Asagiri-load-test
          }
