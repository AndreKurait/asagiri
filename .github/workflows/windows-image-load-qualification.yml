name: Published Windows WSL bridge egress
on:
  push:
    branches: [qualification/windows-bridge-97]
    paths: [.github/workflows/windows-image-load-qualification.yml]
permissions:
  actions: read
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 899b3166b6a25c4864ddfdb50a17515370bdd3f4
          persist-credentials: false
      - name: Exercise outbound traffic from host, default and Compose networks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RUNNER_TEMP
          $hashes = @{
            '158' = '93b24ba6cc0ce849b8f27f9bb7966e1d4bc972f87e40a9ce938f46d431a33303'
            '181' = 'a5faf137d7d8697e475a7356b2f5971c1aede770482b5bb39c8b2415c30f7a44'
          }
          $imported = $false
          foreach ($build in '158','181','158') {
          $version = "0.1.14-dev.$build"
          $asset = "Asagiri-$version-x86_64.msi"
          if (!(Test-Path $asset)) {
            gh release download "v$version" --repo AndreKurait/asagiri --pattern $asset
            if ((Get-FileHash $asset).Hash.ToLower() -ne $hashes[$build]) { throw "Hash mismatch for $asset" }

          }
          $install = Start-Process msiexec -ArgumentList "/i `"$env:RUNNER_TEMP\$asset`" /qn /norestart /l*v `"$env:RUNNER_TEMP\install-$build.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install $version failed with $($install.ExitCode)" }
          $bundle = Join-Path $env:LOCALAPPDATA 'Asagiri'
          $app = Join-Path $bundle 'asagiri-win.exe'
          $docker = Join-Path $bundle 'bin/docker.exe'
          if (!$imported) {
            python -m pip install pywinauto
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            # Exercise the chooser fix with the published distro and CLI assets.
            $files = @('asagiri', 'asagiri-init', 'asagiri-linux.tar.gz', 'install.sh', 'asagiri.ps1', 'setup-tools.ps1', 'asagiri-admin.ps1', 'bin/docker.exe', 'bin/asagiri.exe', 'bin/cli-plugins/docker-compose.exe', 'bin/cli-plugins/docker-buildx.exe')
            $env:ASAGIRI_BUNDLE_SHA256 = ($files | ForEach-Object {
              $digest = (Get-FileHash (Join-Path $bundle $_) -Algorithm SHA256).Hash.ToLowerInvariant()
              "$_=$digest"
            }) -join ';'
            Push-Location $env:GITHUB_WORKSPACE
            cargo build --locked --release -p asagiri-win --bin asagiri-win
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Pop-Location
            $launcher = Join-Path $env:GITHUB_WORKSPACE 'target/release/asagiri-win.exe'
            $original = Join-Path $env:RUNNER_TEMP 'dev158-launcher.exe'
            Copy-Item $app $original
            Copy-Item $launcher $app -Force
            $wizard = Start-Process $app -PassThru
            @'
          import sys
          import time
          from comtypes import COMError
          from pywinauto import Desktop
          window = Desktop(backend='uia').window(process=int(sys.argv[1]), class_name='AsagiriWindow')
          window.wait('visible', timeout=90)
          for target, timeout in [('chooseBtn', 120), ('Open Asagiri', 600)]:
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  try:
                      controls = window.descendants()
                      button = next((c for c in controls if c.is_enabled() and
                                     (c.element_info.automation_id == target or
                                      (c.element_info.control_type == 'Button' and c.window_text() == target))), None)
                      if button:
                          button.invoke()
                          break
                      language = next((c for c in controls if c.element_info.automation_id == 'lang-go' and c.is_enabled()), None)
                      if language:
                          print('Invoking language Continue via UI Automation', flush=True)
                          language.invoke()
                  except COMError as error:
                      if error.hresult != -2147220991:
                          raise
                      print('UI element disappeared during refresh; querying again', flush=True)
                  time.sleep(1)
              else:
                  raise RuntimeError((target, [(c.element_info.automation_id, c.window_text()) for c in controls][:100]))
          '@ | python - $wizard.Id
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            for ($i = 0; $i -lt 30; $i++) {
              if ((Test-Path "$bundle/setup.json") -and (Get-Content "$bundle/setup.json" -Raw | ConvertFrom-Json).done) { break }
              Start-Sleep -Seconds 1
            }
            $saved = Get-Content (Join-Path $bundle 'setup.json') -Raw | ConvertFrom-Json
            if (!$saved.done -or $saved.distro -ne 'asagiri') { throw 'Windows setup did not complete' }
            for ($attempt = 1; $attempt -le 15; $attempt++) {
              Get-Process -Name asagiri-win -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $app } | ForEach-Object {
                $_.Kill()
                if (!$_.WaitForExit(5000)) { throw "Candidate launcher process $($_.Id) did not exit" }
              }
              try { Copy-Item $original $app -Force -ErrorAction Stop; break }
              catch [System.IO.IOException] { if ($attempt -eq 15) { throw }; Start-Sleep -Seconds 1 }
            }
            if ((Get-FileHash $app).Hash -ne (Get-FileHash $original).Hash) { throw 'Original dev.158 launcher was not restored' }
            $imported = $true
          }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','asagiri','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            $running = $null
            for ($i = 0; $i -lt 45; $i++) {
              $server = & $docker version --format '{{json .Server.Components}}' 2>$null
              if ($LASTEXITCODE -eq 0 -and $server) {
                $engine = ($server | ConvertFrom-Json) | Where-Object Name -eq 'Engine'
                $running = $engine.Details.AsagiriVersion
                if ($running -eq $version) { break }
              }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Write-Host "Installed launcher $((Get-Item $app).VersionInfo.ProductVersion), expected $version"
            Get-FileHash $app,(Join-Path $bundle 'asagiri') | Format-Table -AutoSize
            wsl.exe -d asagiri -u root -- sha256sum /usr/local/bin/asagiri
            wsl.exe -d asagiri -u root -- /usr/local/bin/asagiri --version
            Get-ChildItem $env:LOCALAPPDATA\Asagiri -Recurse -Filter asagiri-win.log | ForEach-Object { Get-Content $_.FullName -Tail 100 }
            if ($running -ne $version) { throw "Expected serving daemon $version, got $running" }
            Write-Host "Confirmed serving daemon $running through the Windows pipe"
            $installed = wsl.exe -d asagiri -u root -- asagiri --version
            if ($LASTEXITCODE -or ($installed -join ' ') -notmatch [regex]::Escape($version)) { throw "Expected $version, found $installed" }
            Write-Host "Engine binary in persistent WSL installation: $installed"
            Invoke-Docker @('pull','alpine:3.21')
            $compose = Join-Path $bundle 'bin/cli-plugins/docker-compose.exe'
            @'
          services:
            probe:
              image: alpine:3.21
              command: ["sleep", "300"]
          '@ | Set-Content -Encoding utf8 'compose.yaml'
            & $compose --project-name egress97 up -d --pull never
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $probe = 'set -eu; ip route; nslookup example.com; wget -T 12 -qO /dev/null https://example.com; echo HTTPS_OK'
            foreach ($network in 'host','bridge','egress97_default') {
              $result = Invoke-Docker @('run','--rm','--network',$network,'alpine:3.21','sh','-ec',$probe)
              Write-Host ($result -join "`n")
              if ($result -notcontains 'HTTPS_OK') { throw "DNS/HTTPS egress failed on $network" }
              Write-Host "PASS DNS and HTTPS on $network"
              $ping = & $docker run --rm --network $network alpine:3.21 ping -c 2 -W 3 1.1.1.1
              Write-Host "ICMP on $network exit=$LASTEXITCODE $ping"
            }
            & $compose --project-name egress97 down
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate asagiri
          }
          }
