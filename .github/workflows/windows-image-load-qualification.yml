name: Published Windows WSL Buildx docker driver
on:
  push:
    branches: [qualification/windows-buildx-100]
    paths: [.github/workflows/windows-image-load-qualification.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Build and run an image through the Windows named pipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RUNNER_TEMP
          $hashes = @{
            '158' = '93b24ba6cc0ce849b8f27f9bb7966e1d4bc972f87e40a9ce938f46d431a33303'
            '181' = 'a5faf137d7d8697e475a7356b2f5971c1aede770482b5bb39c8b2415c30f7a44'
          }
          $imported = $false
          foreach ($build in '181') {
          $version = "0.1.14-dev.$build"
          $asset = "Asagiri-$version-x86_64.msi"
          if (!(Test-Path $asset)) {
            gh release download "v$version" --repo AndreKurait/asagiri --pattern $asset
            if ((Get-FileHash $asset).Hash.ToLower() -ne $hashes[$build]) { throw "Hash mismatch for $asset" }

          }
          $install = Start-Process msiexec -ArgumentList "/i `"$env:RUNNER_TEMP\$asset`" /qn /norestart /l*v `"$env:RUNNER_TEMP\install-$build.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install $version failed with $($install.ExitCode)" }
          $bundle = Join-Path $env:LOCALAPPDATA 'Asagiri'
          $app = Join-Path $bundle 'asagiri-win.exe'
          $docker = Join-Path $bundle 'bin/docker.exe'
          if (!$imported) {
            wsl.exe --import asagiri "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $imported = $true
          }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','asagiri','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            $running = $null
            for ($i = 0; $i -lt 45; $i++) {
              $server = & $docker version --format '{{json .Server.Components}}' 2>$null
              if ($LASTEXITCODE -eq 0 -and $server) {
                $engine = ($server | ConvertFrom-Json) | Where-Object Name -eq 'Engine'
                $running = $engine.Details.AsagiriVersion
                if ($running -eq $version) { break }
              }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            if ($running -ne $version) { throw "Expected serving daemon $version, got $running" }
            Write-Host "Confirmed serving daemon $running through the Windows pipe"
            $installed = wsl.exe -d asagiri -u root -- asagiri --version
            if ($LASTEXITCODE -or ($installed -join ' ') -notmatch [regex]::Escape($version)) { throw "Expected $version, found $installed" }
            Write-Host "Engine binary in persistent WSL installation: $installed"
            Invoke-Docker @('pull','alpine:3.21')
            $context = New-Item -ItemType Directory 'build-context'
            [IO.File]::WriteAllText((Join-Path $context.FullName 'marker'), 'windows-wsl-buildx')
            $proof = Join-Path $env:RUNNER_TEMP 'proof.txt'
            $iid = Join-Path $env:RUNNER_TEMP 'iid'
            Set-Content -LiteralPath $proof -Value 'session-secret-100' -NoNewline
            @'
          FROM alpine:3.21
          COPY marker /marker
          RUN --mount=type=secret,id=proof sha256sum /run/secrets/proof | cut -d' ' -f1 > /proof.digest
          '@ | Set-Content "$context/Dockerfile"
            $buildx = Join-Path $bundle 'bin/cli-plugins/docker-buildx.exe'
            $buildxVersion = (& $buildx version) -join ' '
            if ($buildxVersion -notmatch ' v(\d+\.\d+\.\d+)') { throw "Unknown Buildx version: $buildxVersion" }
            $tag = "v$($Matches[1])"
            $linuxAsset = "buildx-$tag.linux-amd64"
            gh release download $tag --repo docker/buildx --pattern $linuxAsset --pattern checksums.txt
            if ($LASTEXITCODE) { throw 'Linux Buildx comparison download failed' }
            $sha = (Get-FileHash $linuxAsset).Hash.ToLower()
            if (!(Select-String -LiteralPath checksums.txt -Pattern "^$sha\s+\*?$([regex]::Escape($linuxAsset))$")) { throw 'Linux Buildx checksum mismatch' }
            $wslAsset = (wsl.exe -d asagiri -- wslpath -a ((Join-Path $env:RUNNER_TEMP $linuxAsset).Replace('\','/'))).Trim()
            wsl.exe -d asagiri -u root -- cp $wslAsset /tmp/buildx
            if ($LASTEXITCODE) { throw 'Copy into WSL failed' }
            wsl.exe -d asagiri -u root -- chmod 755 /tmp/buildx
            wsl.exe -d asagiri -u root -- env DOCKER_HOST=unix:///var/lib/asagiri-daemon/.asagiri/run/docker.sock /tmp/buildx inspect default
            Write-Host "Direct WSL worker inspection exit=$LASTEXITCODE, client=$tag"
            $wslContext = (wsl.exe -d asagiri -- wslpath -a ($context.FullName.Replace('\','/'))).Trim()
            $wslProof = (wsl.exe -d asagiri -- wslpath -a ($proof.Replace('\','/'))).Trim()
            wsl.exe -d asagiri -u root -- env DOCKER_HOST=unix:///var/lib/asagiri-daemon/.asagiri/run/docker.sock /tmp/buildx build --progress plain --load --secret "id=proof,src=$wslProof" -t ak100:wsl-control $wslContext
            $wslBuildExit = $LASTEXITCODE
            Write-Host "Direct WSL build exit=$wslBuildExit"
            if ($wslBuildExit -eq 0) {
              $controlDigest = Invoke-Docker @('run','--rm','--network','none','ak100:wsl-control','sh','-ec','test "$(cat /marker)" = windows-wsl-buildx && test ! -e /run/secrets/proof && cat /proof.digest')
              if ($controlDigest -ne (Get-FileHash $proof).Hash.ToLower()) { throw 'Direct WSL image content mismatch' }
              Write-Host 'PASS direct WSL build, load, secret digest and Windows CLI execution'
            }
            & $buildx inspect default
            if ($LASTEXITCODE) { throw 'Buildx inspection failed' }
            & $buildx build --builder default --progress plain --load --secret "id=proof,src=$proof" --iidfile $iid -t ak100:test $context.FullName
            if ($LASTEXITCODE) { throw 'Buildx build failed' }
            $actual = Invoke-Docker @('image','inspect','ak100:test','--format','{{.Id}}')
            if ($actual -ne (Get-Content $iid -Raw).Trim()) { throw "Loaded image ID mismatch: $actual" }
            $digest = (Get-FileHash $proof).Hash.ToLower()
            $result = Invoke-Docker @('run','--rm','--network','none','ak100:test','sh','-ec','test "$(cat /marker)" = windows-wsl-buildx && test ! -e /run/secrets/proof && cat /proof.digest')
            if ($result -ne $digest) { throw 'Session secret digest mismatch' }
            Write-Host "PASS context, build secret, direct image load and runtime for $actual"
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate asagiri
          }
          }
