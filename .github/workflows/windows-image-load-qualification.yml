name: Published Windows WSL host overrides
on:
  push:
    branches: [qualification/windows-host-override-207]
    paths: [.github/workflows/windows-image-load-qualification.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Verify explicit host aliases through the Windows named pipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.158-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.158 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '62299f7f19506e2fc01d91b2f55f8a56347eb9c0a754afd75796d6fd6bfb5db6') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          wsl.exe --import Asagiri-load-test "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','Asagiri-load-test','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Invoke-Docker @('pull','alpine:3.21')
            foreach ($name in 'host.docker.internal','HOST.DOCKER.INTERNAL','gateway.docker.internal','host.asagiri.internal','winhost') {
              $base = @('run','--rm','--add-host',"${name}:10.9.8.7",'alpine:3.21')
              $hosts = Invoke-Docker ($base + @('cat','/etc/hosts'))
              Write-Host ($hosts -join "`n")
              $matching = @($hosts | Where-Object { (($_ -split '#')[0] -split '\s+' | Select-Object -Skip 1) -contains $name })
              if ($matching.Count -ne 1 -or $matching[0] -notmatch '^10\.9\.8\.7\s') { throw "Unexpected entries for $name" }
              $resolved = Invoke-Docker ($base + @('getent','hosts',$name))
              Write-Host $resolved
              if ($resolved -notmatch '^10\.9\.8\.7\s') { throw "Resolution mismatch for $name" }
            }
            $default = Invoke-Docker @('run','--rm','alpine:3.21','getent','hosts','host.docker.internal')
            Write-Host "Default host entry: $default"
            if ($default -notmatch '^\d+\.\d+\.\d+\.\d+\s' -or $default -match '^10\.9\.8\.7\s') { throw 'Default host alias missing or leaked an override' }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate Asagiri-load-test
          }
