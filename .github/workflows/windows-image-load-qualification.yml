name: Published Windows Compose relative bind mount
on:
  push:
    branches: [qualification/windows-compose-bind-203]
    paths: [.github/workflows/windows-image-load-qualification.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Serve the original Apache fixture from a Windows relative bind mount
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.158-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.158 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '62299f7f19506e2fc01d91b2f55f8a56347eb9c0a754afd75796d6fd6bfb5db6') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          # The hosted image runs IIS on the same port as the original fixture.
          $iis = Get-Service W3SVC -ErrorAction SilentlyContinue
          if ($iis -and $iis.Status -eq 'Running') { Stop-Service W3SVC -ErrorAction Stop }
          $owners = @(Get-NetTCPConnection -State Listen -LocalPort 80 -ErrorAction SilentlyContinue)
          if ($owners.Count) { throw "Windows port 80 already has listeners: $($owners.OwningProcess)" }
          wsl.exe --version
          wsl.exe --import Asagiri-load-test "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','Asagiri-load-test','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Invoke-WebRequest 'https://github.com/user-attachments/files/34941683/apache1.zip' -OutFile apache1.zip
            if ((Get-FileHash apache1.zip).Hash.ToLower() -ne '357d2c1bef5df519ca608ceba49172ff273c818ae52d46251d96ede6447b0580') { throw 'Fixture hash mismatch' }
            Expand-Archive apache1.zip -DestinationPath apache1
            Set-Location apache1
            $expected = (Get-FileHash www/index.html).Hash.ToLower()
            $compose = Join-Path $bundle 'bin/cli-plugins/docker-compose.exe'
            & $compose up -d
            if ($LASTEXITCODE) { throw 'Original Compose project failed to start' }
            try {
              $id = & $compose ps -q apache
              if ($LASTEXITCODE -or !$id) { throw 'Missing Apache container' }
              Invoke-Docker @('inspect','--format','{{json .Mounts}}',$id)
              $inside = Invoke-Docker @('exec',$id,'sha256sum','/var/www/html/index.html')
              Write-Host "Host SHA256 $expected. Container result $inside"
              if (($inside -split '\s+')[0] -ne $expected) { throw 'Container mount content mismatch' }
              $bodyHash = Invoke-Docker @('exec',$id,'php','-r','echo hash("sha256",file_get_contents("http://127.0.0.1/index.html"));')
              Write-Host "Apache container HTTP byte hash: $bodyHash"
              if ($bodyHash -ne $expected) { throw 'Apache inside the container returned different content' }
              curl.exe --dump-header response-headers.txt --noproxy '*' --retry 12 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1/ -o served.html
              $transferExit = $LASTEXITCODE
              Get-Content response-headers.txt
              if (Test-Path served.html) { Write-Host "Windows response SHA256: $((Get-FileHash served.html).Hash)" }
              if ($transferExit -or (Get-FileHash served.html).Hash.ToLower() -ne $expected) { throw 'Published HTTP response mismatch' }
              Write-Host 'PASS original relative bind file and Apache HTTP response match host bytes'
            } finally {
              & $compose down
            }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate Asagiri-load-test
          }
