name: Published Windows WSL bridge egress
on:
  push:
    branches: [qualification/windows-bridge-97]
    paths: [.github/workflows/windows-image-load-qualification.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Exercise outbound traffic from host, default and Compose networks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RUNNER_TEMP
          $hashes = @{
            '158' = '62299f7f19506e2fc01d91b2f55f8a56347eb9c0a754afd75796d6fd6bfb5db6'
            '181' = 'f0c9529a44bb11deb83fe47c7b3489c8354e400f5157efaaa4b7e831d8377354'
          }
          $imported = $false
          foreach ($build in '158','181','158') {
          $version = "0.1.14-dev.$build"
          $asset = "Asagiri-$version-windows-x86_64.zip"
          if (!(Test-Path "bundle-$build")) {
            gh release download "v$version" --repo AndreKurait/asagiri --pattern $asset
            if ((Get-FileHash $asset).Hash.ToLower() -ne $hashes[$build]) { throw "Hash mismatch for $asset" }
            Expand-Archive $asset -DestinationPath "bundle-$build"
          }
          $app = (Get-ChildItem "bundle-$build" -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          if (!$imported) {
            wsl.exe --import asagiri "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $imported = $true
          }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','asagiri','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            $installed = wsl.exe -d asagiri -u root -- asagiri --version
            if ($LASTEXITCODE -or ($installed -join ' ') -notmatch [regex]::Escape($version)) { throw "Expected $version, found $installed" }
            Write-Host "Engine binary in persistent WSL installation: $installed"
            Invoke-Docker @('pull','alpine:3.21')
            $compose = Join-Path $bundle 'bin/cli-plugins/docker-compose.exe'
            @'
          services:
            probe:
              image: alpine:3.21
              command: ["sleep", "300"]
          '@ | Set-Content -Encoding utf8 'compose.yaml'
            & $compose --project-name egress97 up -d --pull never
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $probe = 'set -eu; ip route; nslookup example.com; wget -T 12 -qO /dev/null https://example.com; echo HTTPS_OK'
            foreach ($network in 'host','bridge','egress97_default') {
              $result = Invoke-Docker @('run','--rm','--network',$network,'alpine:3.21','sh','-ec',$probe)
              Write-Host ($result -join "`n")
              if ($result -notcontains 'HTTPS_OK') { throw "DNS/HTTPS egress failed on $network" }
              Write-Host "PASS DNS and HTTPS on $network"
              $ping = & $docker run --rm --network $network alpine:3.21 ping -c 2 -W 3 1.1.1.1
              Write-Host "ICMP on $network exit=$LASTEXITCODE $ping"
            }
            & $compose --project-name egress97 down
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate asagiri
          }
          }
