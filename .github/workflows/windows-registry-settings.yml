name: Native Windows registry settings
on:
  push:
    branches: [qualification/windows-registry-settings-153]
permissions:
  actions: read
  contents: read
jobs:
  terminal:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Save and remove a registry exception through WebView2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          cd $env:RUNNER_TEMP
          $asset = "Asagiri-0.1.14-dev.188-windows-x86_64.zip"
          gh release download v0.1.14-dev.188 -R AndreKurait/asagiri -p $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne "3ee017d9c8ee94292197badf38f432fc5eeb134892bf6311f1e85aa1ddebc854") { throw "bundle hash" }
          Expand-Archive $asset bundle
          $env:PICKER_APP = (Get-ChildItem bundle -Recurse -Filter asagiri-win.exe).FullName
          curl.exe --fail --silent --show-error --location -H "Authorization: Bearer $env:GH_TOKEN" https://api.github.com/repos/AndreKurait/asagiri/actions/artifacts/14784273311/zip -o candidate.zip
          if ((Get-FileHash candidate.zip).Hash.ToLower() -ne '24684fffabb5b28b66d60e70caf9bb18fada818aaa889e070f05c12cc8248d37') { throw 'PR artifact checksum mismatch' }
          Expand-Archive candidate.zip candidate
          Copy-Item candidate/asagiri-win.exe $env:PICKER_APP -Force
          wsl.exe --import Asagiri-registry153 "$env:RUNNER_TEMP\picker-distro" "$(Split-Path $env:PICKER_APP)\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { throw "WSL import" }
          python -m pip install pywinauto
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (!$runtime) {
            $installer = Join-Path $env:RUNNER_TEMP "WebView2Setup.exe"
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation,') { throw 'Invalid WebView2 installer signature' }
            $install = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            if ($install.ExitCode) { throw "WebView2 installer exited $($install.ExitCode)" }
          }
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'asagiri-test-webview-profile'
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-registry153'
          @'
          import os, pathlib, subprocess, time
          from pywinauto import Desktop
          from pywinauto.keyboard import send_keys
          app = pathlib.Path(os.environ['PICKER_APP'])
          proc = subprocess.Popen([str(app), '--distro', 'Asagiri-registry153', '--pipe', r'\\.\pipe\asagiri-registry153'])
          try:
              window = Desktop(backend='uia').window(process=proc.pid, class_name='AsagiriWindow')
              window.wait('visible', timeout=90)
              def click(title):
                  deadline = time.monotonic() + 30
                  while time.monotonic() < deadline:
                      buttons = window.descendants(control_type='Button')
                      for button in buttons:
                          if button.window_text() == title and button.is_visible() and button.is_enabled():
                              if title == 'Settings':
                                  button.invoke()
                                  time.sleep(1)
                                  if not any(b.window_text() == 'Registry mirrors' and b.is_visible() for b in window.descendants(control_type='Button')):
                                      continue
                              else:
                                  button.invoke()
                              return
                      time.sleep(0.5)
                  raise RuntimeError(f'{title} unavailable; visible buttons: {[b.window_text() for b in buttons if b.is_visible()]}')
              def field():
                  control = window.child_window(auto_id='registry-exceptions', control_type='Edit')
                  control.wait('visible', timeout=30)
                  return control.wrapper_object()
              click('Settings')
              click('Registry mirrors')
              assert field().get_value() == ''
              for value in ['registry.test:5153', '']:
                  field().click_input()
                  send_keys('^a{BACKSPACE}')
                  if value:
                      send_keys(value, vk_packet=True)
                  assert field().get_value() == value
                  click('Save')
                  window.child_window(title='Save', control_type='Button').wait_not('enabled', timeout=30)
                  click('Containers')
                  click('Settings')
                  assert field().get_value() == value
                  print('Windows registry field after reopening Settings:', repr(value), flush=True)
          finally:
              subprocess.run(['powershell','-NoProfile','-Command',"Get-CimInstance Win32_Process -Filter \"Name='msedgewebview2.exe'\" | ForEach-Object { [regex]::Matches($_.CommandLine, '--(?:remote-debugging-port|user-data-dir)=(?:\"[^\"]*\"|[^ ]+)') | ForEach-Object Value }"],check=False)
              subprocess.run(['powershell','-NoProfile','-Command',"Get-Process | Where-Object {$_.ProcessName -match 'asagiri|webview'} | Select-Object ProcessName,Id,MainWindowTitle; Get-ChildItem $env:LOCALAPPDATA/Asagiri,$env:USERPROFILE/.asagiri -Filter asagiri-win.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 30 }"],check=False)
              subprocess.run(['taskkill','/PID',str(proc.pid),'/T','/F'],check=False)
          '@ | python -
          if ($LASTEXITCODE) { throw 'Windows registry settings check failed' }
