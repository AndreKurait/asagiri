name: Published macOS launch error alert
on:
  push:
    branches: [qualification/mac-launch-alert-131]
    paths: [.github/workflows/mac-homebrew-qualification.yml]
permissions:
  contents: read
jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Launch the installed application as the desktop user
        run: |
          set -euo pipefail
          cask=andrekurait/asagiri/asagiri
          app=/Applications/Asagiri.app
          test ! -e "$app"
          if brew list --cask asagiri >/dev/null 2>&1; then exit 1; fi
          brew install --cask "$cask"
          brew list --cask --versions asagiri
          git -C "$(brew --repository andrekurait/asagiri)" rev-parse HEAD
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/asagiri" --version
          "$app/Contents/Resources/bin/docker" --version
          # This disposable user's Docker context path cannot contain directories.
          conflict=$(mktemp "$RUNNER_TEMP/context-file.XXXXXX")
          launchctl setenv DOCKER_CONFIG "$conflict"
          trap 'launchctl unsetenv DOCKER_CONFIG' EXIT
          open -a "$app"
          swift - <<'SWIFT'
          import AppKit
          import ApplicationServices
          func attribute(_ el: AXUIElement, _ key: String) -> CFTypeRef? {
              var value: CFTypeRef?
              return AXUIElementCopyAttributeValue(el, key as CFString, &value) == .success ? value : nil
          }
          func labels(_ el: AXUIElement, depth: Int) -> [String] {
              guard depth < 9 else { return [] }
              let text = ["AXTitle", "AXValue", "AXDescription"].compactMap { attribute(el, $0) as? String }
              return text + ((attribute(el, "AXChildren") as? [AXUIElement]) ?? []).flatMap { labels($0, depth: depth + 1) }
          }
          let deadline = Date().addingTimeInterval(60)
          while Date() < deadline {
              for app in NSRunningApplication.runningApplications(withBundleIdentifier: "dev.asagiri.app") {
                  let text = labels(AXUIElementCreateApplication(app.processIdentifier), depth: 0)
                  if ["Asagiri could not finish opening", "write the Docker context", "Quit"].allSatisfy({ phrase in text.contains(where: { $0.contains(phrase) }) }) {
                      print("PASS native alert exposes the failed setup operation and Quit"); exit(0)
                  }
              }
              RunLoop.current.run(until: Date().addingTimeInterval(0.25))
          }
          exit(1)
          SWIFT
          grep -F 'app-launch' "$HOME/.asagiri/logs/ui.log" | grep -F 'write the Docker context'
