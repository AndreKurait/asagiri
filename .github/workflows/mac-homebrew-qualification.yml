name: Published Homebrew cask lifecycle
on:
  push:
    branches: [qualification/homebrew-150]
    paths: [.github/workflows/mac-homebrew-qualification.yml]
permissions:
  contents: read
jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Install, uninstall, and reinstall from the documented tap
        run: |
          set -euo pipefail
          cask=andrekurait/asagiri/asagiri
          app=/Applications/Asagiri.app
          test ! -e "$app"
          if brew list --cask asagiri >/dev/null 2>&1; then exit 1; fi
          brew install --cask "$cask"
          brew list --cask --versions asagiri
          git -C "$(brew --repository andrekurait/asagiri)" rev-parse HEAD
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/asagiri" --version
          "$app/Contents/Resources/bin/docker" --version
          data="$HOME/Library/Application Support/Asagiri"
          mkdir -p "$data"
          marker=$(mktemp "$data/qualification.XXXXXX")
          printf 'preserved' > "$marker"
          brew uninstall --cask "$cask"
          test ! -e "$app"
          test "$(cat "$marker")" = preserved
          if brew list --cask asagiri >/dev/null 2>&1; then exit 1; fi
          brew install --cask "$cask"
          test "$(cat "$marker")" = preserved
          "$app/Contents/MacOS/asagiri" --version
          brew uninstall --cask "$cask"
          test ! -e "$app" && test "$(cat "$marker")" = preserved
          echo 'PASS published cask install, CLI execution, uninstall, and reinstall preserve existing user data'
