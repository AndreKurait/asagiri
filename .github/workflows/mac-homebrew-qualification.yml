name: Published macOS LaunchServices startup
on:
  push:
    branches: [qualification/mac-launchservices-131]
    paths: [.github/workflows/mac-homebrew-qualification.yml]
permissions:
  contents: read
jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Launch the installed application as the desktop user
        run: |
          set -euo pipefail
          cask=andrekurait/asagiri/asagiri
          app=/Applications/Asagiri.app
          test ! -e "$app"
          if brew list --cask asagiri >/dev/null 2>&1; then exit 1; fi
          brew install --cask "$cask"
          brew list --cask --versions asagiri
          git -C "$(brew --repository andrekurait/asagiri)" rev-parse HEAD
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/asagiri" --version
          "$app/Contents/Resources/bin/docker" --version
          open -a "$app"
          swift - <<'SWIFT'
          import AppKit
          import ApplicationServices
          let deadline = Date().addingTimeInterval(90)
          while Date() < deadline {
              for process in NSRunningApplication.runningApplications(withBundleIdentifier: "dev.asagiri.app") {
                  var windows: CFTypeRef?
                  let result = AXUIElementCopyAttributeValue(AXUIElementCreateApplication(process.processIdentifier), kAXWindowsAttribute as CFString, &windows)
                  if result == .success, let list = windows as? [AXUIElement], !list.isEmpty {
                      print("PASS LaunchServices opened a native window for PID \(process.processIdentifier)"); exit(0)
                  }
              }
              RunLoop.current.run(until: Date().addingTimeInterval(0.25))
          }
          exit(1)
          SWIFT
          agent="$HOME/Library/LaunchAgents/dev.asagiri.daemon.plist"
          plutil -lint "$agent"
          launchctl print "gui/$(id -u)/dev.asagiri.daemon"
          "$app/Contents/Resources/bin/docker" --host "unix://$HOME/.asagiri/run/docker.sock" version --format '{{.Server.Version}}'
