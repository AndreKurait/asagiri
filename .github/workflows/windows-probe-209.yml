name: Verify dashboard selection after a delayed successful WSL response
on:
  push:
    branches: [qualification/windows-slow-209]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and test the candidate launcher
        run: |
          cargo test --locked -p asagiri-win incomplete_setup_resumes_from_persisted_state
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release -p asagiri-win
      - name: Launch the actual dashboard and setup views while a real WSL distro query is delayed
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install pywinauto==0.6.9 psutil
          if ($LASTEXITCODE) { throw 'UI Automation installation failed' }
          $app = (Resolve-Path target/release/asagiri-win.exe).Path
          $homeDir = Join-Path $env:LOCALAPPDATA Asagiri
          New-Item -Force -ItemType Directory $homeDir | Out-Null
          wsl.exe --version
          if ($LASTEXITCODE) { throw 'WSL version control failed' }
          $fixture = Join-Path $env:RUNNER_TEMP 'rootfs'
          New-Item -Type Directory $fixture | Out-Null
          $archive = 'alpine-minirootfs-3.21.3-x86_64.tar.gz'
          $uri = "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64/$archive"
          $tar = Join-Path $fixture $archive
          Invoke-WebRequest $uri -OutFile $tar
          $sum = (Invoke-RestMethod "$uri.sha256").Trim().Split(' ')[0]
          if ((Get-FileHash $tar).Hash -ne $sum) { throw 'Alpine rootfs checksum mismatch' }
          wsl.exe --import SlowQueryControl (Join-Path $env:RUNNER_TEMP 'distro') $tar --version 2
          if ($LASTEXITCODE) { throw 'Could not register the timing control distro' }
          $env:WSL_UTF8 = '1'
          if ('SlowQueryControl' -notin (wsl.exe --list --quiet)) { throw 'Control distro missing' }
          @{done=$true;distro='SlowQueryControl'} | ConvertTo-Json | Set-Content (Join-Path $homeDir setup.json) -Encoding utf8NoBOM
          $servicePid = (Get-CimInstance Win32_Service -Filter "Name='WslService'").ProcessId
          python -c "import psutil,sys; psutil.Process(int(sys.argv[1])).suspend()" $servicePid
          if ($LASTEXITCODE) { throw 'Could not suspend service' }
          try {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $control = Start-Process wsl.exe -ArgumentList '--list --quiet' -PassThru -RedirectStandardOutput "$fixture/control.txt"
            $process = Start-Process $app -PassThru
            Start-Sleep -Seconds 8
            if ($control.HasExited) { throw 'Distro query completed before service resumed' }
          } finally {
            python -c "import psutil,sys; psutil.Process(int(sys.argv[1])).resume()" $servicePid
            if ($LASTEXITCODE) { throw 'Could not resume service' }
          }
          if (!$control.WaitForExit(30000) -or $control.ExitCode -ne 0) { throw 'Delayed distro query failed' }
          Write-Host "Distro query succeeded after $($timer.ElapsedMilliseconds) ms"
          if ('SlowQueryControl' -notin (Get-Content "$fixture/control.txt")) { throw 'Delayed query omitted the registered distro' }
          python -c "from pywinauto import Desktop; import sys; doc=Desktop(backend='uia').window(process=int(sys.argv[1]), title='Asagiri').child_window(title='Asagiri', control_type='Document'); doc.wait('visible', timeout=90); print('Visible WebView document:',doc.window_text())" $process.Id
          if ($LASTEXITCODE) { throw 'Dashboard did not open after WSL resumed' }
