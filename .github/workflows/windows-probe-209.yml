name: Reproduce dev.212 returning completed Windows setup to the wizard
on:
  push:
    branches: [qualification/windows-baseline-209]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Launch the actual dashboard and setup views with an unavailable WSL service
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install pywinauto==0.6.9
          if ($LASTEXITCODE) { throw 'UI Automation installation failed' }
          $asset = 'Asagiri-0.1.14-dev.212-x86_64.msi'
          $msi = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://github.com/AndreKurait/asagiri/releases/download/v0.1.14-dev.212/$asset" -OutFile $msi
          if ((Get-FileHash $msi).Hash -ne 'f3dc09608a49494288b9dc6dd787d460aa095d862eff0e6b5dbfac3ad494cbc0') { throw 'Wrong MSI digest' }
          $installer = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($installer.ExitCode -notin 0,3010) { throw "Install failed: $($installer.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Asagiri/asagiri-win.exe'
          Get-Process asagiri-win -ErrorAction SilentlyContinue | Stop-Process -Force
          $homeDir = Join-Path $env:LOCALAPPDATA Asagiri
          New-Item -Force -ItemType Directory $homeDir | Out-Null
          wsl.exe --version
          if ($LASTEXITCODE) { throw 'WSL version control failed' }
          $svc = Get-Service WslService
          $mode = $svc.StartType
          try {
            Set-Service $svc.Name -StartupType Disabled
            Stop-Service $svc.Name -Force
            wsl.exe --list --quiet
            if (!$LASTEXITCODE) { throw 'WSL still returned a successful distro list' }
            foreach ($done in $true,$false) {
              @{done=$done;distro='asagiri'} | ConvertTo-Json | Set-Content (Join-Path $homeDir setup.json) -Encoding utf8NoBOM
              Write-Host "Testing persisted done=$done"
              $expected = 'Asagiri Setup'
              $process = Start-Process $app -PassThru
              try {
                python -c "from pywinauto import Desktop; import sys; window = Desktop(backend='uia').window(process=int(sys.argv[1]), title='Asagiri'); doc = window.child_window(title=sys.argv[2], control_type='Document'); doc.wait('visible', timeout=90); print('Visible WebView document:', doc.window_text())" $process.Id $expected
                if ($LASTEXITCODE) { throw "Expected WebView document '$expected' for done=$done" }
              } finally { if (!$process.HasExited) { Stop-Process -Id $process.Id -Force; $process.WaitForExit() } }
            }
          } finally { Set-Service $svc.Name -StartupType $mode }
