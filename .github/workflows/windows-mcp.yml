name: Published Windows MCP SDK named-pipe qualification
on:
  push:
    branches: [qualification/windows-mcp-107]
    paths: [.github/workflows/windows-mcp.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the MCP SDK through the Windows CLI and named pipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.158-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.158 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '62299f7f19506e2fc01d91b2f55f8a56347eb9c0a754afd75796d6fd6bfb5db6') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          wsl.exe --import Asagiri-mcp-107 "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','Asagiri-mcp-107','--pipe','\\.\pipe\asagiri-mcp-107' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-mcp-107'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Invoke-Docker @('pull','alpine:3.21')
            $env:ASAGIRI_TEST_CLI = Join-Path $bundle 'bin/asagiri.exe'
            $env:PATH = "$(Join-Path $bundle 'bin');$env:PATH"
            python -m pip install 'mcp==2.3.0'
            if ($LASTEXITCODE) { throw 'SDK installation failed' }
            python "$env:GITHUB_WORKSPACE/tests/mcp-sdk.py" $env:DOCKER_HOST alpine:3.21
            if ($LASTEXITCODE) { throw 'MCP SDK qualification failed' }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate Asagiri-mcp-107
          }
