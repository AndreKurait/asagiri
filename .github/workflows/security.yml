# Security checks for every pull request and for main.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new RustSec advisories show up between changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  glib-variant:
    needs: shellcheck
    if: needs.shellcheck.outputs.translation_only != 'true'
    name: GLib optimized iterator regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GLib development files and the release compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: glib-${{ hashFiles('vendor/glib/src/**', 'vendor/glib/Cargo.lock') }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Exercise the patched iterators with optimization
        env:
          CARGO_TARGET_DIR: target/glib
        run: cargo +1.99.1 test --locked --release --manifest-path vendor/glib/Cargo.toml --lib variant_iter::tests

  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    outputs:
      translation_only: ${{ steps.scope.outputs.translation_only }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Identify PRs changing only translation dictionaries
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- . ':(exclude,glob)crates/asagiri/src/ui/lang/*.json'; then
            echo 'translation_only=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
          fi
      - name: Check shell scripts
        run: |
          git ls-files -z '*.sh' \
            'contrib/linux/deb/postinst' 'contrib/linux/deb/postrm' 'contrib/linux/deb/prerm' \
            'packaging/linux/deb/postinst' 'packaging/linux/deb/postrm' 'packaging/linux/deb/prerm' \
            'packaging/linux/docker-wrapper' 'contrib/wsl/asagiri-linux/asagiri-start' \
            | xargs -0 shellcheck --severity=error
      - name: Check CI cache recovery and integrity
        run: |
          python3 tests/ci-container-cache.py
          python3 tests/ci-release.py
          python3 tests/ci-runner-retry.py
          python3 tests/kernel-config-regressions.py
          python3 scripts/ci/verify-issue-coverage.py
          python3 tests/ci-verification.py
          python3 tests/ci-macos-signing.py
          python3 tests/ci-macos-package.py
          python3 tests/ci-performance.py
          python3 tests/ci-pages.py
      - name: Audit workflows with zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  # Older open branches and the main ruleset still require this context.
  # The required ShellCheck job above now enforces both audits.
  zizmor:
    name: zizmor (workflow audit)
    needs: shellcheck
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Inspect ShellCheck for the failed audit.'
          exit 1
