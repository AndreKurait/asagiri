name: Intel Mac ARM64 container execution
on:
  workflow_dispatch:
  push:
    branches: [qualification/intel-arm-execution-103]
    paths: [.github/workflows/intel-bind-qualification.yml]
permissions:
  contents: read
jobs:
  arm-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Save the ARM64 Alpine image for an independent registry-free execution check
        run: |
          docker pull --platform linux/arm64 alpine:3.21
          docker image inspect alpine:3.21 --format '{{.Id}}' > "$RUNNER_TEMP/expected-id"
          docker save -o "$RUNNER_TEMP/alpine.tar" alpine:3.21
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm64-alpine
          path: |
            ${{ runner.temp }}/alpine.tar
            ${{ runner.temp }}/expected-id
  published-app:
    needs: arm-image
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: arm64-alpine
          path: ${{ runner.temp }}/arm-image
      - name: Identify Intel virtualization capability
        run: |
          uname -m
          sw_vers
          sysctl kern.hv_support
          test "$(uname -m)" = x86_64
      - name: Exercise the published Intel app and guest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=Asagiri-0.1.14-dev.158-x86_64.tar.gz
          gh release download v0.1.14-dev.158 -p "$asset" -D "$RUNNER_TEMP" -R AndreKurait/asagiri
          cd "$RUNNER_TEMP"
          echo "120bf91342eee2dc611efa3eeebb6a8512c2b58f33046f0dec8a1007d456a7cb  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          export PATH="$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin:$PATH"
          export HOME="$RUNNER_TEMP/qualification-home" ASAGIRI_DATA_DIR="$RUNNER_TEMP/qualification-store"
          scratch=$(mktemp -d /tmp/asagiri-103.XXXXXX)
          export ASAGIRI_SOCKET="$scratch/engine.sock" DOCKER_HOST="unix://$scratch/engine.sock"
          unset DOCKER_CONTEXT
          mkdir -p "$HOME"
          Asagiri.app/Contents/MacOS/asagiri daemon >"$scratch/daemon.log" 2>&1 &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true; wait "$daemon" || true; tail -100 "$scratch/daemon.log"' EXIT
          for attempt in {1..60}; do
            if docker version >/dev/null 2>&1; then break; fi
            kill -0 "$daemon"
            sleep 1
          done
          docker version
          # Boot with the native platform first to distinguish cold guest startup from ARM emulation.
          for attempt in 1 2 3; do
            if docker run --rm --platform linux/amd64 alpine:3.21 uname -m; then break; fi
            if [ "$attempt" = 3 ]; then
              find "$HOME" "$ASAGIRI_DATA_DIR" -name 'guest-console.log' -exec tail -80 {} \;
              exit 1
            fi
            sleep 3
          done
          if ! docker pull --platform linux/arm64 alpine:3.21; then
            echo 'Registry pull failed; checking execution separately with Docker-saved ARM64 Alpine'
            docker load -i "$RUNNER_TEMP/arm-image/alpine.tar"
            test "$(docker image inspect alpine:3.21 --format '{{.Id}}')" = "$(cat "$RUNNER_TEMP/arm-image/expected-id")"
          fi
          test "$(docker image inspect alpine:3.21 --format '{{.Architecture}}')" = arm64
          arch=$(docker run --rm --platform linux/arm64 alpine:3.21 uname -m)
          echo "ARM64 container reported $arch"
          test "$arch" = aarch64
          docker run --rm --platform linux/arm64 alpine:3.21 sh -ec 'echo payload >/tmp/payload; test "$(cat /tmp/payload | tr a-z A-Z)" = PAYLOAD'
          arch=$(docker run --rm --platform linux/amd64 alpine:3.21 uname -m)
          echo "Native container after ARM64 pull reported $arch"
          test "$arch" = x86_64
