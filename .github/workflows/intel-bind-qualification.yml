name: Intel Mac foreign-platform BuildKit selection
on:
  workflow_dispatch:
  push:
    branches: [qualification/intel-guest-mirror-102]
    paths: [.github/workflows/intel-bind-qualification.yml]
permissions:
  contents: read
jobs:
  published-app:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify Intel virtualization capability
        run: |
          uname -m
          sw_vers
          sysctl kern.hv_support
          test "$(uname -m)" = x86_64
      - name: Exercise the published Intel app and guest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=Asagiri-0.1.14-dev.188-x86_64.tar.gz
          gh release download v0.1.14-dev.188 -p "$asset" -D "$RUNNER_TEMP" -R AndreKurait/asagiri
          cd "$RUNNER_TEMP"
          echo "9342f8db347380c5d0971a518d5169f9233fd24f218f6b81d070a5cf51c448f2  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          export PATH="$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin:$PATH"
          export HOME="$RUNNER_TEMP/qualification-home" ASAGIRI_DATA_DIR="$RUNNER_TEMP/qualification-store"
          scratch=$(mktemp -d /tmp/asagiri-103.XXXXXX)
          export ASAGIRI_SOCKET="$scratch/engine.sock" DOCKER_HOST="unix://$scratch/engine.sock"
          unset DOCKER_CONTEXT
          mkdir -p "$HOME/.docker"
          jq -n --arg dir "$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin/cli-plugins" '{cliPluginsExtraDirs:[$dir]}' > "$HOME/.docker/config.json"
          docker buildx version
          docker compose version
          Asagiri.app/Contents/MacOS/asagiri daemon >"$scratch/daemon.log" 2>&1 &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true; wait "$daemon" || true; tail -100 "$scratch/daemon.log"' EXIT
          for attempt in {1..60}; do
            if docker version >/dev/null 2>&1; then break; fi
            kill -0 "$daemon"
            sleep 1
          done
          docker version
          # Boot with the native platform first to distinguish cold guest startup from ARM emulation.
          for attempt in 1 2 3; do
            if docker run --rm --platform linux/amd64 alpine:3.21 uname -m; then break; fi
            if [ "$attempt" = 3 ]; then
              find "$HOME" "$ASAGIRI_DATA_DIR" -name 'guest-console.log' -exec tail -80 {} \;
              exit 1
            fi
            sleep 3
          done
          docker pull --platform linux/amd64 alpine:3.20
          test "$(docker image inspect alpine:3.20 --format '{{.Architecture}}')" = amd64
          mkdir "$scratch/project" && cd "$scratch/project"
          printf 'ARG BASE\nFROM ${BASE}\nARG EXPECTED\nRUN uname -m && test "$(uname -m)" = "$EXPECTED"\n' > Dockerfile
          primary_dns=$(scutil --dns | awk '/nameserver\[0\]/{print $3; exit}')
          resolves_registry() {
            dig +short +time=2 +tries=1 "@$1" registry-1.docker.io A | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          }
          if [ -n "$primary_dns" ] && ! resolves_registry "$primary_dns"; then
            device=$(route -n get default | awk '/interface:/{print $2}')
            service=$(networksetup -listnetworkserviceorder | awk -v dev="$device" '/^\([0-9]+\)/ {name=$0; sub(/^\([0-9]+\) /,"",name)} index($0,"Device: " dev ")") {print name; exit}')
            for candidate in 1.1.1.1 8.8.8.8; do
              if [ -n "$service" ] && resolves_registry "$candidate"; then
                echo "Hosted runner resolver $primary_dns timed out; using verified resolver $candidate on $service for this disposable job"
                sudo networksetup -setdnsservers "$service" "$candidate"
                scutil --dns | grep nameserver
                break
              fi
            done
          fi
          mkdir "$scratch/registry"
          (cd "$scratch/registry" && python3 "$GITHUB_WORKSPACE/tests/qualification/alpine-index-fetch.py")
          cp "$GITHUB_WORKSPACE/tests/qualification/alpine-index-serve.py" "$scratch/registry/serve.py"
          docker create --name fixture-registry --network bridge --workdir /srv python:3.13-alpine python /srv/serve.py
          docker cp "$scratch/registry/." fixture-registry:/srv
          docker start fixture-registry
          mirror_ip=$(docker inspect -f '{{(index .NetworkSettings.Networks "bridge").IPAddress}}' fixture-registry)
          test -n "$mirror_ip"
          mirror="$mirror_ip:49102"
          if ! docker run --rm --network bridge --pull=never alpine:3.21 sh -ec '
            for attempt in $(seq 1 20); do
              if wget -T 2 -qO- "http://$1/v2/"; then exit 0; fi
              sleep 1
            done
            exit 1
          ' sh "$mirror"; then
            docker inspect --format '{{json .State}}' fixture-registry
            docker logs fixture-registry
            exit 1
          fi
          app="$RUNNER_TEMP/Asagiri.app/Contents/MacOS/asagiri"
          "$app" config set "$(jq -cn --arg registry "$mirror" '{"insecure-registries":[$registry]}')"
          "$app" registry-mirror add "http://$mirror"
          if ! docker buildx inspect asagiri-build >/dev/null 2>&1; then
            docker buildx create --name asagiri-build --driver docker-container
          fi
          failed=0
          for scenario in cached forced uncached reverse; do
            platform=arm64
            expected=aarch64
            ref=alpine:3.20
            flags=()
            if [ "$scenario" = forced ]; then flags+=(--pull); fi
            if [ "$scenario" = uncached ]; then ref=alpine:3.19; fi
            if [ "$scenario" = reverse ]; then
              ref=alpine:3.21
              docker pull --platform linux/arm64 "$ref"
              platform=amd64
              expected=x86_64
            fi
            if docker buildx build --builder asagiri-build --platform "linux/$platform" --build-arg "EXPECTED=$expected" --progress=plain --no-cache ${flags[@]+"${flags[@]}"} --build-arg "BASE=$ref" --load -t "probe:$scenario" .; then
              test "$(docker image inspect "probe:$scenario" --format '{{.Architecture}}')" = "$platform"
              # The Dockerfile already executed uname in the BuildKit worker.
              echo "PASS $scenario"
            else
              failed=1
            fi
          done
          docker exec buildx_buildkit_asagiri-build0 cat /etc/buildkit/buildkitd.toml > "$scratch/actual-buildkit.toml"
          python3 - "$scratch/actual-buildkit.toml" "$mirror" <<'PYTHON'
          import sys, tomllib
          with open(sys.argv[1], "rb") as config:
              mirrors = tomllib.load(config)["registry"]["docker.io"]["mirrors"]
          assert len(mirrors) >= 2 and mirrors[1] == sys.argv[2], "expected fixture as second mirror"
          assert mirrors[0].startswith("198.19.248.254:"), "expected Asagiri local mirror first"
          print("PASS running builder tries Asagiri's local image mirror before fixture registry")
          PYTHON
          # Verify both build legs and the platform index from one invocation.
          printf '%s\n' 'FROM alpine:3.19' 'ARG TARGETARCH' 'RUN case "$TARGETARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) exit 0;; *) exit 1;; esac' > Dockerfile
          docker buildx build --builder asagiri-build --progress=plain --no-cache --provenance=false --platform linux/amd64,linux/arm64 --output "type=oci,dest=$scratch/result.tar" .
          python3 - "$scratch/result.tar" <<'PYTHON'
          import json, sys, tarfile
          with tarfile.open(sys.argv[1]) as archive:
              def platforms(index):
                  for descriptor in index["manifests"]:
                      algorithm, digest = descriptor["digest"].split(":")
                      manifest = json.load(archive.extractfile(f"blobs/{algorithm}/{digest}"))
                      if "manifests" in manifest:
                          yield from platforms(manifest)
                      else:
                          algorithm, digest = manifest["config"]["digest"].split(":")
                          config = json.load(archive.extractfile(f"blobs/{algorithm}/{digest}"))
                          yield config["os"] + "/" + config["architecture"]
              built = sorted(platforms(json.load(archive.extractfile("index.json"))))
              assert built == ["linux/amd64", "linux/arm64"], built
              print("PASS exported OCI platforms", built)
          PYTHON
          exit "$failed"
