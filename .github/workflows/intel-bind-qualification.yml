name: Published DDEV project on Intel macOS
on:
  workflow_dispatch:
  push:
    branches: [qualification/intel-ddev-112]
    paths: [.github/workflows/intel-bind-qualification.yml]
permissions:
  contents: read
jobs:
  published-app:
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify Intel virtualization capability
        run: |
          uname -m
          sw_vers
          sysctl kern.hv_support
          test "$(uname -m)" = x86_64
      - name: Exercise the published Intel app and guest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=Asagiri-0.1.14-dev.188-x86_64.tar.gz
          gh release download v0.1.14-dev.188 -p "$asset" -D "$RUNNER_TEMP" -R AndreKurait/asagiri
          cd "$RUNNER_TEMP"
          echo "9342f8db347380c5d0971a518d5169f9233fd24f218f6b81d070a5cf51c448f2  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          export PATH="$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin:$PATH"
          export HOME="$RUNNER_TEMP/qualification-home" ASAGIRI_DATA_DIR="$RUNNER_TEMP/qualification-store"
          scratch=$(mktemp -d /tmp/asagiri-112.XXXXXX)
          export ASAGIRI_SOCKET="$scratch/engine.sock" DOCKER_HOST="unix://$scratch/engine.sock"
          unset DOCKER_CONTEXT
          mkdir -p "$HOME/.docker"
          jq -n --arg dir "$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin/cli-plugins" '{cliPluginsExtraDirs:[$dir]}' > "$HOME/.docker/config.json"
          docker buildx version
          docker compose version
          registry_host=registry-1.docker.io
          registry_ip=$(curl --noproxy "*" -4 -sS --max-time 10 -o /dev/null -w "%{remote_ip}" "https://$registry_host/v2/" || true)
          probe_host_dns() {
            echo "Host resolver check $1"
            resolver=$(scutil --dns | awk '/nameserver\[0\]/{if (!first) first=$3} END{print first}')
            if [ -n "$resolver" ]; then
              route -n get "$resolver" || true
              arp -n "$resolver" || true
              dig +time=2 +tries=1 +notcp +ignore "@$resolver" "$registry_host" A || true
              dig +time=2 +tries=1 +tcp "@$resolver" "$registry_host" A || true
            fi
            if [ -n "$registry_ip" ]; then
              curl --noproxy "*" --resolve "$registry_host:443:$registry_ip" -sS --max-time 5 -o /dev/null -w "direct registry HTTP %{http_code} remote %{remote_ip}\n" "https://$registry_host/v2/" || true
            fi
            scutil --dns | grep -E 'resolver #|nameserver\[|if_index|reach ' || true
            curl --silent --show-error --max-time 5 --output /dev/null --write-out 'registry HTTP %{http_code} DNS %{time_namelookup}s\n' https://registry-1.docker.io/v2/ || true
          }
          asset=ddev_macos-amd64.v1.25.2.tar.gz
          gh release download v1.25.2 -R ddev/ddev -p "$asset"
          echo "663cff23dcff2f02a45937245cef885be4a9457bdb89c9956bb2f4500108e945  $asset" | shasum -a 256 -c -
          mkdir ddev-bin && tar xzf "$asset" -C ddev-bin
          ddev_exe=$(find "$PWD/ddev-bin" -type f -name ddev -print -quit)
          PATH="$(dirname "$ddev_exe"):$PATH"
          export PATH DDEV_NONINTERACTIVE=true
          compose_asset=docker-compose-darwin-x86_64
          gh release download v5.1.3 -R docker/compose -p "$compose_asset" -D "$RUNNER_TEMP"
          echo "f11139d9822ce1f3843e16ed6c2e44ba5525423396c82fa22b08874b26abd102  $RUNNER_TEMP/$compose_asset" | shasum -a 256 -c -
          install -m 755 "$RUNNER_TEMP/$compose_asset" "$(dirname "$ddev_exe")/docker-compose"
          docker-compose version
          probe_host_dns before-daemon
          Asagiri.app/Contents/MacOS/asagiri daemon >"$scratch/daemon.log" 2>&1 &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true; wait "$daemon" || true; tail -100 "$scratch/daemon.log"' EXIT
          for attempt in {1..60}; do
            if docker version >/dev/null 2>&1; then break; fi
            kill -0 "$daemon"
            sleep 1
          done
          docker version
          probe_host_dns after-daemon-ready
          for attempt in 1 2 3; do
            if docker pull alpine:3.21; then break; fi
            echo "Guest console after failed image pull attempt $attempt"
            find "$HOME" -type f -name guest-console.log -exec tail -n 160 {} \;
            test "$attempt" != 3
          done
          probe_host_dns after-alpine-pull
          # Diagnose the runner's upstream DNS independently of cached macOS answers.
          primary_dns=$(scutil --dns | awk '/nameserver\[0\]/{print $3; exit}')
          resolves_registry() {
            dig +short +time=2 +tries=1 "@$1" registry-1.docker.io A | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          }
          if [ -n "$primary_dns" ] && ! resolves_registry "$primary_dns"; then
            device=$(route -n get default | awk '/interface:/{print $2}')
            service=$(networksetup -listnetworkserviceorder | awk -v dev="$device" '/^\([0-9]+\)/ {name=$0; sub(/^\([0-9]+\) /,"",name)} index($0,"Device: " dev ")") {print name; exit}')
            for candidate in 1.1.1.1 8.8.8.8; do
              if [ -n "$service" ] && resolves_registry "$candidate"; then
                echo "Hosted runner resolver $primary_dns timed out; using verified resolver $candidate on $service for this disposable job"
                sudo networksetup -setdnsservers "$service" "$candidate"
                probe_host_dns after-resolver-change
                break
              fi
            done
          fi
          docker run --rm --pull=never alpine:3.21 true
          probe_host_dns after-first-container
          # Isolate builder admission from registry downloads and DDEV startup.
          mkdir "$scratch/build-probe"
          printf 'intel-ddev-builder\n' > "$scratch/build-probe/marker"
          printf 'FROM scratch\nCOPY marker /marker\n' > "$scratch/build-probe/Dockerfile"
          docker buildx ls
          if docker buildx build --progress=plain --no-cache --load -t intel-ddev-probe "$scratch/build-probe"; then
            docker image inspect intel-ddev-probe --format 'Registry-independent build succeeded: {{.Id}}'
          else
            echo 'Registry-independent build failed before DDEV startup.'
            docker version
          fi
          probe_host_dns after-build
          mkdir -p "$HOME/project/public"
          cp "$GITHUB_WORKSPACE/tests/ddev/index.php" "$HOME/project/public/index.php"
          cd "$HOME/project"
          ddev config global --instrumentation-opt-in=false --omit-containers=ddev-ssh-agent --use-docker-compose-from-path=true
          probe_host_dns before-ca-install
          mkcert -install
          probe_host_dns after-ca-install
          ddev config --project-name=asagiri-ddev --project-type=php --docroot=public --php-version=8.4 --database=mariadb:11.8 --router-http-port=8080 --router-https-port=8443 --performance-mode=none
          probe_host_dns after-project-config
          for action in start restart; do
            if ! ddev "$action"; then
              probe_host_dns "after-failed-$action"
              builder=buildx_buildkit_asagiri-build0
              docker buildx inspect || true
              docker inspect "$builder" --format '{{.State.Status}}' || true
              docker exec "$builder" cat /etc/buildkit/buildkitd.toml | sed -E 's@/[[:xdigit:]]{32}/@/[redacted]/@g' || true
              for endpoint in https://registry-1.docker.io/v2/ https://auth.docker.io/; do
                echo "BuildKit worker connectivity to $endpoint"
                docker exec "$builder" sh -c 'cat /etc/resolv.conf; ip route; wget -T 8 -S --spider "$1"' sh "$endpoint" 2>&1 | tee "$RUNNER_TEMP/worker-probe.log" || true
                worker_ip=$(sed -nE 's/.*Connecting to [^ ]+ \(([0-9.]+):443\).*/\1/p' "$RUNNER_TEMP/worker-probe.log" | head -1)
                if [[ -n "$worker_ip" ]]; then
                  authority=${endpoint#https://}
                  host=${authority%%/*}
                  # Linux tcp tables encode IPv4 octets in reverse order and ports in hex.
                  peer_hex=$(printf '%s\n' "$worker_ip" | awk -F. '{printf "%02X%02X%02X%02X:01BB", $4,$3,$2,$1}')
                  docker exec "$builder" sh -c '
                    wget -T 8 -S --spider "https://$1/" >/dev/null 2>&1 &
                    probe=$!
                    for delay in 1 1 2; do
                      sleep "$delay"
                      awk -v peer="$2" '\''$3 == peer {print "worker TCP peer", $3, "state", $4, "queues", $5, "retransmits", $7}'\'' /proc/net/tcp
                    done
                    wait "$probe" || true
                  ' sh "$worker_ip" "$peer_hex"
                  echo "Guest bridge control to $host using the same IPv4 peer"
                  docker run --rm --pull=never alpine:3.21 sh -c 'ip route; wget -T 8 -S --spider "https://$1/"' sh "$worker_ip" || true
                  curl --noproxy '*' --head --resolve "$host:443:$worker_ip" --max-time 8 --silent --show-error --output /dev/null --write-out 'Host peer=%{remote_ip} HTTP=%{http_code} TLS verify=%{ssl_verify_result}\n' "$endpoint" || true
                fi
              done
              docker logs --tail 150 "$builder" 2>&1 | grep -Ei 'mirror|trying next host|failed to resolve|not found|response.status' || true
              for image in ddev/ddev-webserver:v1.25.2 ddev/ddev-dbserver-mariadb-11.8:v1.25.2; do
                echo "Host registry manifest check for $image"
                docker buildx imagetools inspect "$image" || echo "Host manifest lookup failed for $image"
                if docker pull --platform linux/amd64 "$image"; then
                  docker image inspect "$image" --format 'Engine pull succeeded: {{.Id}} {{.Architecture}}'
                else
                  echo "Standalone engine pull failed for $image"
                fi
              done
              for registry_host in registry-1.docker.io auth.docker.io; do
                dscacheutil -q host -a name "$registry_host"
                curl --max-time 10 -sS -o /dev/null -w '%{http_code}\n' "https://$registry_host/" || true
              done
              docker run --rm --pull=never alpine:3.21 nslookup registry-1.docker.io || true
              docker pull ddev/ddev-utilities:latest || true
              exit 1
            fi
            test "$(curl -fsS --max-time 30 --resolve asagiri-ddev.ddev.site:8080:127.0.0.1 http://asagiri-ddev.ddev.site:8080/)" = asagiri-ddev:42
            test "$(curl -fsS --max-time 30 --cacert "$(mkcert -CAROOT)/rootCA.pem" --resolve asagiri-ddev.ddev.site:8443:127.0.0.1 https://asagiri-ddev.ddev.site:8443/)" = asagiri-ddev:42
            echo "PASS HTTP and trusted HTTPS with MariaDB after ddev $action"
          done
          ddev poweroff
