name: Windows process usage attribution
on:
  push:
    branches: [qualification/windows-process-usage-119]
permissions:
  contents: read
jobs:
  usage:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Sample a live child and an unrelated older Windows process
        run: |
          $env:USAGE_UNRELATED_PID = "$PID"
          cargo test --locked -p asagiri-win 'engine::usage::tests::' -- --nocapture --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
