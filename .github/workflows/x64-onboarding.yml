name: Inspect x64 AppImage onboarding window
on:
  push:
    branches: [qualification/linux-x64-onboarding-132]
permissions:
  contents: read
  actions: read
jobs:
  onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install desktop runtime and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb xauth xdotool imagemagick dbus-x11
      - name: Capture the main revision's x64 AppImage in a fresh X session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45112151103 -R AndreKurait/asagiri -n appimage-X64 -D package
          app="$PWD/package/Asagiri-0.0.0-x86_64.AppImage"
          echo "7a88b13167f563fe212bd84e56bf486e08fdff7cf8570769b4241b896781dd34  $app" | sha256sum -c -
          chmod +x "$app"
          mkdir -p observations "$RUNNER_TEMP/clean-home"
          HOME="$RUNNER_TEMP/clean-home" dbus-run-session -- xvfb-run -a bash -eu -o pipefail -s -- "$app" <<'SH'
          APPIMAGE_EXTRACT_AND_RUN=1 "$1" >observations/app.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          win=$(timeout 60 xdotool search --sync --onlyvisible --name 'Asagiri' | head -1)
          for delay in 10 20; do
            sleep "$delay"
            import -window "$win" "observations/window-$delay.png"
            identify -format '%f %wx%h %k colors\n' "observations/window-$delay.png"
          done
          SH
      - name: Verify direct AppImage launch and mounted filesystem
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p observations "$RUNNER_TEMP/fuse-home"
          ls -l /dev/fuse
          test -r /dev/fuse && test -w /dev/fuse
          HOME="$RUNNER_TEMP/fuse-home" dbus-run-session -- xvfb-run -a bash -eu -o pipefail -s <<'SH'
          app="$PWD/package/Asagiri-0.0.0-x86_64.AppImage"
          "$app" >observations/direct-launch.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          win=$(timeout 60 xdotool search --sync --onlyvisible --name Asagiri | head -1)
          sleep 10
          findmnt -rn -o TARGET,FSTYPE,SOURCE | awk '$2 ~ /^fuse/ && $1 ~ /\/.mount_/ {print; seen=1} END {exit !seen}' | tee observations/direct-mount.txt
          import -window "$win" observations/direct-window.png
          SH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: x64-onboarding-observations
          path: observations/
