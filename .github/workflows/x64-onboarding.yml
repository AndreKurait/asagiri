name: Verify published Linux AppImage graphical authorization and engine startup
on:
  push:
    branches: [qualification/linux-x64-onboarding-132]
permissions:
  contents: read
  actions: read
jobs:
  onboarding:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            digest: 4c18e613e5efa530cb109d8fc50154e92aa8dd4e3d662d4765be87e79b53b8ac
          - runner: ubuntu-24.04-arm
            arch: aarch64
            digest: a86e1b53e79c343535687f13ac8046fc376e1f903d58a44206129b3b6054d1f1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Install desktop runtime and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb xauth xdotool imagemagick dbus-x11 pkexec policykit-1-gnome
      - name: Download and verify published AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ matrix.digest }}
        run: |
          test "$(uname -m)" = "$ARCH"
          asset="Asagiri-0.1.14-dev.205-$ARCH.AppImage"
          gh release download v0.1.14-dev.205 -R AndreKurait/asagiri -p "$asset"
          echo "$DIGEST  $asset" | sha256sum -c -
          mv "$asset" release.AppImage
          chmod +x release.AppImage
      - name: Verify direct AppImage launch and mounted filesystem
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p observations "$RUNNER_TEMP/fuse-home"
          ls -l /dev/fuse
          test -r /dev/fuse && test -w /dev/fuse
          umask 077
          openssl rand -hex 24 | tr -d '\n' > "$RUNNER_TEMP/fuse-home/.test-password"
          trap 'rm -f "$RUNNER_TEMP/fuse-home/.test-password"' EXIT
          { printf '%s:' "$(id -un)"; cat "$RUNNER_TEMP/fuse-home/.test-password"; echo; } | sudo chpasswd
          sudo systemd-run --wait --pipe --collect --uid="$(id -un)" --property=PAMName=login --working-directory="$PWD" /usr/bin/env HOME="$RUNNER_TEMP/fuse-home" dbus-run-session -- xvfb-run -a bash -eu -o pipefail -s <<'SH'
          app="$PWD/release.AppImage"
          "$app" >observations/direct-launch.log 2>&1 &
          app_pid=$!
          agent=$(dpkg-query -L policykit-1-gnome | awk '/\/polkit-gnome-authentication-agent-1$/ {print; exit}')
          "$agent" >observations/auth-agent.log 2>&1 &
          agent_pid=$!
          sleep 2
          if ! kill -0 "$agent_pid"; then cat observations/auth-agent.log; exit 1; fi
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          win=$(timeout 60 xdotool search --sync --onlyvisible --name Asagiri | head -1)
          sleep 10
          findmnt -rn -o TARGET,FSTYPE,SOURCE | awk '$2 ~ /^fuse/ && $1 ~ /\/.mount_/ {print; seen=1} END {exit !seen}' | tee observations/direct-mount.txt
          import -window "$win" observations/direct-window.png
          # Button center measured on the Ubuntu x64 1152x800 language picker.
          test "$(identify -format '%wx%h' observations/direct-window.png)" = '1152x800'
          xdotool mousemove --window "$win" 786 677 click 1
          sleep 3
          import -window "$win" observations/after-continue.png
          xdotool mousemove --window "$win" 724 173 click 1
          for delay in 2 8; do
            sleep "$delay"
            import -window root "observations/after-start-$delay.png"
            xdotool search --onlyvisible --name '.*' getwindowname %@ >"observations/window-titles-$delay.txt" || true
          done
          grep -Ei 'authenticat|password' observations/window-titles-*.txt
          auth=$(timeout 10 xdotool search --sync --onlyvisible --name 'Authenticate' | head -1)
          xdotool windowfocus --sync "$auth"
          xdotool type --file "$HOME/.test-password"
          xdotool key Return
          for attempt in $(seq 1 60); do
            if sudo -n curl -fsS --unix-socket /run/asagiri/docker.sock http://localhost/_ping >observations/engine-ping.txt 2>/dev/null && grep -qx OK observations/engine-ping.txt; then break; fi
            sleep 2
          done
          grep -qx OK observations/engine-ping.txt
          compare -metric AE observations/direct-window.png observations/after-continue.png null: 2>observations/changed-pixels.txt || test "$?" = 1
          SH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: onboarding-${{ matrix.arch }}
          path: observations/
