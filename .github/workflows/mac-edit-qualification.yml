name: Native macOS edit shortcuts
on:
  push:
    branches: [qualification/settings-clipboard-158]
    paths: [.github/workflows/mac-edit-qualification.yml, tests/mac-native-edit.swift]
permissions:
  contents: read
  actions: read
jobs:
  native-edit:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise AppKit and WebKit keyboard routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset=Asagiri-0.1.14-dev.158-arm64.tar.gz
          gh release download v0.1.14-dev.158 -R AndreKurait/asagiri -p "$asset"
          echo "b623c6ec1aac8b4250f6c0856293fdec4957c715ef737b79a17d5dd689a7fe21  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          cd Asagiri.app/Contents/MacOS
          export HOME="$RUNNER_TEMP/edit-home" ASAGIRI_DATA_DIR="$RUNNER_TEMP/edit-store"
          scratch=$(mktemp -d /tmp/edit255.XXXXXX)
          export ASAGIRI_SOCKET="$scratch/engine.sock"
          mkdir -p "$HOME/.asagiri"
          echo '{"lang":"en","langAsked":true,"domainsAsked":true,"setupSkip":true}' > "$HOME/.asagiri/ui.json"
          echo '{"mode":"custom","http":"initial.invalid:3128"}' > "$HOME/.asagiri/proxy.json"
          ./asagiri daemon >"$scratch/daemon.log" 2>&1 &
          daemon=$!
          ./asagiri ui --view settings >"$scratch/ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" "$daemon" 2>/dev/null || true; wait || true; tail -40 "$scratch/ui.log"' EXIT
          swift "$GITHUB_WORKSPACE/tests/mac-native-edit.swift" "$ui_pid"
