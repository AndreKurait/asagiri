name: Windows named pipe recovery after a repaired socket
on:
  push:
    branches: [qualification/pipe-recovery-189]
permissions:
  contents: read
  actions: read
jobs:
  watch:
    name: Windows pipe recovery
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify released bridge replacement during upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/windows-pipe-recovery-189.ps1
