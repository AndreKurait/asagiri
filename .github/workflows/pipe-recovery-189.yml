name: Windows named pipe recovery after a repaired socket
on:
  push:
    branches: [qualification/pipe-recovery-189]
permissions:
  contents: read
  actions: read
jobs:
  watch:
    name: Windows pipe recovery
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check command dispatch while the engine pipe accepts without replying
        run: |
          $output = cargo test --locked -p asagiri-win start_with_stalled_pipe_dispatches_next_command -- --ignored --nocapture
          $output | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($output -join ' ') -notmatch '1 passed; 0 failed') { throw 'Stalled Start regression failed' }
