name: Windows named pipe recovery after a repaired socket
on:
  push:
    branches: [qualification/pipe-recovery-189]
permissions:
  contents: read
  actions: read
jobs:
  watch:
    name: Windows pipe recovery
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45369036201
          name: windows-X64
          path: ${{ runner.temp }}/windows-X64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45369036201
          name: linux-X64
          path: ${{ runner.temp }}/linux-X64
      - name: Repair a failed guest socket during bridge backoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/windows-pipe-recovery-189.ps1
