name: Release

on:
  # Build packages alongside CI. Publication checks the exact source commit
  # after packaging, so an unrelated Pages deployment cannot stall a release.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      recover_run:
        description: "Reuse complete packages from a failed official Release run"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Finish the active build and publication before the newest pending main
  # build starts. A merge must not discard packages already being published.
  # Stable tags and explicit recovery/manual runs have their own groups.
  group: release-${{ github.ref }}-${{ inputs.recover_run || (github.event_name == 'workflow_dispatch' && github.run_id) || 'current' }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  ASAGIRI_RELEASE_NOTES: docs/releases/asagiri.md

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.repository == 'AndreKurait/asagiri'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      artifact_run: ${{ steps.plan.outputs.artifact_run }}
      artifact_attempt: ${{ steps.plan.outputs.artifact_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the main prerelease or version-tag release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release.py plan

  linux:
    name: Linux packages (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.artifact_run == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
    steps: &linux_package_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job is skipped for package recovery. Otherwise plan verifies
          # github.sha belongs to main, and emits exactly that source commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] action and inputs come from the verified release checkout
        with:
          group: release
      - name: Restore compiler dependencies
        id: compiler_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v2-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/ci/images.json', 'scripts/ci/build-linux.sh') }}
      - name: Restore GNU compiler dependencies and pinned AppImage downloads
        id: appimage_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Select the source's Platform cache before release stamping changes
        # Cargo.toml and Cargo.lock. The builds still compile stamped packages.
        with:
          path: ${{ runner.temp }}/appimage-cache
          key: appimage-native-v2-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'packaging/linux/appimage-build.json', 'packaging/linux/native-build.json') }}
      - name: Restore pinned CLI downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] release-only key; fetch scripts verify every download against committed SHA-256 pins
        with:
          path: |
            ~/.cache/asagiri-linux-cli
            ~/.cache/asagiri-build
          key: release-linux-downloads-v1-${{ runner.arch }}-${{ hashFiles('crates/asagiri/src/cli_pins.rs', 'scripts/asagiri-linux.sh') }}
      - name: Prepare clean source for compatibility reports
        # The binaries use the declared release version; the test harness
        # retains the exact reviewed source tree when recording provenance.
        run: git worktree add --detach "$RUNNER_TEMP/compatibility-source" HEAD
      - name: Stamp the release version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/ci/release.py stamp "$VERSION"
      - name: Build and test the release binaries
        run: |
          python3 tests/ci-runtime-probes.py
          python3 tests/ci-hyperfine.py
          sh scripts/ci/build-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/cargo-registry" tests
          sh scripts/ci/live-tests.sh "$RUNNER_TEMP/bin"
      - name: Preserve Docker-to-Asagiri import evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-import-${{ matrix.arch }}
          path: ${{ runner.temp }}/bin-engine-import
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve health and Compose reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-compose-${{ matrix.arch }}
          path: ${{ runner.temp }}/bin-health-compose/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Verify registry TLS trust and actual BuildKit admission
        # Older release sources may predate this probe; package recovery keeps
        # its original evidence and already skips this entire build job.
        if: hashFiles('tests/registry-ca.py') != ''
        run: sh "$RUNNER_TEMP/compatibility-source/scripts/ci/registry-ca.sh" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/registry-ca"
      - name: Preserve registry TLS and BuildKit evidence
        if: always() && hashFiles('tests/registry-ca.py') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-ca-${{ matrix.arch }}
          path: ${{ runner.temp }}/registry-ca
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Restore Java SDK dependencies
        id: maven_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven
          key: testcontainers-java-v1-${{ runner.arch }}-${{ hashFiles('tests/testcontainers/pom.xml') }}
      - name: Test Java Testcontainers and MySQL
        run: sh scripts/ci/testcontainers.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/maven"
      - name: Verify Linux firewall and Docker coexistence
        run: python3 "$RUNNER_TEMP/compatibility-source/tests/linux-firewall.py" "$RUNNER_TEMP/bin" --output "$RUNNER_TEMP/linux-firewall"
      - name: Preserve Linux firewall diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-firewall-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-firewall/
          if-no-files-found: error
          retention-days: 90
      - name: Verify custom-network firewall and Docker coexistence
        run: python3 "$RUNNER_TEMP/compatibility-source/tests/linux-firewall.py" "$RUNNER_TEMP/bin" --user-network --output "$RUNNER_TEMP/linux-firewall-custom"
      - name: Preserve custom-network firewall diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-firewall-custom-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-firewall-custom/
          if-no-files-found: error
          retention-days: 90
      - name: Test a real DDEV PHP, MariaDB and HTTPS project
        run: python3 "$RUNNER_TEMP/compatibility-source/scripts/ci/ddev.py" "$RUNNER_TEMP/bin" --output "$RUNNER_TEMP/ddev"
      - name: Preserve DDEV runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddev-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/ddev/*.json
            ${{ runner.temp }}/ddev/*.log
          retention-days: 90
      - name: Cache verified Java SDK dependencies from main
        if: github.ref == 'refs/heads/main' && steps.maven_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] verified main source and the real SDK/MySQL checks must pass before saving dependencies
        with:
          path: ${{ runner.temp }}/maven
          key: ${{ steps.maven_cache.outputs.cache-primary-key }}
      - name: Build the native GNU engine and verify real NSS admission
        run: bash scripts/ci/build-linux-native.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/appimage-cache" tests
      - name: Preserve native GNU binaries and NSS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-bin
          if-no-files-found: error
          retention-days: 90
      - name: Build and install-test the Linux packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          bash scripts/ci/release-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/linux-inputs" "$RUNNER_TEMP/native-bin"
      - name: Build and inspect the native AppImage
        run: |
          bash scripts/ci/appimage.sh "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/appimage" "$RUNNER_TEMP/appimage-cache"
          cp "$RUNNER_TEMP/appimage/"*.AppImage "$RUNNER_TEMP/packages/"
      - name: Preserve AppImage packaging diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/appimage/*.json
            ${{ runner.temp }}/appimage/*.txt
          retention-days: 90
      - name: Cache verified AppImage dependencies from main
        if: github.ref == 'refs/heads/main' && steps.appimage_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] native package and AppImage checks must pass on verified main source before saving dependencies
        with:
          path: ${{ runner.temp }}/appimage-cache
          key: ${{ steps.appimage_cache.outputs.cache-primary-key }}
      - name: Cache compiler dependencies from successful main package builds
        if: github.ref == 'refs/heads/main' && steps.compiler_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] the verified main checkout must pass native unit, live, and package tests before seeding its architecture's cache
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.arch == 'x86_64' && 'linux-jammy-inputs' || 'packages-linux-aarch64' }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-inputs-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-inputs/*
          if-no-files-found: error
          retention-days: 7

  linux-arm:
    name: Linux packages (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.artifact_run == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps: *linux_package_steps

  checkpoint-runtime:
    name: Mac guest checkpoint runtime (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.artifact_run == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Build the checkpoint runtime on its native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 packaging/checkpoint/build.py --arch "$ARCH" --output "$RUNNER_TEMP/checkpoint-$ARCH.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/checkpoint-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

  checkpoint-source:
    name: Checkpoint runtime corresponding source
    needs: [plan, checkpoint-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checkpoint-runtime-*
          path: ${{ runner.temp }}/runtimes
          merge-multiple: true
      - name: Collect the source versions used by both guests
        run: |
          python3 packaging/checkpoint/source.py \
            --arm64 "$RUNNER_TEMP/runtimes/checkpoint-arm64.tar" \
            --x86-64 "$RUNNER_TEMP/runtimes/checkpoint-x86_64.tar" \
            --output "$RUNNER_TEMP/asagiri-checkpoint-source.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-checkpoint-source
          path: ${{ runner.temp }}/asagiri-checkpoint-source.tar
          if-no-files-found: error
          retention-days: 7

  jammy-desktop:
    name: Build and launch the amd64 desktop deb on Ubuntu 22.04
    needs: [plan, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-jammy-inputs
          path: ${{ runner.temp }}/packages
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # zizmor: ignore[cache-poisoning] release-only cache for the planned source revision
        with:
          cache-bin: false
          shared-key: release-jammy-desktop-x86_64
      - name: Package and exercise the release window
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 scripts/ci/release.py stamp "$VERSION"
          bash scripts/ci/jammy-desktop.sh "$RUNNER_TEMP/packages" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages-linux-x86_64
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 7

  guest:
    name: Guest kernels and corresponding source
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.artifact_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Recovery skips this job. All other plans validate github.sha as
          # main history, so use that fixed source for code and cache inputs.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore guest build products
        id: guest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] release-only keyspace; PRs cannot run this workflow or write main-scoped entries
        with:
          path: target/release-guest
          key: release-guest-v1-${{ hashFiles('guest/kernel/**', 'xtask/src/main.rs', 'scripts/ci/kernel-source.sh', 'scripts/ci/images.json') }}
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] action and inputs come from the verified release checkout
        if: steps.guest.outputs.cache-hit != 'true'
        with:
          group: release
      - name: Build both kernels, the sparse disk, and kernel source archive
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          free_kib=$(df -Pk . | awk 'END { print $4 }')
          [ "$free_kib" -ge 3145728 ] || { echo "Build guard: fewer than 3 GiB free"; exit 1; }
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          cargo xtask kernel --arch arm64
          cargo xtask kernel --arch x86_64
          cargo xtask disk
          mkdir -p target/release-guest
          tar -cSzf target/release-guest/guest-assets.tar.gz -C guest/out Image x86_64/bzImage data.img
          sh scripts/ci/kernel-source.sh target/release-guest/asagiri-kernel-source.tar.xz
      - name: Verify loop filesystems in both packaged guest kernels
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-system-arm qemu-system-x86 e2fsprogs
          mkdir -p guest/out
          tar -xzf target/release-guest/guest-assets.tar.gz -C guest/out Image x86_64/bzImage
          python3 tests/kernel-loop.py --output "$RUNNER_TEMP/guest-loop"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guest-loop
          path: ${{ runner.temp }}/guest-loop
          if-no-files-found: error
          retention-days: 14
      - name: Verify host file notifications in both packaged guest kernels
        run: python3 tests/kernel-fsnotify.py --output "$RUNNER_TEMP/guest-fsnotify"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guest-fsnotify
          path: ${{ runner.temp }}/guest-fsnotify
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-assets
          path: target/release-guest/guest-assets.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-kernel-source
          path: target/release-guest/asagiri-kernel-source.tar.xz
          if-no-files-found: error
          retention-days: 7

  qemu:
    name: Intel emulator and corresponding source
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.artifact_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: qemu-products-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/qemu # zizmor: ignore[self-repository] verified release source and pinned recipe
        with:
          output: ${{ runner.temp }}/asagiri-qemu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-build-products
          path: ${{ runner.temp }}/asagiri-qemu/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-qemu-source
          path: ${{ runner.temp }}/asagiri-qemu/asagiri-qemu-source.tar.xz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS packages (${{ matrix.arch }})
    needs: [plan, guest, qemu, checkpoint-runtime]
    runs-on: ${{ matrix.runner }}
    # Leave time for both app and final-DMG notarization after compilation.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            app: target/Asagiri.app
          - arch: x86_64
            runner: macos-26-intel
            app: target/intel/Asagiri.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Prepare the Mac test time zone
        # Native bind tests exercise the real /etc/localtime symlink.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/etc/localtime")
          print(f"Before setup: exists={path.exists()}, link={path.readlink() if path.is_symlink() else None}")
          print(f"Before setup resolved path: {path.resolve()}")
          PY
          # systemsetup can remove a valid link on hosted macOS 26 (error -99).
          # Preserve the runner's time zone; supply its UTC link only if absent.
          if [ ! -f /etc/localtime ]; then
            test ! -e /etc/localtime
            test -f /var/db/timezone/zoneinfo/UTC
            sudo ln -sfn /var/db/timezone/zoneinfo/UTC /etc/localtime
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/etc/localtime")
          print(f"Configured time zone file: {path.resolve(strict=True)}")
          assert path.is_file(), "The Mac tests require a time zone file"
          PY
      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update --target aarch64-unknown-linux-musl --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # zizmor: ignore[cache-poisoning] release-only shared key; only main-ancestry-verified release jobs can save this cache
        with:
          cache-bin: false
          shared-key: release-macos-${{ matrix.arch }}
      - name: Cache verified CLI downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] release-only key; xtask verifies all cached CLI files against committed SHA-256 pins
        with:
          path: target/cli-cache
          key: release-macos-downloads-v1-${{ runner.arch }}-${{ hashFiles('crates/asagiri/src/cli_pins.rs') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest-assets
          path: ${{ runner.temp }}/guest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checkpoint-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtimes
      - name: Download the Intel emulator and matching source record
        if: matrix.arch == 'x86_64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qemu-build-products
          path: ${{ runner.temp }}/asagiri-qemu
      - name: Install the verified Intel guest emulator
        if: matrix.arch == 'x86_64'
        run: |
          python3 packaging/qemu/bundle.py install --products "$RUNNER_TEMP/asagiri-qemu" \
            --destination guest/out/qemu
      - name: Install Docker CLI and Compose for configuration tests
        run: |
          brew install docker docker-compose
          mkdir -p "$RUNNER_TEMP/docker-config/cli-plugins"
          ln -s "$(brew --prefix docker-compose)/bin/docker-compose" "$RUNNER_TEMP/docker-config/cli-plugins/docker-compose"
          DOCKER_CONFIG="$RUNNER_TEMP/docker-config" docker compose version
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Prepare optional Developer ID signing
        env:
          ASAGIRI_APPLE_CERTIFICATE_BASE64: ${{ secrets.ASAGIRI_APPLE_CERTIFICATE_BASE64 }}
          ASAGIRI_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.ASAGIRI_APPLE_CERTIFICATE_PASSWORD }}
          ASAGIRI_APPLE_API_KEY_BASE64: ${{ secrets.ASAGIRI_APPLE_API_KEY_BASE64 }}
          ASAGIRI_APPLE_API_KEY_ID: ${{ secrets.ASAGIRI_APPLE_API_KEY_ID }}
          ASAGIRI_APPLE_API_ISSUER_ID: ${{ secrets.ASAGIRI_APPLE_API_ISSUER_ID }}
          ASAGIRI_REQUIRE_APPLE_SIGNING: ${{ vars.ASAGIRI_REQUIRE_APPLE_SIGNING }}
        run: python3 scripts/ci/macos-signing.py prepare
      - name: Build and verify the application and DMG
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
          APP: ${{ matrix.app }}
        run: |
          python3 scripts/ci/release.py stamp "$VERSION"
          mkdir -p guest/out "$RUNNER_TEMP/packages"
          tar -xzf "$RUNNER_TEMP/guest/guest-assets.tar.gz" -C guest/out
          cargo test --locked
          ASAGIRI_CRIU_RUNTIME="$RUNNER_TEMP/runtimes/checkpoint-$ARCH.tar" cargo xtask guest --arch "$ARCH"
          initramfs=guest/out/initramfs.cpio
          if [ "$ARCH" = x86_64 ]; then initramfs=guest/out/x86_64/initramfs.cpio; fi
          cargo xtask release --arch "$ARCH"
          cargo xtask dmg --arch "$ARCH"
          python3 scripts/ci/macos-signing.py finalize --app "$APP" --arch "$ARCH" --version "$VERSION"
          codesign --verify --deep --strict "$APP"
          python3 scripts/ci/macos-package.py --app "$APP" --archive "target/Asagiri-$VERSION-$ARCH.tar.gz" --arch "$ARCH" --version "$VERSION" --initramfs "$initramfs" --output "$RUNNER_TEMP/macos-package-identity.json"
          hdiutil verify "target/Asagiri-$VERSION-$ARCH.dmg"
          if [ "$ARCH" = x86_64 ]; then
            python3 packaging/qemu/bundle.py verify --directory "$APP/Contents/Resources/qemu"
          fi
          cp "target/Asagiri-$VERSION-$ARCH.tar.gz" "target/Asagiri-$VERSION-$ARCH.dmg" "target/latest-mac-$ARCH.json" "$RUNNER_TEMP/packages/"
      - name: Preserve the verified Mac package identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-package-identity-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-package-identity.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization-diagnostics-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/asagiri-signing/*-submission.json
            ${{ runner.temp }}/asagiri-signing/*-failure.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary Apple credentials
        if: always()
        run: python3 scripts/ci/macos-signing.py cleanup

  windows-tests:
    name: Windows launcher tests
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.artifact_run == ''
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # zizmor: ignore[cache-poisoning] release-only cache for the planned source revision
        with:
          cache-bin: false
          shared-key: release-windows-host-tests
      - name: Install the Compose plugin shipped with the Windows app
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -nE 's/^pub const WIN_COMPOSE: .* = \("([^"]+)", "([0-9a-f]{64})"\);$/\1 \2/p' crates/asagiri/src/cli_pins.rs)
          read -r version digest <<< "$pin"
          test -n "$digest"
          config="$(cygpath -u "$RUNNER_TEMP")/docker-config"
          mkdir -p "$config/cli-plugins"
          plugin="$config/cli-plugins/docker-compose.exe"
          curl --fail --location --retry 3 "https://github.com/docker/compose/releases/download/$version/docker-compose-windows-x86_64.exe" -o "$plugin"
          echo "$digest  $plugin" | sha256sum --check
          chmod +x "$plugin"
          DOCKER_CONFIG="$(cygpath -w "$config")"
          export DOCKER_CONFIG
          test "$(docker compose version --short | tr -d '\r')" = "${version#v}"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Test the release-stamped Windows launcher
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/ci/windows-launcher-tests.ps1

  windows:
    name: Windows packages (${{ matrix.arch }})
    needs: [plan, linux]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    strategy:
      matrix:
        include:
          - arch: x86_64
            linux: x86_64
    steps: &windows_package_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Install the pinned Rust and WiX tools
        run: |
          rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal --no-self-update --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wix extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wix extension add -g WixToolset.Util.wixext/6.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # zizmor: ignore[cache-poisoning] release-only shared key; only main-ancestry-verified release jobs can save this cache
        with:
          cache-bin: false
          shared-key: release-windows-${{ matrix.arch }}
      - name: Cache verified CLI downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] release-only key; xtask verifies downloads and the ARM64 CLI build against committed hashes
        with:
          path: target/cli-cache
          key: release-windows-downloads-v1-${{ matrix.arch }}-${{ hashFiles('crates/asagiri/src/cli_pins.rs') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-inputs-${{ matrix.linux }}
          path: ${{ runner.temp }}/linux-inputs
      - name: Build the complete Windows bundle and MSI
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
          ARCH: ${{ matrix.arch }}
          LINUX_ARCH: ${{ matrix.linux }}
          ASAGIRI_WINDOWS_LINUX_DIR: ${{ runner.temp }}/linux-inputs
        run: |
          $metadata = Get-Content "$env:ASAGIRI_WINDOWS_LINUX_DIR/build.json" -Raw | ConvertFrom-Json
          if ($metadata.version -ne $env:VERSION -or $metadata.arch -ne $env:LINUX_ARCH -or $metadata.commit -ne $env:SOURCE_COMMIT) {
            throw "Linux inputs do not match this release version, architecture, and source commit"
          }
          foreach ($file in @("asagiri", "asagiri-init", "asagiri-linux.tar.gz")) {
            $hash = (Get-FileHash "$env:ASAGIRI_WINDOWS_LINUX_DIR/$file" -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $metadata.sha256.$file) { throw "Linux input hash mismatch: $file" }
          }
          python scripts/ci/release.py stamp "$env:VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo xtask msi --arch "$env:ARCH"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/packages" | Out-Null
          Copy-Item "target/Asagiri-$env:VERSION-$env:ARCH.msi","target/latest-windows-$env:ARCH.json" "$env:RUNNER_TEMP/packages/"
          Compress-Archive -Path "target/asagiri-windows-$env:LINUX_ARCH/*" -DestinationPath "$env:RUNNER_TEMP/packages/Asagiri-$env:VERSION-windows-$env:ARCH.zip"
      - name: Install and remove the x86_64 MSI without starting WSL
        if: matrix.arch == 'x86_64'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          & installer/windows/verify.ps1 -Msi "$env:GITHUB_WORKSPACE/target/Asagiri-$env:VERSION-x86_64.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Keep the x86_64 installer logs
        if: always() && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-logs-x86_64
          path: target/msi-verify/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 7

  windows-arm:
    name: Windows packages (${{ matrix.arch }})
    needs: [plan, linux-arm]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    strategy:
      matrix:
        include:
          - arch: arm64
            linux: aarch64
    steps: *windows_package_steps

  windows-arm-install:
    name: Windows Arm installer check
    needs: [plan, windows-arm]
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-windows-arm64
          path: ${{ runner.temp }}/packages
      - name: Install and remove the arm64 MSI without starting WSL
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "Arm64") {
            throw "The arm64 installer must be tested on Windows Arm"
          }
          & installer/windows/verify.ps1 -Msi "$env:RUNNER_TEMP/packages/Asagiri-$env:VERSION-arm64.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Keep the arm64 installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-install-logs-arm64
          path: target/msi-verify/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Verify uploads and publish
    needs: [plan, linux, linux-arm, checkpoint-source, jammy-desktop, guest, qemu, macos, windows-tests, windows, windows-arm, windows-arm-install]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ready == 'true' &&
      (needs.plan.outputs.artifact_run != '' ||
       (needs.linux.result == 'success' && needs.linux-arm.result == 'success' && needs.jammy-desktop.result == 'success' && needs.checkpoint-source.result == 'success' && needs.guest.result == 'success' && needs.qemu.result == 'success' &&
        needs.macos.result == 'success' && needs.windows-tests.result == 'success' && needs.windows.result == 'success' && needs.windows-arm.result == 'success' &&
        needs.windows-arm-install.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Read the package source and its release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: release-source
          persist-credentials: false
      - name: Require successful CI for this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: python3 scripts/ci/release.py checks "$COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Require every package and validate the update metadata
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          ASAGIRI_PACKAGE_RUN_ID: ${{ needs.plan.outputs.artifact_run || github.run_id }}
          ASAGIRI_PACKAGE_RUN_ATTEMPT: ${{ needs.plan.outputs.artifact_run != '' && needs.plan.outputs.artifact_attempt || github.run_attempt }}
        run: python3 scripts/ci/release.py collect dist "$VERSION" "$COMMIT" --source-root release-source
      - name: Attest the release artifacts
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: target/release-provenance.json
      - name: Include the provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/attestation.sigstore.json
      - name: Upload, verify every GitHub digest, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release.py publish dist --source-root release-source
