name: Verify Windows host-IP publishing diagnostics on the published MSI
on:
  push:
    branches: [qualification/windows-ports-125]
    paths: [.github/workflows/windows-ports-125.yml]
permissions:
  actions: read
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c4da961d9351b3e898baf6842295f3f86caafc9
          persist-credentials: false
      - name: Prepare WSL
        run: |
          wsl.exe --status
          if ($LASTEXITCODE) {
            wsl.exe --install --no-distribution --web-download
            if ($LASTEXITCODE) { throw "WSL setup exited with $LASTEXITCODE" }
          }
          wsl.exe --version
          if ($LASTEXITCODE) { throw 'WSL is unavailable on this runner' }
      - name: Verify port publication through the released Windows launcher and WSL distro
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_BUILD: "205"
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RUNNER_TEMP
          $build = $env:QUALIFICATION_BUILD
          if ($build -notmatch '^[0-9]+$') { throw 'Set QUALIFICATION_BUILD to the published dev build containing PR #352' }
          $installStep = 1
          $version = "0.1.14-dev.$build"
          $asset = "Asagiri-$version-x86_64.msi"
          gh release download "v$version" -R AndreKurait/asagiri -p $asset
          if ($LASTEXITCODE) { throw 'Published MSI download failed' }
          if ((Get-FileHash $asset).Hash -ne '1592852ad8ae07a8b903592ec868164697ba49a38629e47de55127da646dc8b2') { throw 'MSI digest mismatch' }
          $install = Start-Process msiexec -ArgumentList "/i `"$env:RUNNER_TEMP\$asset`" /qn /norestart /l*v `"$env:RUNNER_TEMP\asagiri-msi-$installStep-$build.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install $version failed with $($install.ExitCode)" }
          $bundle = Join-Path $env:LOCALAPPDATA 'Asagiri'
          $app = Join-Path $bundle 'asagiri-win.exe'
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --import port125 "$env:RUNNER_TEMP/port125" "$bundle/asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { throw 'Importing the MSI bundled distro failed' }
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-port125'
          $launcher = Start-Process $app -ArgumentList '--distro','port125','--pipe','\\.\pipe\asagiri-port125' -PassThru
          try {
            for ($i=0; $i -lt 90; $i++) {
              & $docker info 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 2
            }
            if ($LASTEXITCODE) { throw 'Engine startup failed' }
            & $docker pull alpine:3.21
            if ($LASTEXITCODE) { throw 'Alpine pull failed' }
            $address = (Get-NetIPConfiguration | Where-Object IPv4DefaultGateway | Select-Object -First 1).IPv4Address.IPAddress
            if (!$address) { throw 'Windows host IPv4 address unavailable' }
            $denied = & $docker run -d -p "${address}:18921:80" alpine:3.21 sleep 120 2>&1 | Out-String
            if (!$LASTEXITCODE -or $denied -notlike "*cannot publish on Windows host address $address from WSL*") { throw "Unexpected explicit address result $denied" }
            Write-Host $denied
            $wild = & $docker run -d --name port125 -p 0.0.0.0:18922:80 busybox:1.37 sh -c 'echo port125 >/tmp/index.html && exec httpd -f -p 80 -h /tmp' 2>&1 | Out-String
            if ($LASTEXITCODE -or $wild -notlike '*Wildcard bindings do not configure Windows LAN access*') { throw "Unexpected wildcard result $wild" }
            Write-Host $wild
            & $docker inspect port125 --format '{{json .State}} {{json .NetworkSettings.Ports}}'
            & $docker logs port125
            & $docker exec port125 wget -qO- http://127.0.0.1:80/
            if ($LASTEXITCODE) { throw 'HTTP failed inside the serving container' }
            wsl.exe -d port125 -- wget -O- -T 5 http://127.0.0.1:18922/
            Write-Host "WSL loopback HTTP exit: $LASTEXITCODE"
            wsl.exe -d port125 -- hostname -I
            Get-NetTCPConnection -LocalPort 18922 -ErrorAction SilentlyContinue | Format-Table LocalAddress,LocalPort,State,OwningProcess
            curl.exe --fail --retry 8 --retry-connrefused --retry-delay 1 http://127.0.0.1:18922/ -o response.txt
            if ($LASTEXITCODE -or (Get-Content response.txt -Raw).Trim() -ne 'port125') { throw 'Windows loopback HTTP check failed' }
            Write-Host 'PASS explicit host IP diagnostic, wildcard warning, and Windows loopback HTTP'
          } finally { if (!$launcher.HasExited) { Stop-Process -Id $launcher.Id } }
