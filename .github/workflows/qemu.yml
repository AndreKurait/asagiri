name: Intel ARM emulation
on:
  pull_request:
    paths:
      - packaging/qemu/**
      - tests/ci-qemu.py
      - .github/workflows/qemu.yml
      - .github/actions/qemu/**
  push:
    branches: [main]
    paths:
      - packaging/qemu/**
      - tests/ci-qemu.py
      - .github/workflows/qemu.yml
      - .github/actions/qemu/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-source-v1-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  qemu:
    name: Static QEMU and corresponding source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      # Main and Release share the cache: let one cold build finish first.
      group: qemu-products-${{ github.repository }}-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qemu # zizmor: ignore[self-repository] build recipe from the checked-out source
        with:
          output: ${{ runner.temp }}/asagiri-qemu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-build-products
          path: ${{ runner.temp }}/asagiri-qemu/*
          if-no-files-found: error
          retention-days: 14
