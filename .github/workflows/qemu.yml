name: Intel ARM emulation
on:
  pull_request:
    paths:
      - packaging/qemu/**
      - tests/ci-qemu.py
      - .github/workflows/qemu.yml
  push:
    branches: [main]
    paths:
      - packaging/qemu/**
      - tests/ci-qemu.py
      - .github/workflows/qemu.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  qemu:
    name: Static QEMU and corresponding source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source collection boundaries
        run: python3 tests/ci-qemu.py
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential bison flex gettext \
            libncurses-dev rsync unzip file bc cpio wget libssl-dev python3 xz-utils \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build the emulator, exercise ARM64 code and collect sources
        run: |
          python3 packaging/qemu/build.py build \
            --work "$RUNNER_TEMP/asagiri-qemu-build" --output "$RUNNER_TEMP/asagiri-qemu"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-build-products
          path: ${{ runner.temp }}/asagiri-qemu/*
          if-no-files-found: error
          retention-days: 14
