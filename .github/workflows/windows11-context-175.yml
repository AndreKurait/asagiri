name: Windows 11 dashboard context verification
on:
  push:
    branches: [qualification/windows11-context-175]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the dashboard switch in Windows Edge
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture
          Write-Host "Docker Desktop installed: $(Test-Path "$env:ProgramFiles\Docker\Docker\Docker Desktop.exe")"
          @'
          import os, pathlib, runpy, subprocess, tempfile
          from html.parser import HTMLParser
          class Results(HTMLParser):
              reading = False
              def handle_starttag(self, tag, attrs):
                  if dict(attrs).get('id') == 'results': self.reading = True
              def handle_endtag(self, tag):
                  if tag == 'pre': self.reading = False
              def handle_data(self, data):
                  if self.reading: self.lines.extend(data.splitlines())
          edge = next(p for env in ('ProgramFiles(x86)', 'ProgramFiles') if (p := pathlib.Path(os.environ[env]) / 'Microsoft/Edge/Application/msedge.exe').is_file())
          page = runpy.run_path('scripts/ui-test.py')['page']('tests/ui/switch.js', 'windows')
          with tempfile.TemporaryDirectory() as d:
              path = pathlib.Path(d) / 'switch.html'
              path.write_text(page, encoding='utf-8')
              result = subprocess.run([str(edge), '--headless', '--disable-gpu', '--no-first-run', '--user-data-dir='+d+'/profile', '--dump-dom', path.as_uri()], capture_output=True, timeout=90, check=True)
              report = Results(); report.lines = []; report.feed(result.stdout.decode('utf-8', errors='replace'))
              print('\n'.join(report.lines))
              assert len(report.lines) == 13 and all(line.startswith('PASS ') for line in report.lines), report.lines
          '@ | python -X utf8 -
          exit $LASTEXITCODE
      - name: Verify this Windows 11 host can boot a WSL2 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_Processor | Select-Object Name,VirtualizationFirmwareEnabled,SecondLevelAddressTranslationExtensions
          wsl.exe --version
          wsl.exe --set-default-version 2
          if ($LASTEXITCODE) { throw 'Could not select WSL2' }
          wsl.exe --install --distribution Ubuntu --no-launch --web-download
          if ($LASTEXITCODE) { throw "WSL distro installation exited $LASTEXITCODE" }
          wsl.exe -d Ubuntu -u root -- uname -r
          if ($LASTEXITCODE) { throw "Windows 11 WSL2 boot exited $LASTEXITCODE" }
          wsl.exe --list --verbose
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
