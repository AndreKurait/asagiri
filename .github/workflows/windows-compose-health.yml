name: Published WSL Compose health and build
on:
  push:
    branches: [qualification/windows-compose-health-168]
    paths: [.github/workflows/windows-compose-health.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the Compose health suite in the published WSL distro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Asagiri-0.1.14-dev.158-windows-x86_64.zip'
          Set-Location $env:RUNNER_TEMP
          gh release download v0.1.14-dev.158 --repo AndreKurait/asagiri --pattern $asset
          if ((Get-FileHash $asset).Hash.ToLower() -ne '62299f7f19506e2fc01d91b2f55f8a56347eb9c0a754afd75796d6fd6bfb5db6') { throw 'Published bundle hash mismatch' }
          Expand-Archive $asset -DestinationPath load-test
          $app = (Get-ChildItem load-test -Filter asagiri-win.exe -Recurse -File -ErrorAction Stop).FullName
          $bundle = Split-Path $app
          $docker = Join-Path $bundle 'bin/docker.exe'
          wsl.exe --version
          wsl.exe --import Asagiri-health-168 "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','Asagiri-health-168','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            for ($i = 0; $i -lt 45; $i++) {
              & $docker version --format '{{.Server.Version}}' 2>$null
              if ($LASTEXITCODE -eq 0) { break }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            Invoke-Docker @('pull','alpine:3.21')
            $repo = (wsl.exe -d Asagiri-health-168 -- wslpath -a $env:GITHUB_WORKSPACE).Trim()
            if ($LASTEXITCODE) { throw 'Cannot resolve checkout inside WSL' }
            wsl.exe -d Asagiri-health-168 -u root -- apk add --no-cache python3 docker-cli ca-certificates
            if ($LASTEXITCODE) { throw 'Cannot install native WSL test clients' }
            wsl.exe -d Asagiri-health-168 -u root -- python3 "$repo/scripts/ci/compose-health-client.py" /tmp/compose-health-client
            if ($LASTEXITCODE) { throw 'Pinned Compose client download failed' }
            wsl.exe -d Asagiri-health-168 -u root -- python3 "$repo/tests/compose-health.py" /var/lib/asagiri-daemon/.asagiri/run/docker.sock alpine:3.21 --disposable-wsl --compose-plugin /tmp/compose-health-client/docker-compose --output /tmp/compose-health.json
            $exitCode = $LASTEXITCODE
            wsl.exe -d Asagiri-health-168 -- cat /tmp/compose-health.json
            if ($exitCode) { throw "Compose health suite failed ($exitCode)" }
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate Asagiri-health-168
          }
