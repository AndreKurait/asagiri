name: Four-service Compose dashboard qualification
on:
  push:
    branches: [qualification/compose-live-358]
permissions:
  contents: read
jobs:
  builder-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Package the Linux amd64 BuildKit image
        run: |
          docker pull moby/buildkit:buildx-stable-1
          docker save -o "$RUNNER_TEMP/buildkit.tar" moby/buildkit:buildx-stable-1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: buildkit-amd64
          path: ${{ runner.temp }}/buildkit.tar
          retention-days: 1
  dashboard:
    needs: builder-image
    runs-on: macos-26-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build candidate dashboard tests
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          cargo +1.99.1 test --locked -p asagiri --bin asagiri --no-run --message-format=json > "$RUNNER_TEMP/build.jsonl"
          jq -ser 'map(select(.reason == "compiler-artifact" and .target.name == "asagiri" and .profile.test and .executable != null) | .executable) | if length == 1 then .[0] else error("expected one test binary") end' "$RUNNER_TEMP/build.jsonl" > "$RUNNER_TEMP/test-path"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: buildkit-amd64
          path: ${{ runner.temp }}
      - name: Exercise the dashboard against the published engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=Asagiri-0.1.14-dev.161-x86_64.tar.gz
          gh release download v0.1.14-dev.161 -p "$asset" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo "a72fcb055f510aa3c59b54169caed97d07d01ba492fdd02f7cb33a4e11731c66  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          export PATH="$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin:$PATH"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config" ASAGIRI_DATA_DIR="$RUNNER_TEMP/engine-store"
          scratch=$(mktemp -d /tmp/asagiri-358.XXXXXX)
          export ASAGIRI_SOCKET="$scratch/engine.sock" DOCKER_HOST="unix://$scratch/engine.sock"
          unset DOCKER_CONTEXT
          mkdir -p "$DOCKER_CONFIG"
          jq -n --arg dir "$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin/cli-plugins" '{cliPluginsExtraDirs:[$dir]}' > "$DOCKER_CONFIG/config.json"
          docker compose version
          Asagiri.app/Contents/MacOS/asagiri daemon >"$scratch/daemon.log" 2>&1 &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true; wait "$daemon" || true; tail -80 "$scratch/daemon.log"' EXIT
          for _ in {1..60}; do docker version >/dev/null 2>&1 && break; kill -0 "$daemon"; sleep 1; done
          docker version
          # The daemon answers version requests before the guest can run containers.
          for attempt in 1 2 3; do
            if docker run --rm --network none alpine:3.21 true; then break; fi
            test "$attempt" != 3
          done
          # Pull the fixture services before starting the BuildKit container.
          docker pull redis:7-alpine
          docker pull postgres:16-alpine
          docker load -i "$RUNNER_TEMP/buildkit.tar"
          docker image inspect moby/buildkit:buildx-stable-1 >/dev/null
          docker context create compose-qualification --docker "host=$DOCKER_HOST"
          docker buildx create --name asagiri-build --driver docker-container \
            --driver-opt default-load=true compose-qualification
          export BUILDX_BUILDER=asagiri-build
          if ! docker buildx inspect "$BUILDX_BUILDER" --bootstrap; then
            # Compare the runner's resolver and registry connection with the daemon's pull.
            scutil --dns
            for endpoint in registry-1.docker.io auth.docker.io; do
              dscacheutil -q host -a name "$endpoint"
              curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w '%{remote_ip} %{http_code}\n' "https://$endpoint/v2/" || true
            done
            exit 1
          fi
          export ASAGIRI_LIVE_DIR="$scratch/project" ASAGIRI_LIVE_OUT="$scratch/results"
          cp -R "$GITHUB_WORKSPACE/tests/fixtures/compose-dashboard" "$ASAGIRI_LIVE_DIR"
          if ! "$(cat "$RUNNER_TEMP/test-path")" --ignored --exact ui::compose::live::live_compose --nocapture | tee "$scratch/test.log"; then
            scutil --dns || true
            dscacheutil -q host -a name registry-1.docker.io || true
            curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w 'registry host %{remote_ip} %{http_code}\n' https://registry-1.docker.io/v2/ || true
            docker exec buildx_buildkit_asagiri-build0 cat /etc/resolv.conf || true
            docker exec buildx_buildkit_asagiri-build0 nslookup registry-1.docker.io || true
            for image in node:22-alpine golang:1.25-alpine alpine:3.20; do
              docker buildx imagetools inspect "$image" || true
            done
            docker logs --tail 100 buildx_buildkit_asagiri-build0 || true
            exit 1
          fi
          grep -F '1 passed; 0 failed' "$scratch/test.log"
