name: Published AppImage FUSE and desktop launch
on:
  push:
    branches: [qualification/linux-appimage-fuse-132]
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Run the published portable CLI and desktop with FUSE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          test "$(uname -m)" = x86_64
          asset=Asagiri-0.1.14-dev.161-x86_64.AppImage
          gh release download v0.1.14-dev.161 -R AndreKurait/asagiri -p "$asset"
          echo "82a7e2a16fa278ed53f0447b3a2972e5d5761eadb2adac6d1ba58a7e099dc197  $asset" | sha256sum -c -
          sudo modprobe fuse
          image=registry.opensuse.org/opensuse/tumbleweed:latest
          docker pull "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}'
          docker run --rm -i --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            -v "$PWD/$asset:/fixture/$asset:ro" -e asset="$asset" "$image" bash -euo pipefail <<'TUMBLEWEED'
          cat /etc/os-release
          zypper --non-interactive install --no-recommends libfuse2 fuse libgtk-3-0 libwebkit2gtk-4_1-0 xorg-x11-server-Xvfb xvfb-run xauth xdotool dbus-1 dbus-1-daemon dbus-1-tools util-linux coreutils gawk
          mkdir /tmp/qa
          cd /tmp/qa
          cp "/fixture/$asset" .
          chmod +x "$asset"
          unset APPIMAGE_EXTRACT_AND_RUN APPDIR
          "./$asset" --version | tee cli-version
          grep -F '0.1.14-dev.161' cli-version
          export APPIMAGE_TEST_BINARY="$PWD/$asset"
          dbus-run-session -- xvfb-run -a bash -euo pipefail <<'DESKTOP'
          export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1
          "$APPIMAGE_TEST_BINARY" >desktop.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat desktop.log' EXIT
          for i in {1..100}; do
            kill -0 "$pid"
            if xdotool search --onlyvisible --name 'Asagiri' >windows; then break; fi
            sleep .3
          done
          test -s windows
          window=$(head -1 windows)
          xdotool getwindowname "$window"
          owner=$(xdotool getwindowpid "$window")
          exe=$(readlink -f "/proc/$owner/exe")
          fs=$(awk -v exe="$exe" '
            ($5 == "/" || index(exe, $5 "/") == 1) && length($5) > longest {
              longest = length($5)
              for (i = 7; i <= NF; i++) if ($i == "-") { fs = $(i + 1); break }
            }
            END { print fs }
          ' "/proc/$owner/mountinfo")
          echo "Visible window PID $owner executable $exe filesystem $fs"
          test "${exe##*/}" = asagiri-window
          case "$fs" in fuse*) ;; *) exit 1 ;; esac
          DESKTOP
          TUMBLEWEED
