name: Verify published Windows Buildx through the installed MSI
on:
  push:
    branches: [qualification/stable-windows-buildx-100]
    paths: [.github/workflows/windows-buildx-transport-100.yml]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - name: Download and verify published ARM64 MSI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.14-dev.329
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne "Arm64") { throw "Expected native Windows ARM64" }
          $version = $env:RELEASE_TAG.Substring(1)
          $asset = "Asagiri-$version-arm64.msi"
          $release = gh release view $env:RELEASE_TAG -R AndreKurait/asagiri --json isDraft,assets | ConvertFrom-Json
          $entry = @($release.assets | Where-Object name -eq $asset)
          if ($release.isDraft -or $entry.Count -ne 1) { throw 'Expected one published MSI' }
          gh release download $env:RELEASE_TAG -R AndreKurait/asagiri -p $asset -D $env:RUNNER_TEMP
          $digest = (Get-FileHash (Join-Path $env:RUNNER_TEMP $asset)).Hash.ToLower()
          if ($entry[0].digest -ne "sha256:$digest") { throw 'Published MSI digest mismatch' }
          Write-Host "Verified $asset sha256:$digest"
          "ASAGIRI_TEST_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and run an image through the Windows named pipe
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RUNNER_TEMP
          $version = $env:ASAGIRI_TEST_VERSION
          $build = 'stable'
          $imported = $false
          $asset = "Asagiri-$version-arm64.msi"
          $install = Start-Process msiexec -ArgumentList "/i `"$env:RUNNER_TEMP\$asset`" /qn /norestart /l*v `"$env:RUNNER_TEMP\install-$build.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install $version failed with $($install.ExitCode)" }
          $bundle = Join-Path $env:LOCALAPPDATA 'Asagiri'
          $app = Join-Path $bundle 'asagiri-win.exe'
          $docker = Join-Path $bundle 'bin/docker.exe'
          $features = 'VirtualMachinePlatform','Microsoft-Windows-Subsystem-Linux'
          foreach ($feature in $features) { Get-WindowsOptionalFeature -Online -FeatureName $feature | Select-Object FeatureName,State | Out-Host }
          $wslMsi = Join-Path $env:RUNNER_TEMP 'wsl-arm64.msi'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/WSL/releases/download/3.0.3/wsl.3.0.3.0.arm64.msi' -OutFile $wslMsi
          $wslHash = '2937c7ce840bb35ec6e97f052189bdfff27f8c3463bfdd231df9a958212787a3'
          if ((Get-FileHash $wslMsi).Hash.ToLower() -ne $wslHash) { throw 'Pinned WSL MSI digest mismatch' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $bundle 'asagiri-admin.ps1') -Wsl -Msi $wslMsi -Sha256 $wslHash
          $setupCode = $LASTEXITCODE
          Write-Host "Published WSL setup helper exit code $setupCode"
          foreach ($feature in $features) { Get-WindowsOptionalFeature -Online -FeatureName $feature | Select-Object FeatureName,State | Out-Host }
          if ($setupCode -eq 3010) { throw 'WSL setup requires this same Windows host to restart' }
          if ($setupCode -ne 0) { throw "WSL setup failed with $setupCode" }
          if (!$imported) {
            wsl.exe --import asagiri "$env:RUNNER_TEMP\load-distro" "$bundle\asagiri-linux.tar.gz" --version 2
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $imported = $true
          }
          $bridge = Start-Process $app -ArgumentList '--background','--distro','asagiri','--pipe','\\.\pipe\asagiri-load-test' -PassThru
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-load-test'
          Remove-Item Env:DOCKER_CONTEXT -ErrorAction SilentlyContinue
          function Invoke-Docker([string[]]$arguments) {
            & $docker @arguments
            if ($LASTEXITCODE) { throw "docker $($arguments[0]) failed: $LASTEXITCODE" }
          }
          try {
            $running = $null
            for ($i = 0; $i -lt 45; $i++) {
              $server = & $docker version --format '{{json .Server.Components}}' 2>$null
              if ($LASTEXITCODE -eq 0 -and $server) {
                $engine = ($server | ConvertFrom-Json) | Where-Object Name -eq 'Engine'
                $running = $engine.Details.AsagiriVersion
                if ($running -eq $version) { break }
              }
              if ($bridge.HasExited) { throw 'Windows bridge exited before readiness' }
              Start-Sleep -Seconds 2
            }
            if ($running -ne $version) { throw "Expected serving daemon $version, got $running" }
            Write-Host "Confirmed serving daemon $running through the Windows pipe"
            $installed = wsl.exe -d asagiri -u root -- asagiri --version
            if ($LASTEXITCODE -or ($installed -join ' ') -notmatch [regex]::Escape($version)) { throw "Expected $version, found $installed" }
            Write-Host "Engine binary in persistent WSL installation: $installed"
            Invoke-Docker @('pull','alpine:3.21')
            $context = New-Item -ItemType Directory 'build-context'
            [IO.File]::WriteAllText((Join-Path $context.FullName 'marker'), 'windows-wsl-buildx')
            $proof = Join-Path $env:RUNNER_TEMP 'proof.txt'
            $iid = Join-Path $env:RUNNER_TEMP 'iid'
            Set-Content -LiteralPath $proof -Value 'session-secret-100' -NoNewline
            @'
          FROM alpine:3.21
          COPY marker /marker
          RUN --mount=type=secret,id=proof sha256sum /run/secrets/proof | cut -d' ' -f1 > /proof.digest
          '@ | Set-Content "$context/Dockerfile"
            $buildx = Join-Path $bundle 'bin/cli-plugins/docker-buildx.exe'
            if ((Get-FileHash $buildx).Hash.ToLower() -ne '25074619db2b6dcc9e9dbd07f09841528796470e11993fd279af6922cd388d1a') { throw 'Installed Buildx digest mismatch' }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $bundle 'setup-tools.ps1') -Bundle $bundle -Pipe $env:DOCKER_HOST
            if ($LASTEXITCODE) { throw 'Installed CLI setup failed' }
            $plugins = Invoke-Docker @('info','--format','{{json .ClientInfo.Plugins}}') | ConvertFrom-Json
            $selected = @($plugins | Where-Object Name -eq 'buildx')
            if ($selected.Count -ne 1 -or [IO.Path]::GetFullPath($selected[0].Path) -ne [IO.Path]::GetFullPath($buildx)) { throw 'Docker CLI did not select the installed plugin' }
            & $docker buildx build --builder default --progress plain --load --secret "id=proof,src=$proof" --iidfile $iid -t ak100:test $context.FullName
            if ($LASTEXITCODE) { throw 'Installed candidate Buildx build over the named pipe failed' }
            $actual = Invoke-Docker @('image','inspect','ak100:test','--format','{{.Id}}')
            if ($actual -ne (Get-Content $iid -Raw).Trim()) { throw "Loaded image ID mismatch: $actual" }
            $digest = (Get-FileHash $proof).Hash.ToLower()
            $result = Invoke-Docker @('run','--rm','--network','none','ak100:test','sh','-ec','test "$(cat /marker)" = windows-wsl-buildx && test ! -e /run/secrets/proof && cat /proof.digest')
            if ($result -ne $digest) { throw 'Session secret digest mismatch' }
            @'
          FROM alpine:3.21
          RUN grep -E '^[0-9.]+[[:space:]]+probe[.]host' /etc/hosts
          '@ | Set-Content "$context/Gatewayfile"
            Invoke-Docker @('buildx','build','--builder','default','--add-host','probe.host:host-gateway','-f',"$context/Gatewayfile",$context.FullName)
            $env:DOCKER_BUILDKIT = '0'
            try {
              Invoke-Docker @('build','--no-cache','--add-host','probe.host:host-gateway','-f',"$context/Gatewayfile",'-t','ak100:classic',$context.FullName)
              Invoke-Docker @('run','--rm','--network','none','ak100:classic','true')
            } finally { Remove-Item Env:DOCKER_BUILDKIT }
            Write-Host "PASS context, build secret, direct image load and runtime for $actual"
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force }
            wsl.exe --terminate asagiri
          }
