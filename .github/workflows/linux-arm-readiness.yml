name: Published Linux engine Watchtower image check
on:
  push:
    branches: [qualification/watchtower-134]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  immediate-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check nginx registry metadata with the API and Watchtower
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          work=$(mktemp -d)
          archive=asagiri-0.1.14-dev.159-linux-x86_64.tar.gz
          gh release download v0.1.14-dev.159 --pattern "$archive" --dir "$work"
          (cd "$work" && echo "77e6972afb66005bd33692f379f9b3dd42f13095cbab469130a7bfad805f9165  $archive" | sha256sum -c - && tar xzf "$archive")
          sudo systemctl stop docker.socket docker.service
          sock="$work/asagiri.sock"
          sudo env PATH="$work:$PATH" HOME="$work" ASAGIRI_SOCKET="$sock" ASAGIRI_DATA_DIR="$work/data" "$work/asagiri" daemon >"$work/engine.log" 2>&1 &
          trap 'tail -40 "$work/engine.log"' EXIT
          for i in {1..50}; do if sudo docker -H "unix://$sock" info >/dev/null 2>&1; then break; fi; sleep 1; done
          export DOCKER_HOST="unix://$sock"
          sudo chmod 660 "$sock"
          sudo chown "$(id -u):$(id -g)" "$sock"
          cd "$work"
          docker pull oven/bun:1-alpine
          docker run -d --name probe nginx:alpine
          curl --fail --silent --show-error --unix-socket "$sock" http://localhost/v1.47/distribution/library/nginx:alpine/json > dist.json
          jq -e '.Descriptor.digest | test("^sha256:[a-f0-9]{64}$")' dist.json
          jq '{digest:.Descriptor.digest,platforms:(.Platforms|length)}' dist.json
          docker pull containrrr/watchtower:1.7.1
          docker run --rm --network host -e DOCKER_API_VERSION=1.47 -v "$sock:/var/run/docker.sock" containrrr/watchtower:1.7.1 --run-once --monitor-only --debug probe 2>&1 | tee watchtower.log
          grep -E 'Scanned=1|scanned=1' watchtower.log
          grep -E 'Failed=0|failed=0' watchtower.log
          if grep -Ei 'falling back to (a )?(regular |full )?pull|Digest retrieval failed' watchtower.log; then exit 1; fi
