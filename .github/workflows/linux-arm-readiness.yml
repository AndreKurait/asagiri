name: Published Ubuntu 22.04 desktop package
on:
  push:
    branches: [qualification/ubuntu-jammy-desktop-133]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  install-and-open:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Install the desktop package and observe its GTK window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat /etc/os-release
          getconf GNU_LIBC_VERSION
          cd "$RUNNER_TEMP"
          pkg=asagiri_0.1.14.dev.159_amd64.deb
          gh release download v0.1.14-dev.159 -R AndreKurait/asagiri --pattern "$pkg"
          echo "2b65f3c4e33233a5ec4c23c50b525758b235cdc2ea7a1b3292b312530794b770  $pkg" | sha256sum -c -
          dpkg-deb -f "$pkg" Package Version Depends
          sudo apt-get update -qq
          sudo apt-get install -y "./$pkg" xdotool xvfb dbus-x11
          dpkg-query -W asagiri
          asagiri --version
          xvfb-run -a dbus-run-session -- bash -ec '
            asagiri ui > "$RUNNER_TEMP/asagiri-ui.log" 2>&1 & pid=$!
            trap '\''kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/asagiri-ui.log"'\'' EXIT
            window=$(timeout 60 xdotool search --sync --onlyvisible --pid "$pid" --name "Asagiri" | head -1)
            test -n "$window"
            xdotool getwindowname "$window"
            xdotool getwindowgeometry "$window"
          '
