name: Published Ubuntu 22.04 desktop package
on:
  push:
    branches: [qualification/jammy-release-script-133]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  install-and-open:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6daf3024ad9e08cffaa8c1b322e1f3fa49faef6e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the desktop package and observe its GTK window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat /etc/os-release
          getconf GNU_LIBC_VERSION
          cd "$RUNNER_TEMP"
          pkg=asagiri_0.1.14.dev.159_amd64.deb
          gh release download v0.1.14-dev.159 -R AndreKurait/asagiri --pattern "$pkg"
          echo "2b65f3c4e33233a5ec4c23c50b525758b235cdc2ea7a1b3292b312530794b770  $pkg" | sha256sum -c -
          mkdir packages
          mv "$pkg" 'packages/asagiri_0.1.14~dev.159_amd64.deb'
          cd "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin b7d3c36c8783e241da109d069664cccb4ca15c1d
          git show FETCH_HEAD:scripts/ci/jammy-desktop.sh > "$RUNNER_TEMP/jammy-desktop.sh"
          python3 scripts/ci/release.py stamp 0.1.14-dev.159
          export RUSTUP_TOOLCHAIN=1.99.1
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          bash "$RUNNER_TEMP/jammy-desktop.sh" "$RUNNER_TEMP/packages" 0.1.14-dev.159
          deb="$RUNNER_TEMP/packages/asagiri_0.1.14~dev.159_amd64.deb"
          dpkg-deb -f "$deb" Package Version
          dpkg-deb -x "$deb" "$RUNNER_TEMP/final-package"
          cmp /usr/lib/asagiri/asagiri-window "$RUNNER_TEMP/final-package/usr/lib/asagiri/asagiri-window"
