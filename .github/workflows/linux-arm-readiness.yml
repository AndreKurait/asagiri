name: Published Linux engine Watchtower image check
on:
  push:
    branches: [qualification/arcane-134]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  immediate-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the nginx image through Arcane 3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          work=$(mktemp -d)
          archive=asagiri-0.1.14-dev.159-linux-x86_64.tar.gz
          gh release download v0.1.14-dev.159 --pattern "$archive" --dir "$work"
          (cd "$work" && echo "77e6972afb66005bd33692f379f9b3dd42f13095cbab469130a7bfad805f9165  $archive" | sha256sum -c - && tar xzf "$archive")
          sudo systemctl stop docker.socket docker.service
          sock="$work/asagiri.sock"
          sudo env PATH="$work:$PATH" HOME="$work" ASAGIRI_SOCKET="$sock" ASAGIRI_DATA_DIR="$work/data" "$work/asagiri" daemon >"$work/engine.log" 2>&1 &
          trap 'tail -40 "$work/engine.log"' EXIT
          for i in {1..50}; do if sudo docker -H "unix://$sock" info >/dev/null 2>&1; then break; fi; sleep 1; done
          export DOCKER_HOST="unix://$sock"
          sudo chmod 660 "$sock"
          sudo chown "$(id -u):$(id -g)" "$sock"
          cd "$work"
          docker run -d --name probe nginx:alpine
          image=ghcr.io/getarcaneapp/arcane:3.0.0
          key="arc_$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          # Run the UI on the runner's Docker daemon with only Asagiri as its target engine.
          sudo systemctl start docker
          reference=(sudo docker -H unix:///var/run/docker.sock)
          "${reference[@]}" run -d --name arcane -p 127.0.0.1:3552:3552 -e PUID=0 -e PGID=0 -e ARCANE_ADMIN_STATIC_API_KEY="$key" -v "$sock:/var/run/docker.sock" "$image"
          trap '"${reference[@]}" logs --tail 80 arcane; tail -30 "$work/engine.log"' EXIT
          for i in {1..90}; do if curl -fsS http://127.0.0.1:3552/health >/dev/null; then break; fi; sleep 1; done
          curl --fail-with-body -sS -H "X-Api-Key: $key" 'http://127.0.0.1:3552/api/agents/0/images/updates/check?imageRef=nginx%3Aalpine' | tee result.json
          jq -e '.success and ([.data | .. | objects | select(.latestDigest? | type == "string") | select(.latestDigest == .currentDigest and (.error // "") == "")] | length > 0)' result.json
