name: Shared-network DNS ordering on Ubuntu
on:
  push:
    branches: [qualification/shared-network-alias-154]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  immediate-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare shared-network alias resolution on Docker and released Asagiri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          work=$(mktemp -d)
          archive=asagiri-0.1.14-dev.159-linux-x86_64.tar.gz
          gh release download v0.1.14-dev.159 --pattern "$archive" --dir "$work"
          (cd "$work" && echo "77e6972afb66005bd33692f379f9b3dd42f13095cbab469130a7bfad805f9165  $archive" | sha256sum -c - && tar xzf "$archive")
          docker -H unix:///var/run/docker.sock info --format 'Reference Docker {{.ServerVersion}}'
          sudo iptables -S DOCKER-USER
          sock="$work/asagiri.sock"
          sudo env PATH="$work:$PATH" HOME="$work" ASAGIRI_SOCKET="$sock" ASAGIRI_DATA_DIR=/test-store "$work/asagiri" daemon >"$work/engine.log" 2>&1 &
          trap 'tail -40 "$work/engine.log"' EXIT
          for i in {1..50}; do if sudo docker -H "unix://$sock" info >/dev/null 2>&1; then break; fi; sleep 1; done
          export DOCKER_HOST="unix://$sock"
          sudo chmod 660 "$sock"
          sudo chown "$(id -u):$(id -g)" "$sock"
          image=alpine:3.22
          ref=/var/run/docker.sock
          docker -H "unix://$ref" pull "$image"
          docker pull "$image"
          failed=0
          python3 tests/network-dns-order.py "$ref" "$image" --reference-docker --output "$RUNNER_TEMP/docker-order.json" || failed=1
          ASAGIRI_TEST_ENGINE=1 ASAGIRI_DATA_DIR=/test-store python3 tests/network-dns-order.py "$sock" "$image" --output "$RUNNER_TEMP/asagiri-order.json" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dns-network-order
          path: ${{ runner.temp }}/*-order.json
