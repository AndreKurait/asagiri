name: Docker ARM64 archive upload after idle
on:
  push:
    branches: [qualification/docker-archive-146]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  immediate-exec:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Exercise archive uploads on the disposable Docker reference engine
        run: |
          set -euo pipefail
          base=$(mktemp -d)
          docker=docker
          ASAGIRI_SOCKET=/var/run/docker.sock
          docker version
          "$docker" pull localstack/localstack:4.7
          # Start the first workload after a full three-minute idle interval, as reported.
          sleep 181
          for trial in 1 2 3; do
            name="archive146-$trial"
            token="$(cat /proc/sys/kernel/random/uuid)"
            mkdir -p "$base/payload"
            printf '%s' "$token" > "$base/payload/marker.txt"
            tar -C "$base/payload" -cf "$base/marker.tar" marker.txt
            cleanup() {
              "$docker" rm -f "$name" >/dev/null 2>&1 || true
              "$docker" volume rm "$name-data" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            "$docker" volume create "$name-data" >/dev/null
            "$docker" create --name "$name" -v "$name-data:/usr/bin" --entrypoint /bin/sh localstack/localstack:4.7 -c 'while [ ! -f /marker.txt ]; do sleep 0.1; done; cat /marker.txt; echo; sleep 60' >/dev/null
            curl --unix-socket "$ASAGIRI_SOCKET" -fsS -X POST "http://localhost/v1.47/containers/$name/start" -o /dev/null
            status=$(curl --unix-socket "$ASAGIRI_SOCKET" -sS -w '%{http_code}' -T "$base/marker.tar" "http://localhost/v1.47/containers/$name/archive?path=/" -o "$base/upload.out")
            echo "trial=$trial upload HTTP=$status"
            test "$status" = 200
            visible=$("$docker" exec "$name" cat /marker.txt)
            test "$visible" = "$token"
            echo "PASS exec observed exact archive bytes"
            for i in {1..40}; do [ "$("$docker" logs "$name")" = "$token" ] && break; sleep .25; done
            "$docker" inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}}' "$name"
            "$docker" logs "$name"
            test "$("$docker" logs "$name")" = "$token"
            test "$("$docker" exec "$name" cat /marker.txt)" = "$token"
            "$docker" rm -f "$name" && "$docker" volume rm "$name-data"
            trap - EXIT
            echo "PASS trial=$trial HTTP=$status exact marker seen by entrypoint and exec"
          done
