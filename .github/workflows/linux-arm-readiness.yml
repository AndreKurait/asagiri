name: Published Ubuntu 22.04 desktop package
on:
  push:
    branches: [qualification/ubuntu-jammy-desktop-133]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  install-and-open:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6daf3024ad9e08cffaa8c1b322e1f3fa49faef6e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the desktop package and observe its GTK window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat /etc/os-release
          getconf GNU_LIBC_VERSION
          cd "$RUNNER_TEMP"
          pkg=asagiri_0.1.14.dev.159_amd64.deb
          gh release download v0.1.14-dev.159 -R AndreKurait/asagiri --pattern "$pkg"
          echo "2b65f3c4e33233a5ec4c23c50b525758b235cdc2ea7a1b3292b312530794b770  $pkg" | sha256sum -c -
          dpkg-deb -f "$pkg" Package Version Depends
          sudo apt-get update -qq
          sudo apt-get install -y xdotool xvfb dbus-x11 libgtk-3-dev libwebkit2gtk-4.1-dev
          dpkg-deb -x "$pkg" published
          mkdir native cli
          cp published/usr/bin/asagiri{,-init} native/
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > native/SOURCE_COMMIT
          cp published/usr/libexec/asagiri/bin/docker published/usr/libexec/asagiri/cli-plugins/docker-* cli/
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --release -p asagiri --features window
          bash packaging/linux/build.sh "$RUNNER_TEMP/native" "$RUNNER_TEMP/packages" x86_64 "$RUNNER_TEMP/cli" "$PWD/target/release/asagiri"
          sudo apt-get install -y "$RUNNER_TEMP"/packages/asagiri_*.deb
          test -x /usr/lib/asagiri/asagiri-window
          dpkg-query -W asagiri
          asagiri --version
          xvfb-run -a dbus-run-session -- bash -ec '
            asagiri ui > "$RUNNER_TEMP/asagiri-ui.log" 2>&1 & pid=$!
            trap '\''kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/asagiri-ui.log"'\'' EXIT
            window=$(timeout 60 xdotool search --sync --onlyvisible --pid "$pid" --name "Asagiri" | head -1)
            test -n "$window"
            xdotool getwindowname "$window"
            xdotool getwindowgeometry "$window"
          '
