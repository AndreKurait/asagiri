name: Published Ubuntu x86 Compose Bun build
on:
  push:
    branches: [qualification/flisk-shop-154]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  immediate-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve the npm registry and build a digest-pinned Bun Compose service
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          work=$(mktemp -d)
          archive=asagiri-0.1.14-dev.159-linux-x86_64.tar.gz
          gh release download v0.1.14-dev.159 --pattern "$archive" --dir "$work"
          (cd "$work" && echo "77e6972afb66005bd33692f379f9b3dd42f13095cbab469130a7bfad805f9165  $archive" | sha256sum -c - && tar xzf "$archive")
          docker -H unix:///var/run/docker.sock info --format 'Reference Docker {{.ServerVersion}}'
          sudo iptables -S DOCKER-USER
          sock="$work/asagiri.sock"
          sudo env PATH="$work:$PATH" HOME="$work" ASAGIRI_SOCKET="$sock" ASAGIRI_DATA_DIR="$work/data" "$work/asagiri" daemon >"$work/engine.log" 2>&1 &
          trap 'tail -40 "$work/engine.log"' EXIT
          for i in {1..50}; do if sudo docker -H "unix://$sock" info >/dev/null 2>&1; then break; fi; sleep 1; done
          export DOCKER_HOST="unix://$sock"
          sudo chmod 660 "$sock"
          sudo chown "$(id -u):$(id -g)" "$sock"
          cd "$work"
          pinned=oven/bun:1-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
          test -n "$pinned"
          docker pull "$pinned"
          echo "Testing $pinned"
          failed=0
          probe() {
            local label=$1
            shift
            if timeout 120 "$@"; then echo "PASS $label"; else echo "FAIL $label exit=$?"; failed=1; fi
          }
          network_snapshot() {
            sudo iptables -w -t filter -nvL FORWARD
            sudo iptables -w -t filter -nvL DOCKER-USER
            sudo iptables -w -t nat -nvL POSTROUTING
            ip -4 route show
            sysctl net.ipv4.ip_forward
          }
          network_snapshot
          uplink=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="dev") {print $(i+1);exit}}')
          docker run --rm --network bridge "$pinned" true
          ip link show asagiri0
          test -n "$uplink"
          outbound=(-i asagiri0 -o "$uplink" -j ACCEPT)
          inbound=(-i "$uplink" -o asagiri0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT)
          sudo iptables -w -I DOCKER-USER 1 "${outbound[@]}"
          trap 'sudo iptables -w -D DOCKER-USER "${outbound[@]}"' EXIT
          sudo iptables -w -I DOCKER-USER 1 "${inbound[@]}"
          trap 'sudo iptables -w -D DOCKER-USER "${inbound[@]}"; sudo iptables -w -D DOCKER-USER "${outbound[@]}"; tail -40 "$work/engine.log"' EXIT
          git init -q shop-source
          git -C shop-source fetch -q --depth 1 https://github.com/flisk-sh/flisk.git 2e265d59de82828043365699ca78f29f7b83af36
          git -C shop-source checkout -q FETCH_HEAD
          export BENCH_SHOP="$PWD/shop-source/bench/shop" BENCH_PORT=18700 BENCH_PROJECT=asagiri-shop-test
          cd shop-source/bench/competitors/compose-kiri-plain
          export COMPOSE_BAKE=false COMPOSE_PARALLEL_LIMIT=1 BUILDX_NO_DEFAULT_ATTESTATIONS=1
          docker buildx create --name shop-host --driver docker-container --driver-opt network=host
          export BUILDX_BUILDER=shop-host
          docker compose up -d --build
          for endpoint in /health /health/storefront /health/admin /api/products/health /api/orders/health /api/payments/health /api/notifications/health; do
            curl --fail --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 "http://localhost:$BENCH_PORT$endpoint"
            echo "PASS $endpoint"
          done
          docker compose down -v --remove-orphans
