name: Published Ubuntu x86 Compose Bun build
on:
  push:
    branches: [qualification/linux-compose-coexist-154]
    paths: [.github/workflows/linux-arm-readiness.yml]
permissions:
  contents: read
jobs:
  immediate-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve the npm registry and build a digest-pinned Bun Compose service
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          work=$(mktemp -d)
          archive=asagiri-0.1.14-dev.159-linux-x86_64.tar.gz
          gh release download v0.1.14-dev.159 --pattern "$archive" --dir "$work"
          (cd "$work" && echo "77e6972afb66005bd33692f379f9b3dd42f13095cbab469130a7bfad805f9165  $archive" | sha256sum -c - && tar xzf "$archive")
          docker -H unix:///var/run/docker.sock info --format 'Reference Docker {{.ServerVersion}}'
          sudo iptables -S DOCKER-USER
          sock="$work/asagiri.sock"
          sudo env PATH="$work:$PATH" HOME="$work" ASAGIRI_SOCKET="$sock" ASAGIRI_DATA_DIR="$work/data" "$work/asagiri" daemon >"$work/engine.log" 2>&1 &
          trap 'tail -40 "$work/engine.log"' EXIT
          for i in {1..50}; do if sudo docker -H "unix://$sock" info >/dev/null 2>&1; then break; fi; sleep 1; done
          export DOCKER_HOST="unix://$sock"
          sudo chmod 660 "$sock"
          sudo chown "$(id -u):$(id -g)" "$sock"
          cd "$work"
          pinned=oven/bun:1-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
          test -n "$pinned"
          docker pull "$pinned"
          echo "Testing $pinned"
          failed=0
          probe() {
            local label=$1
            shift
            if timeout 120 "$@"; then echo "PASS $label"; else echo "FAIL $label exit=$?"; failed=1; fi
          }
          for network in bridge host; do
            probe "$network resolver" docker run --rm --network "$network" "$pinned" sh -c 'cat /etc/resolv.conf; nslookup registry.npmjs.org'
            probe "$network HTTPS" docker run --rm --network "$network" "$pinned" wget -S -O /dev/null --timeout=15 https://registry.npmjs.org/
          done
          mkdir project && cd project
          echo '{"dependencies":{"hono":"4.10.6"}}' > package.json
          printf 'FROM %s\nWORKDIR /app\nCOPY package.json .\nRUN bun install\nCMD ["bun", "-e", "console.log(require.resolve(\x27hono\x27))"]\n' "$pinned" > Dockerfile
          cat > compose.yaml <<'COMPOSE'
          services:
            app:
              build:
                context: .
                network: host
          COMPOSE
          if timeout 300 docker compose up --build --exit-code-from app; then
            echo 'PASS digest-pinned Compose build and Bun dependency load'
          else
            echo "FAIL Compose build or startup exit=$?"; failed=1
          fi
          probe 'host-network Bun dependency install' docker run --rm --network host -v "$PWD/package.json:/app/package.json:ro" -w /app "$pinned" bun install
          exit "$failed"
