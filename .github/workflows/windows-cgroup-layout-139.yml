name: Verify published Windows engine on the reported WSL 2.4.13 kernel
on:
  push:
    branches: [qualification/windows-wsl2413-139]
permissions:
  actions: read
  contents: read
jobs:
  terminal:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Install the reported Microsoft WSL release on this disposable runner
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'wsl.2.4.13.0.x64.msi'
          Invoke-WebRequest 'https://github.com/microsoft/WSL/releases/download/2.4.13/wsl.2.4.13.0.x64.msi' -OutFile $msi
          $signature = Get-AuthenticodeSignature $msi
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid Microsoft WSL signature' }
          Get-FileHash $msi
          wsl.exe --shutdown
          $installed = Get-ItemProperty 'HKLM:/SOFTWARE/Microsoft/Windows/CurrentVersion/Uninstall/*' | Where-Object { $_.DisplayName -eq 'Windows Subsystem for Linux' -and $_.WindowsInstaller -eq 1 }
          foreach ($entry in $installed) {
            $remove = Start-Process msiexec -ArgumentList "/x $($entry.PSChildName) /qn /norestart" -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "WSL uninstall exited $($remove.ExitCode)" }
          }
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WSL install exited $($install.ExitCode)" }
          $env:WSL_UTF8 = '1'
          $version = wsl.exe --version | Out-String
          Write-Host $version
          if ($version -notmatch '2\.4\.13\.0') { throw 'Reported WSL version was not installed' }
      - name: Inspect stock WSL mounts and start a container
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          cd $env:RUNNER_TEMP
          $tag = 'v0.1.14-dev.243'
          $asset = 'Asagiri-0.1.14-dev.243-windows-x86_64.zip'
          $ref = gh api "repos/AndreKurait/asagiri/git/ref/tags/$tag" | ConvertFrom-Json
          if ($ref.object.sha -ne '865088f2f78c52b7acd694e9c048b227a3449c43') { throw 'Release revision mismatch' }
          $release = gh release view $tag -R AndreKurait/asagiri --json assets | ConvertFrom-Json
          $digest = ($release.assets | Where-Object name -eq $asset).digest
          if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing release asset digest' }
          gh release download $tag -R AndreKurait/asagiri -p $asset
          if ($LASTEXITCODE -or "sha256:$((Get-FileHash $asset).Hash.ToLower())" -ne $digest) { throw 'Release archive verification failed' }
          Expand-Archive $asset bundle
          $env:PICKER_APP = (Get-ChildItem bundle -Recurse -Filter asagiri-win.exe).FullName
          wsl.exe --import Asagiri-cgroup139 "$env:RUNNER_TEMP\picker-distro" "$(Split-Path $env:PICKER_APP)\asagiri-linux.tar.gz" --version 2
          if ($LASTEXITCODE) { throw "WSL import" }
          wsl.exe --version
          $env:WSL_UTF8 = '1'
          $kernel = wsl.exe -d Asagiri-cgroup139 -- uname -r
          Write-Host "Actual kernel: $kernel"
          if ($kernel -notlike '5.15.167.4-microsoft-standard-WSL2*') { throw 'Actual kernel differs from the upstream report' }
          wsl.exe -d Asagiri-cgroup139 -- cat /proc/self/cgroup
          wsl.exe -d Asagiri-cgroup139 -- cat /proc/self/mountinfo | Select-String ' - cgroup2? '
          if ($LASTEXITCODE) { throw 'Reading mount topology failed' }
          wsl.exe --terminate Asagiri-cgroup139
          $env:DOCKER_HOST = 'npipe:////./pipe/asagiri-cgroup139'
          $docker = Join-Path (Split-Path $env:PICKER_APP) 'bin/docker.exe'
          $launcher = Start-Process $env:PICKER_APP -ArgumentList '--distro','Asagiri-cgroup139','--pipe','\\.\pipe\asagiri-cgroup139' -PassThru
          try {
            for ($i=0; $i -lt 90; $i++) {
              & $docker info 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 2
            }
            if ($LASTEXITCODE) { throw 'Engine startup failed' }
            $failure = & $docker pull alpine:3.21 2>&1 | Out-String
            Write-Host $failure
            if (!$LASTEXITCODE -or $failure -notlike '*hybrid hierarchy with v2 at /sys/fs/cgroup/unified*') { throw 'Missing actionable hybrid hierarchy diagnostic' }
            $config = Join-Path $env:USERPROFILE '.wslconfig'
            if (Test-Path $config) { throw 'Existing WSL settings require preservation' }
            "[wsl2]`nkernelCommandLine=cgroup_no_v1=all" | Set-Content -Encoding ascii $config
            Stop-Process -Id $launcher.Id
            wsl.exe --shutdown
            wsl.exe -d Asagiri-cgroup139 -- cat /proc/cmdline
            wsl.exe -d Asagiri-cgroup139 -- cat /sys/fs/cgroup/cgroup.controllers
            if ($LASTEXITCODE) { throw 'Unified hierarchy missing' }
            $launcher = Start-Process $env:PICKER_APP -ArgumentList '--distro','Asagiri-cgroup139','--pipe','\\.\pipe\asagiri-cgroup139' -PassThru
            for ($i=0; $i -lt 90; $i++) {
              & $docker info 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 2
            }
            & $docker pull alpine:3.21
            if ($LASTEXITCODE) { throw 'Unified hierarchy image pull failed' }
            & $docker run --rm alpine:3.21 true
            if ($LASTEXITCODE) { throw 'Container start failed' }
          } finally {
            if (!$launcher.HasExited) { Stop-Process -Id $launcher.Id }
          }
