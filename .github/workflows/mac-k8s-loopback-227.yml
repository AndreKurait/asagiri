name: Native Mac Kubernetes loopback ports
on:
  push:
    branches: [qualification/mac-k8s-loopback-227]
permissions:
  contents: read
jobs:
  service:
    runs-on: macos-26-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 87afda808e5fa2d3817f578691fcbdd2dbf1987f
          persist-credentials: false
      - name: Build merged revision and start its managed cluster
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          cargo build --locked -p asagiri --bin asagiri
          rustup target add x86_64-unknown-linux-musl
          cargo xtask guest --arch x86_64
          codesign --force --sign - --entitlements crates/asagiri/asagiri.entitlements target/debug/asagiri
          command -v kubectl || brew install kubectl
          bin="$PWD/target/debug/asagiri"
          scratch=$(mktemp -d /tmp/k8s227.XXXXXX)
          cd "$scratch"
          asset=Asagiri-0.1.14-dev.205-x86_64.tar.gz
          gh release download v0.1.14-dev.205 -R AndreKurait/asagiri -p "$asset"
          echo "ce251930f568a1f302dbf0534015591c7374db549170d22f8fd0402249cdaece  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          cp "$GITHUB_WORKSPACE/guest/out/x86_64/initramfs.cpio" Asagiri.app/Contents/Resources/guest/initramfs.cpio
          command -v skopeo || brew install skopeo
          skopeo --override-os linux --override-arch amd64 copy --retry-times 3 docker://docker.io/library/nginx:alpine "docker-archive:$scratch/nginx.tar:docker.io/library/nginx:alpine"
          skopeo --override-os linux --override-arch amd64 copy --retry-times 3 docker://docker.io/rancher/mirrored-pause:3.10.2 "docker-archive:$scratch/pause.tar:docker.io/rancher/mirrored-pause:3.10.2"
          skopeo --override-os linux --override-arch amd64 copy --retry-times 3 docker://docker.io/rancher/klipper-lb:v0.4.17 "docker-archive:$scratch/klipper-lb.tar:docker.io/rancher/klipper-lb:v0.4.17"
          export HOME="$scratch/home" ASAGIRI_DATA_DIR="$scratch/store" ASAGIRI_SOCKET="$scratch/docker.sock" ASAGIRI_GUEST_DIR="$scratch/Asagiri.app/Contents/Resources/guest"
          export DOCKER_HOST="unix://$ASAGIRI_SOCKET" PATH="$scratch/Asagiri.app/Contents/Resources/bin:$PATH"
          mkdir -p "$HOME/.kube"
          "$bin" daemon > "$scratch/daemon.log" 2>&1 &
          daemon=$!
          trap 'tail -60 "$scratch/daemon.log"; kill "$daemon" || true' EXIT
          for i in {1..60}; do docker version >/dev/null 2>&1 && break; sleep 1; done
          "$bin" k8s start --use
          docker exec asagiri-k8s mkdir -p /var/lib/rancher/k3s/agent/images
          docker cp "$scratch/nginx.tar" asagiri-k8s:/var/lib/rancher/k3s/agent/nginx-staged.tar
          docker exec asagiri-k8s mv /var/lib/rancher/k3s/agent/nginx-staged.tar /var/lib/rancher/k3s/agent/images/nginx.tar
          docker cp "$scratch/pause.tar" asagiri-k8s:/var/lib/rancher/k3s/agent/pause-staged.tar
          docker cp "$scratch/klipper-lb.tar" asagiri-k8s:/var/lib/rancher/k3s/agent/klipper-lb-staged.tar
          docker exec asagiri-k8s mv /var/lib/rancher/k3s/agent/pause-staged.tar /var/lib/rancher/k3s/agent/images/pause.tar
          docker exec asagiri-k8s mv /var/lib/rancher/k3s/agent/klipper-lb-staged.tar /var/lib/rancher/k3s/agent/images/klipper-lb.tar
          kubectl create deployment loopback-check --image=nginx:alpine
          if ! kubectl rollout status deployment/loopback-check --timeout=4m; then
            kubectl describe pods -l app=loopback-check
            kubectl get events -A --sort-by=.metadata.creationTimestamp
            exit 1
          fi
          kubectl expose deployment loopback-check --type=LoadBalancer --port=444 --target-port=80
          for i in {1..30}; do grep -F '127.0.0.1:444/tcp' "$scratch/daemon.log" | grep -F 'macOS denied the low localhost port' && break; sleep 2; done
          grep -F '127.0.0.1:444/tcp' "$scratch/daemon.log" | grep -F 'macOS denied the low localhost port'
          kubectl patch service loopback-check --type=json -p='[{"op":"replace","path":"/spec/ports/0/port","value":8444}]'
          kubectl get service loopback-check -o wide
          kubectl get endpointslices -l kubernetes.io/service-name=loopback-check -o wide
          if ! curl --noproxy '*' --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 --max-time 5 -fsS -o "$scratch/response.html" http://127.0.0.1:8444/; then
            kubectl -n kube-system get daemonsets,pods -o wide
            kubectl -n kube-system get events --sort-by=.lastTimestamp | tail -60
            exit 1
          fi
          grep -F 'Welcome to nginx' "$scratch/response.html"
          lsof -nP -a -p "$daemon" -iTCP:8444 -sTCP:LISTEN | grep -F '127.0.0.1:8444'
