name: Dev.223 Intel macOS Compose with public and local Alpine tags
on:
  push:
    branches: [qualification/intel-compose-dev223-168]
permissions:
  contents: read
  actions: read
jobs:
  compose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x86_64
            compose: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the published app with public registry resolution
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          COMPOSE_ARCH: ${{ matrix.compose }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d /private/tmp/compose168.XXXXXX)"
          test "$(uname -m)" = "$ARCH"
          asset="Asagiri-0.1.14-dev.223-$ARCH.tar.gz"
          gh run download 45223543628 -R AndreKurait/asagiri -n packages-macos-x86_64 -D package
          mv "package/$asset" "$asset"
          shasum -a 256 "$asset"
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          gh release download v5.7.1 -R docker/compose -p "docker-compose-darwin-$COMPOSE_ARCH"
          export HOME="$PWD/home" ASAGIRI_DATA_DIR="$PWD/engine-data" ASAGIRI_SOCKET="$PWD/docker.sock" DOCKER_HOST="unix://$PWD/docker.sock" PATH="$PWD/Asagiri.app/Contents/Resources/bin:$PATH"
          mkdir "$HOME"
          Asagiri.app/Contents/MacOS/asagiri daemon >engine.log 2>&1 &
          daemon=$!
          trap 'kill "$daemon" || true; tail -35 engine.log' EXIT
          for _ in {1..60}; do docker version >/dev/null 2>&1 && break; sleep 0.5; done
          pull_ready=false
          for attempt in 1 2 3; do
            if docker pull alpine:3.21; then pull_ready=true; break; fi
            echo "Initial Alpine pull failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$pull_ready" != true ]; then
            find "$HOME" "$ASAGIRI_DATA_DIR" -type f -name 'guest-console.log' -exec tail -n 100 {} \;
            exit 1
          fi
          compose_rc=0
          python3 "$GITHUB_WORKSPACE/tests/qualification-168/compose-health.py" "$ASAGIRI_SOCKET" alpine:3.21 --compose-plugin "docker-compose-darwin-$COMPOSE_ARCH" --output "$RUNNER_TEMP/compose-result.json" || compose_rc=$?
          docker logs buildx_buildkit_asagiri-build0 >"$RUNNER_TEMP/buildkit.log" 2>&1 || true
          docker tag alpine:3.21 local-compose-proof:3.21
          control_rc=0
          python3 "$GITHUB_WORKSPACE/tests/qualification-168/compose-health.py" "$ASAGIRI_SOCKET" local-compose-proof:3.21 --compose-plugin "docker-compose-darwin-$COMPOSE_ARCH" --output "$RUNNER_TEMP/compose-local-tag-control.json" || control_rc=$?
          # Observe origin access in the actual builder, after Compose has used it.
          docker exec buildx_buildkit_asagiri-build0 sh -c '
            for host in registry-1.docker.io auth.docker.io; do
              nslookup "$host" || true
            done
            wget -S -T 8 -O /dev/null https://registry-1.docker.io/v2/ 2>&1 || true
            wget -S -T 8 -O /dev/null "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/alpine:pull" 2>&1 || true
          ' || true
          token_file="$HOME/.asagiri/build-mirror-token"
          test -s "$token_file"
          port=$(sed -n 's/.*image mirror for builds port=\([0-9]*\).*/\1/p' engine.log | head -1)
          if test -f "$token_file" && test -n "$port"; then
            mirror_path="/v2/$(cat "$token_file")/docker.io/library/alpine/manifests/3.21"
            curl --silent --output /dev/null --max-time 8 --write-out 'Mac mirror manifest HTTP %{http_code}\n' "http://127.0.0.1:$port$mirror_path" || true
            docker run --rm alpine:3.21 sh -c 'case "$(wget -q -T 8 -O - "$1" 2>/dev/null | wc -c)" in *[1-9]*) echo "guest mirror returned a manifest";; *) echo "guest mirror returned no manifest";; esac' sh "http://198.19.248.254:$port$mirror_path"
          fi
          if test "$compose_rc" -ne 0; then
            builder=buildx_buildkit_asagiri-build0
            docker exec "$builder" cat /etc/resolv.conf
            for resolver in $(scutil --dns | awk '/nameserver\[[0-9]+\] : [0-9.]+$/ {if (!seen[$3]++) print $3}'); do
              if docker exec "$builder" nslookup registry-1.docker.io "$resolver" && docker exec "$builder" nslookup auth.docker.io "$resolver"; then
                docker exec "$builder" sh -ec 'printf "nameserver %s\n" "$1" > /etc/resolv.conf; nslookup registry-1.docker.io; nslookup auth.docker.io' sh "$resolver"
                python3 "$GITHUB_WORKSPACE/tests/qualification-168/compose-health.py" "$ASAGIRI_SOCKET" alpine:3.21 --compose-plugin "docker-compose-darwin-$COMPOSE_ARCH" --output "$RUNNER_TEMP/compose-dns-control.json"
                break
              fi
            done
          fi
          if test "$compose_rc" -ne 0; then exit "$compose_rc"; fi
          exit "$control_rc"
      - name: Compare guest startup with published dev.205 on the same runner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          work=$(mktemp -d /private/tmp/boot168.XXXXXX)
          cd "$work"
          mkdir old candidate
          asset=Asagiri-0.1.14-dev.205-x86_64.tar.gz
          gh release download v0.1.14-dev.205 -R AndreKurait/asagiri -p "$asset"
          echo "ce251930f568a1f302dbf0534015591c7374db549170d22f8fd0402249cdaece  $asset" | shasum -a 256 -c -
          tar xzf "$asset" -C old
          gh run download 45223543628 -R AndreKurait/asagiri -n packages-macos-x86_64 -D package
          tar xzf package/Asagiri-0.1.14-dev.223-x86_64.tar.gz -C candidate
          sysctl kern.hv_support hw.memsize hw.ncpu
          for app in old candidate; do
            mkdir "$work/$app/home"
            (
              export HOME="$work/$app/home" ASAGIRI_DATA_DIR="$work/$app/store" ASAGIRI_SOCKET="$work/$app/docker.sock"
              export DOCKER_HOST="unix://$ASAGIRI_SOCKET"
              bin="$work/$app/Asagiri.app/Contents/MacOS/asagiri"
              cli="$work/$app/Asagiri.app/Contents/Resources/bin/docker"
              "$bin" --version
              "$bin" daemon >"$app/engine.log" 2>&1 &
              daemon=$!
              trap 'kill "$daemon" || true; wait "$daemon" || true' EXIT
              for i in {1..60}; do "$cli" version >/dev/null 2>&1 && break; sleep 1; done
              result=0
              "$cli" run --rm alpine:3.21 echo booted || result=$?
              echo "$app workload exit=$result"
              tail -20 "$app/engine.log"
            )
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intel-compose-health
          path: |
            ${{ runner.temp }}/buildkit.log
            ${{ runner.temp }}/compose-result.json
            ${{ runner.temp }}/compose-dns-control.json
            ${{ runner.temp }}/compose-local-tag-control.json
          if-no-files-found: warn
