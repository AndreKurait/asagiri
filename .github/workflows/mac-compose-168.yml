name: Published macOS Compose with public Alpine
on:
  push:
    branches: [qualification/mac-compose-168]
permissions:
  contents: read
jobs:
  compose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x86_64
            compose: x86_64
            hash: 9342f8db347380c5d0971a518d5169f9233fd24f218f6b81d070a5cf51c448f2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the published app with public registry resolution
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          COMPOSE_ARCH: ${{ matrix.compose }}
          HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d /private/tmp/compose168.XXXXXX)"
          test "$(uname -m)" = "$ARCH"
          asset="Asagiri-0.1.14-dev.188-$ARCH.tar.gz"
          gh release download v0.1.14-dev.188 -R AndreKurait/asagiri -p "$asset"
          echo "$HASH  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          gh release download v5.7.1 -R docker/compose -p "docker-compose-darwin-$COMPOSE_ARCH"
          export HOME="$PWD/home" ASAGIRI_DATA_DIR="$PWD/engine-data" ASAGIRI_SOCKET="$PWD/docker.sock" DOCKER_HOST="unix://$PWD/docker.sock" PATH="$PWD/Asagiri.app/Contents/Resources/bin:$PATH"
          mkdir "$HOME"
          Asagiri.app/Contents/MacOS/asagiri daemon >engine.log 2>&1 &
          daemon=$!
          trap 'kill "$daemon" || true; tail -35 engine.log' EXIT
          for i in {1..60}; do docker version >/dev/null 2>&1 && break; sleep 0.5; done
          docker pull alpine:3.21
          python3 "$GITHUB_WORKSPACE/tests/qualification-168/compose-health.py" "$ASAGIRI_SOCKET" alpine:3.21 --compose-plugin "docker-compose-darwin-$COMPOSE_ARCH" --output "$RUNNER_TEMP/compose-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intel-compose-health
          path: ${{ runner.temp }}/compose-result.json
          if-no-files-found: warn
