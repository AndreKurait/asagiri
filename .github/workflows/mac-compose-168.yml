name: Published macOS Compose with public Alpine
on:
  push:
    branches: [qualification/mac-compose-168]
permissions:
  contents: read
jobs:
  compose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x86_64
            compose: x86_64
            hash: 9342f8db347380c5d0971a518d5169f9233fd24f218f6b81d070a5cf51c448f2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the published app with public registry resolution
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          COMPOSE_ARCH: ${{ matrix.compose }}
          HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d /private/tmp/compose168.XXXXXX)"
          test "$(uname -m)" = "$ARCH"
          asset="Asagiri-0.1.14-dev.188-$ARCH.tar.gz"
          gh release download v0.1.14-dev.188 -R AndreKurait/asagiri -p "$asset"
          echo "$HASH  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          gh release download v5.7.1 -R docker/compose -p "docker-compose-darwin-$COMPOSE_ARCH"
          export HOME="$PWD/home" ASAGIRI_DATA_DIR="$PWD/engine-data" ASAGIRI_SOCKET="$PWD/docker.sock" DOCKER_HOST="unix://$PWD/docker.sock" PATH="$PWD/Asagiri.app/Contents/Resources/bin:$PATH"
          mkdir "$HOME"
          Asagiri.app/Contents/MacOS/asagiri daemon >engine.log 2>&1 &
          daemon=$!
          trap 'kill "$daemon" || true; tail -35 engine.log' EXIT
          for _ in {1..60}; do docker version >/dev/null 2>&1 && break; sleep 0.5; done
          if ! docker pull alpine:3.21; then
            find "$HOME" "$ASAGIRI_DATA_DIR" -type f -name 'guest-console.log' -exec tail -n 100 {} \;
            exit 1
          fi
          compose_rc=0
          python3 "$GITHUB_WORKSPACE/tests/qualification-168/compose-health.py" "$ASAGIRI_SOCKET" alpine:3.21 --compose-plugin "docker-compose-darwin-$COMPOSE_ARCH" --output "$RUNNER_TEMP/compose-result.json" || compose_rc=$?
          # Observe origin access in the actual builder, after Compose has used it.
          docker exec buildx_buildkit_asagiri-build0 sh -c '
            for host in registry-1.docker.io auth.docker.io; do
              nslookup "$host" || true
            done
            wget -S -T 8 -O /dev/null https://registry-1.docker.io/v2/ 2>&1 || true
            wget -S -T 8 -O /dev/null "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/alpine:pull" 2>&1 || true
          ' || true
          token_file="$HOME/.asagiri/build-mirror-token"
          test -s "$token_file"
          port=$(sed -n 's/.*image mirror for builds port=\([0-9]*\).*/\1/p' engine.log | head -1)
          if test -f "$token_file" && test -n "$port"; then
            mirror_path="/v2/$(cat "$token_file")/docker.io/library/alpine/manifests/3.21"
            curl --silent --output /dev/null --max-time 8 --write-out 'Mac mirror manifest HTTP %{http_code}\n' "http://127.0.0.1:$port$mirror_path" || true
            docker run --rm alpine:3.21 sh -c 'case "$(wget -q -T 8 -O - "$1" 2>/dev/null | wc -c)" in *[1-9]*) echo "guest mirror returned a manifest";; *) echo "guest mirror returned no manifest";; esac' sh "http://198.19.248.254:$port$mirror_path"
          fi
          if test "$compose_rc" -ne 0; then
            builder=buildx_buildkit_asagiri-build0
            docker exec "$builder" cat /etc/resolv.conf
            for resolver in $(scutil --dns | awk '/nameserver\[[0-9]+\] : [0-9.]+$/ {if (!seen[$3]++) print $3}'); do
              if docker exec "$builder" nslookup registry-1.docker.io "$resolver" && docker exec "$builder" nslookup auth.docker.io "$resolver"; then
                docker exec "$builder" sh -ec 'printf "nameserver %s\n" "$1" > /etc/resolv.conf; nslookup registry-1.docker.io; nslookup auth.docker.io' sh "$resolver"
                python3 "$GITHUB_WORKSPACE/tests/qualification-168/compose-health.py" "$ASAGIRI_SOCKET" alpine:3.21 --compose-plugin "docker-compose-darwin-$COMPOSE_ARCH" --output "$RUNNER_TEMP/compose-dns-control.json"
                break
              fi
            done
          fi
          exit "$compose_rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intel-compose-health
          path: |
            ${{ runner.temp }}/compose-result.json
            ${{ runner.temp }}/compose-dns-control.json
          if-no-files-found: warn
