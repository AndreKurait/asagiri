# Builds and unit-tests the engine on Linux, macOS and Windows, and keeps
# each platform's binary as a workflow artifact. The binaries are unsigned
# development builds, not a release.

name: Platform builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build
        run: |
          # A static build, as `cargo xtask linux` makes it. The agent's
          # tests make device nodes and namespaces, so the container is privileged.
          mkdir -p "$RUNNER_TEMP/bin"
          docker run --rm --privileged --tmpfs /tmp -v "$PWD:/src" -v "$RUNNER_TEMP/bin:/out" -w /src -e CARGO_TARGET_DIR=/t rust:1-alpine sh -c \
            'apk add -q build-base && cargo test --locked -p kiri -p kiri-init -p kiri-proto -p kiri-image && cargo build --release --locked -p kiri -p kiri-init && cp /t/release/kiri /t/release/kiri-init /out/'
          ls -l "$RUNNER_TEMP/bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: rustup update stable --no-self-update && cargo test --locked
      - name: Build
        run: cargo build --release --locked -p kiri
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ runner.arch }}
          path: target/release/kiri
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: rustup update stable --no-self-update; cargo test --locked -p kiri-win
      - name: Build
        run: cargo build --release --locked -p kiri-win
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ runner.arch }}
          path: target/release/kiri-win.exe
          retention-days: 14
