# Builds and unit-tests the engine on Linux, macOS and Windows, and keeps
# each platform's binary, with its SHA-256, as a workflow artifact. On Linux
# the build is then run as an engine and tested live (scripts/ci/live-tests.sh).
# The binaries are unsigned development builds, not a release.

name: Platform builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Linux dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v1-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
      - name: Test and build
        run: |
          sh scripts/ci/build-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/cargo-registry" tests
          ls -l "$RUNNER_TEMP/bin"
      - name: Cache Linux dependencies from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Live tests on a private engine
        # The build just made, run as an engine, and the conformance scripts
        # in tests/ against it: containers, archives, attach, networks,
        # limits and seccomp, on busybox and alpine.
        run: sh scripts/ci/live-tests.sh "$RUNNER_TEMP/bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          cargo build --release --locked -p asagiri
          mkdir -p "$RUNNER_TEMP/bin" && cp target/release/asagiri "$RUNNER_TEMP/bin/"
          (cd "$RUNNER_TEMP/bin" && shasum -a 256 asagiri > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --locked -p asagiri-win
      - name: Build
        run: |
          cargo build --release --locked -p asagiri-win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\bin" | Out-Null
          Copy-Item target\release\asagiri-win.exe "$env:RUNNER_TEMP\bin\"
          $h = (Get-FileHash "$env:RUNNER_TEMP\bin\asagiri-win.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  asagiri-win.exe" | Set-Content -Encoding ascii "$env:RUNNER_TEMP\bin\SHA256SUMS"
          Get-Content "$env:RUNNER_TEMP\bin\SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14
