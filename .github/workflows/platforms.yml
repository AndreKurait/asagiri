# Builds and unit-tests the engine on Linux, macOS and Windows, and keeps
# each platform's binary, with its SHA-256, as a workflow artifact. On Linux
# the build is then run as an engine and tested live (scripts/ci/live-tests.sh).
# The binaries are unsigned development builds, not a release.

name: Platform builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build
        run: |
          # A static build, as `cargo xtask linux` makes it. The agent's
          # tests make device nodes and namespaces, so the container is privileged.
          mkdir -p "$RUNNER_TEMP/bin"
          docker run --rm --privileged --tmpfs /tmp -v "$PWD:/src" -v "$RUNNER_TEMP/bin:/out" -w /src -e CARGO_TARGET_DIR=/t rust:1-alpine sh -c \
            'apk add -q build-base && cargo test --locked -p asagiri -p asagiri-init -p asagiri-proto -p asagiri-image && cargo build --release --locked -p asagiri -p asagiri-init && cp /t/release/asagiri /t/release/asagiri-init /out/'
          ls -l "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/bin" && sha256sum asagiri asagiri-init > SHA256SUMS && cat SHA256SUMS)
      - name: Live tests on a private engine
        # The build just made, run as an engine, and the conformance scripts
        # in tests/ against it: containers, archives, attach, networks,
        # limits and seccomp, on busybox and alpine.
        run: sh scripts/ci/live-tests.sh "$RUNNER_TEMP/bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: rustup update stable --no-self-update && cargo test --locked
      - name: Build
        run: |
          cargo build --release --locked -p asagiri
          mkdir -p "$RUNNER_TEMP/bin" && cp target/release/asagiri "$RUNNER_TEMP/bin/"
          (cd "$RUNNER_TEMP/bin" && shasum -a 256 asagiri > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: rustup update stable --no-self-update; cargo test --locked -p asagiri-win
      - name: Build
        run: |
          cargo build --release --locked -p asagiri-win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\bin" | Out-Null
          Copy-Item target\release\asagiri-win.exe "$env:RUNNER_TEMP\bin\"
          $h = (Get-FileHash "$env:RUNNER_TEMP\bin\asagiri-win.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  asagiri-win.exe" | Set-Content -Encoding ascii "$env:RUNNER_TEMP\bin\SHA256SUMS"
          Get-Content "$env:RUNNER_TEMP\bin\SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14
