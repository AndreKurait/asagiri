# Builds and unit-tests the engine on Linux, macOS and Windows, and keeps
# each platform's binary, with its SHA-256, as a workflow artifact. On Linux
# the build is then run as an engine and tested live (scripts/ci/live-tests.sh).
# The binaries are unsigned development builds, not a release.

name: Platform builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  # Publication checks the release commit, so finish its active main build.
  group: platforms-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'current' }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux_build:
    name: Linux build and proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install the pinned Rust toolchain for formal verification
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Cache the pinned Verus release archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/verus-cache/*.zip
          key: verus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/verus.json') }}
      - name: Verify IPAM contracts and prover negative controls
        run: |
          python3 scripts/ci/test-proof-runner.py
          python3 scripts/ci/verify-ipam.py --cache "$RUNNER_TEMP/verus-cache" --output "$RUNNER_TEMP/ipam-proof"
      - name: Verify runtime contracts and prover negative controls
        run: python3 scripts/ci/verify-runtime.py --cache "$RUNNER_TEMP/verus-cache" --output "$RUNNER_TEMP/runtime-proof"
      - name: Preserve runtime proofs and rejected production variants
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-proof-${{ runner.arch }}
          path: ${{ runner.temp }}/runtime-proof
          if-no-files-found: error
          retention-days: 90
      - name: Compare IPv4 and IPv6 allocation performance with an unchanged-source control
        run: |
          python3 scripts/ci/ipam-performance.py --baseline HEAD --output "$RUNNER_TEMP/ipam-performance/control"
          python3 scripts/ci/ipam-performance.py --output "$RUNNER_TEMP/ipam-performance/comparison"
      - name: Preserve IPAM proofs and paired benchmark samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipam-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/ipam-proof
            ${{ runner.temp }}/ipam-performance
          retention-days: 90
      - name: Check Docker API reference expectations before building the engine
        run: |
          docker pull -q alpine:3.21
          python3 tests/api-compatibility.py /var/run/docker.sock alpine:3.21 --reference-docker
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] run the action from the exact checkout under test; supported by our actionlint
      - name: Restore Linux dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v2-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/ci/images.json', 'scripts/ci/build-linux.sh') }}
      - name: Test and build
        run: |
          python3 tests/ci-runtime-probes.py
          python3 tests/ci-hyperfine.py
          sh scripts/ci/build-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/cargo-registry" tests
          ls -l "$RUNNER_TEMP/bin"
      - name: Verify atomic cgroup delegation and startup accounting
        run: python3 scripts/ci/cgroup-startup.py "$RUNNER_TEMP/bin-cgroup-startup" --output "$RUNNER_TEMP/cgroup-startup"
      - name: Preserve cgroup startup regression and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cgroup-startup-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/cgroup-startup
            ${{ runner.temp }}/bin-cgroup-startup
          if-no-files-found: error
          retention-days: 90
      - name: Verify WSL daemon startup and bridge recovery
        run: |
          mkdir -p "$RUNNER_TEMP/wsl-recovery"
          test "$(cat "$RUNNER_TEMP/bin/SOURCE_COMMIT")" = "$(git rev-parse HEAD)"
          test "$(cat "$RUNNER_TEMP/bin-fixtures/SOURCE_COMMIT")" = "$(git rev-parse HEAD)"
          (cd "$RUNNER_TEMP/bin" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/bin-fixtures" && sha256sum -c SHA256SUMS)
          sh tests/asagiri-start.sh "$RUNNER_TEMP/bin-fixtures/asagiri-daemon-fixture" "$ASAGIRI_CI_PERF_IMAGE" >"$RUNNER_TEMP/wsl-recovery/startup.log" 2>&1
          python3 tests/bridge-start.py "$RUNNER_TEMP/bin" "$RUNNER_TEMP/bin-fixtures/asagiri-daemon-fixture" "$ASAGIRI_CI_PERF_IMAGE" --output "$RUNNER_TEMP/wsl-recovery/bridge.json"
      - name: Preserve WSL startup and bridge evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-recovery-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/wsl-recovery
            ${{ runner.temp }}/bin-fixtures
          if-no-files-found: error
          retention-days: 90
      - name: Cache Linux dependencies from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Archive tested binaries and fixtures with executable permissions
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/linux-inputs.tar" bin bin-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-inputs-X64
          path: ${{ runner.temp }}/linux-inputs.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14

  linux_packages:
    name: Linux packaging and paired comparisons
    needs: linux_build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-test-inputs-X64
          path: ${{ runner.temp }}
      - name: Verify tested binaries and fixtures against this checkout
        run: |
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/linux-inputs.tar"
          for dir in bin bin-fixtures; do
            test "$(cat "$RUNNER_TEMP/$dir/SOURCE_COMMIT")" = "$(git rev-parse HEAD)"
            (cd "$RUNNER_TEMP/$dir" && sha256sum -c SHA256SUMS)
          done
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] run the action from the exact checkout under test; supported by our actionlint
      - name: Restore AppImage compiler dependencies and pinned downloads
        id: appimage_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/appimage-cache
          key: appimage-native-v2-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'packaging/linux/appimage-build.json', 'packaging/linux/native-build.json') }}
      - name: Build the native GNU engine and verify real NSS admission
        run: bash scripts/ci/build-linux-native.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/appimage-cache" tests
      - name: Preserve native GNU binaries and NSS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-${{ runner.arch }}
          path: ${{ runner.temp }}/native-bin
          if-no-files-found: error
          retention-days: 90
      - name: Compare portable and native packages with Docker and Podman on this runner
        run: |
          mkdir -p "$RUNNER_TEMP/native-reference"
          for variant in portable native; do
            bin="$RUNNER_TEMP/bin"
            options=()
            if [ "$variant" = native ]; then
              bin="$RUNNER_TEMP/native-bin"
              options=(--native)
            fi
            python3 scripts/ci/runtime-trace.py "$RUNNER_TEMP/runtime-spans.jsonl" "comparison/$variant" \
              sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_EVENT_NAME,ImageOS,ImageVersion \
              python3 scripts/ci/reference-run.py --binaries "$bin" \
                --out "$RUNNER_TEMP/native-reference/$variant" --runs 400 "${options[@]}"
          done
      - name: Make paired comparison reports readable
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/native-reference" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/native-reference"
          fi
          for variant in portable native; do
            report="$RUNNER_TEMP/native-reference/$variant/report.md"
            if [ -f "$report" ]; then
              printf '\n### %s engine build\n\n' "$variant" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Preserve paired native and portable comparison samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-reference-${{ runner.arch }}
          path: ${{ runner.temp }}/native-reference
          if-no-files-found: error
          retention-days: 90
      - name: Build and inspect the native AppImage
        run: bash scripts/ci/appimage.sh "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/appimage" "$RUNNER_TEMP/appimage-cache"
      - name: Preserve AppImage and packaging diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ runner.arch }}
          path: ${{ runner.temp }}/appimage/*
          retention-days: 14
      - name: Cache verified AppImage dependencies from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.appimage_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/appimage-cache
          key: ${{ steps.appimage_cache.outputs.cache-primary-key }}
      - name: Summarize runner timings
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/runtime-spans.jsonl" ]; then
            python3 scripts/ci/runtime-trace.py "$RUNNER_TEMP/runtime-spans.jsonl" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve Linux comparison trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-comparison-trace-${{ runner.arch }}
          path: ${{ runner.temp }}/runtime-spans.json*
          if-no-files-found: ignore
          retention-days: 30
      - name: Build and install-test the Linux packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          mkdir -p "$RUNNER_TEMP/package-checks"
          test "$(cat "$RUNNER_TEMP/native-bin/SOURCE_COMMIT")" = "$(git rev-parse HEAD)"
          (cd "$RUNNER_TEMP/native-bin" && sha256sum -c SHA256SUMS)
          cp "$RUNNER_TEMP/native-bin/SOURCE_COMMIT" "$RUNNER_TEMP/native-bin/SHA256SUMS" "$RUNNER_TEMP/native-bin/native-elf.json" "$RUNNER_TEMP/package-checks/"
          bash scripts/ci/release-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/linux-inputs" "$RUNNER_TEMP/native-bin" 2>&1 | tee "$RUNNER_TEMP/package-checks/run.log"
          (cd "$RUNNER_TEMP/packages" && sha256sum ./*.deb ./*.rpm) > "$RUNNER_TEMP/package-checks/package-sha256.txt"
      - name: Preserve Linux package lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-checks-${{ runner.arch }}
          path: ${{ runner.temp }}/package-checks
          if-no-files-found: ignore
          retention-days: 90

  linux_runtime:
    name: Linux runtime conformance
    needs: linux_build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-test-inputs-X64
          path: ${{ runner.temp }}
      - name: Verify tested binaries and fixtures against this checkout
        run: |
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/linux-inputs.tar"
          for dir in bin bin-fixtures; do
            test "$(cat "$RUNNER_TEMP/$dir/SOURCE_COMMIT")" = "$(git rev-parse HEAD)"
            (cd "$RUNNER_TEMP/$dir" && sha256sum -c SHA256SUMS)
          done
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] run the action from the exact checkout under test; supported by our actionlint
      - name: Live tests on a private engine
        # The build just made, run as an engine, and the conformance scripts
        # in tests/ against it: containers, archives, attach, networks,
        # limits and seccomp, on busybox and alpine.
        env:
          ASAGIRI_CI_TRACE: ${{ runner.temp }}/runtime-spans.jsonl
        run: sh scripts/ci/live-tests.sh "$RUNNER_TEMP/bin" core
      - name: Summarize runner timings
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/runtime-spans.jsonl" ]; then
            python3 scripts/ci/runtime-trace.py "$RUNNER_TEMP/runtime-spans.jsonl" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve Linux runtime trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-runtime-trace-${{ runner.arch }}
          path: ${{ runner.temp }}/runtime-spans.json*
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve Docker-to-Asagiri import evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-import-${{ runner.arch }}
          path: ${{ runner.temp }}/bin-engine-import
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve health and Compose reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-compose-${{ runner.arch }}
          path: ${{ runner.temp }}/bin-health-compose/*.json
          if-no-files-found: ignore
          retention-days: 90

  linux_integrations:
    name: Linux clients and integrations
    needs: linux_build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-test-inputs-X64
          path: ${{ runner.temp }}
      - name: Verify tested binaries and fixtures against this checkout
        run: |
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/linux-inputs.tar"
          for dir in bin bin-fixtures; do
            test "$(cat "$RUNNER_TEMP/$dir/SOURCE_COMMIT")" = "$(git rev-parse HEAD)"
            (cd "$RUNNER_TEMP/$dir" && sha256sum -c SHA256SUMS)
          done
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] run the action from the exact checkout under test; supported by our actionlint
      - name: Test MCP, browser and image import on a private engine
        env:
          ASAGIRI_CI_TRACE: ${{ runner.temp }}/client-spans.jsonl
        run: sh scripts/ci/live-tests.sh "$RUNNER_TEMP/bin" clients
      - name: Preserve client timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-client-trace-${{ runner.arch }}
          path: ${{ runner.temp }}/client-spans.jsonl
          retention-days: 30
      - name: Restart the daemon with orphaned container mounts
        run: python3 tests/linux-service-recovery.py "$RUNNER_TEMP/bin"
      - name: Verify registry TLS trust and actual BuildKit admission
        run: sh scripts/ci/registry-ca.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/registry-ca"
      - name: Preserve registry TLS and BuildKit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-ca-x86_64
          path: ${{ runner.temp }}/registry-ca
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Restore Java SDK dependencies
        id: maven_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven
          key: testcontainers-java-v1-${{ runner.arch }}-${{ hashFiles('tests/testcontainers/pom.xml') }}
      - name: Test Java Testcontainers and MySQL
        run: sh scripts/ci/testcontainers.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/maven"
      - name: Verify Linux firewall and Docker coexistence
        run: python3 tests/linux-firewall.py "$RUNNER_TEMP/bin" --output "$RUNNER_TEMP/linux-firewall"
      - name: Preserve Linux firewall diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-firewall-${{ runner.arch }}
          path: ${{ runner.temp }}/linux-firewall/
          if-no-files-found: error
          retention-days: 90
      - name: Verify custom-network firewall and Docker coexistence
        run: python3 tests/linux-firewall.py "$RUNNER_TEMP/bin" --user-network --output "$RUNNER_TEMP/linux-firewall-custom"
      - name: Preserve custom-network firewall diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-firewall-custom-${{ runner.arch }}
          path: ${{ runner.temp }}/linux-firewall-custom/
          if-no-files-found: error
          retention-days: 90
      - name: Verify the default bridge when Docker starts first
        run: python3 tests/linux-firewall.py "$RUNNER_TEMP/bin" --docker-first --output "$RUNNER_TEMP/linux-firewall-docker-first"
      - name: Preserve Docker-first bridge evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-firewall-docker-first-${{ runner.arch }}
          path: ${{ runner.temp }}/linux-firewall-docker-first/
          retention-days: 90
      - name: Test a real DDEV PHP, MariaDB and HTTPS project
        run: python3 scripts/ci/ddev.py "$RUNNER_TEMP/bin" --output "$RUNNER_TEMP/ddev"
      - name: Preserve DDEV runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddev-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/ddev/*.json
            ${{ runner.temp }}/ddev/*.log
          retention-days: 90
      - name: Cache verified Java SDK dependencies from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.maven_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven
          key: ${{ steps.maven_cache.outputs.cache-primary-key }}

  linux:
    name: Linux
    if: ${{ always() }}
    needs: [linux_build, linux_packages, linux_runtime, linux_integrations]
    runs-on: ubuntu-slim
    steps:
      - name: Require successful build, packaging and runtime tests
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: python3 -c 'import json,os,sys; sys.exit(json.loads(os.environ["RESULTS"]) != ["success"] * 4)'

  native_linux_arm:
    name: Native Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] run the action from the exact checkout under test; supported by our actionlint
      - name: Restore Linux dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v2-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/ci/images.json', 'scripts/ci/build-linux.sh') }}
      - name: Test and build the ARM portable inputs
        run: sh scripts/ci/build-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/cargo-registry" tests
      - name: Restore GNU compiler dependencies and pinned AppImage downloads
        id: appimage_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/appimage-cache
          key: appimage-native-v2-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'packaging/linux/appimage-build.json', 'packaging/linux/native-build.json') }}
      - name: Build the native GNU engine and verify real NSS admission
        run: bash scripts/ci/build-linux-native.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/appimage-cache" tests
      - name: Preserve native GNU binaries and NSS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-${{ runner.arch }}
          path: ${{ runner.temp }}/native-bin
          if-no-files-found: error
          retention-days: 90
      - name: Build and inspect the native AppImage
        run: bash scripts/ci/appimage.sh "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/appimage" "$RUNNER_TEMP/appimage-cache"
      - name: Preserve AppImage and packaging diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ runner.arch }}
          path: ${{ runner.temp }}/appimage
          if-no-files-found: error
          retention-days: 90
      - name: Verify native Linux packages before merge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          mkdir -p "$RUNNER_TEMP/package-checks"
          test "$(cat "$RUNNER_TEMP/native-bin/SOURCE_COMMIT")" = "$(git rev-parse HEAD)"
          (cd "$RUNNER_TEMP/native-bin" && sha256sum -c SHA256SUMS)
          cp "$RUNNER_TEMP/native-bin/SOURCE_COMMIT" "$RUNNER_TEMP/native-bin/SHA256SUMS" "$RUNNER_TEMP/native-bin/native-elf.json" "$RUNNER_TEMP/package-checks/"
          bash scripts/ci/release-linux.sh "$RUNNER_TEMP/bin" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/linux-inputs" "$RUNNER_TEMP/native-bin" 2>&1 | tee "$RUNNER_TEMP/package-checks/run.log"
          (cd "$RUNNER_TEMP/packages" && sha256sum ./*.deb ./*.rpm) > "$RUNNER_TEMP/package-checks/package-sha256.txt"
      - name: Preserve Linux package lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-checks-${{ runner.arch }}
          path: ${{ runner.temp }}/package-checks
          if-no-files-found: ignore
          retention-days: 90
      - name: Cache verified GNU compiler dependencies from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.appimage_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/appimage-cache
          key: ${{ steps.appimage_cache.outputs.cache-primary-key }}
      - name: Cache verified Linux dependencies from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 90

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the Mac test time zone
        # Native bind tests exercise the real /etc/localtime symlink.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/etc/localtime")
          print(f"Before setup: exists={path.exists()}, link={path.readlink() if path.is_symlink() else None}")
          print(f"Before setup resolved path: {path.resolve()}")
          PY
          # systemsetup can remove a valid link on hosted macOS 26 (error -99).
          # Preserve the runner's time zone; supply its UTC link only if absent.
          if [ ! -f /etc/localtime ]; then
            test ! -e /etc/localtime
            test -f /var/db/timezone/zoneinfo/UTC
            sudo ln -sfn /var/db/timezone/zoneinfo/UTC /etc/localtime
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/etc/localtime")
          print(f"Configured time zone file: {path.resolve(strict=True)}")
          assert path.is_file(), "The Mac tests require a time zone file"
          PY
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Docker CLI and Compose for configuration tests
        run: |
          brew install docker docker-compose
          mkdir -p "$RUNNER_TEMP/docker-config/cli-plugins"
          ln -s "$(brew --prefix docker-compose)/bin/docker-compose" "$RUNNER_TEMP/docker-config/cli-plugins/docker-compose"
          DOCKER_CONFIG="$RUNNER_TEMP/docker-config" docker compose version
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          cargo build --release --locked -p asagiri
          mkdir -p "$RUNNER_TEMP/bin" && cp target/release/asagiri "$RUNNER_TEMP/bin/"
          (cd "$RUNNER_TEMP/bin" && shasum -a 256 asagiri > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install the Compose plugin shipped with the Windows app
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -nE 's/^pub const WIN_COMPOSE: .* = \("([^"]+)", "([0-9a-f]{64})"\);$/\1 \2/p' crates/asagiri/src/cli_pins.rs)
          read -r version digest <<< "$pin"
          test -n "$digest"
          config="$(cygpath -u "$RUNNER_TEMP")/docker-config"
          mkdir -p "$config/cli-plugins"
          plugin="$config/cli-plugins/docker-compose.exe"
          curl --fail --location --retry 3 "https://github.com/docker/compose/releases/download/$version/docker-compose-windows-x86_64.exe" -o "$plugin"
          echo "$digest  $plugin" | sha256sum --check
          chmod +x "$plugin"
          export DOCKER_CONFIG="$(cygpath -w "$config")"
          test "$(docker compose version --short | tr -d '\r')" = "${version#v}"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked -p asagiri-image -p asagiri-win -p xtask
      - name: Exercise large documents in native WebView2
        run: cargo test --locked -p asagiri-win webview2_shows_the_page_at_its_largest_and_only_it -- --ignored --nocapture
      - name: Check WSL prerequisite command and restart handling
        run: ./tests/windows-wsl-setup.ps1
      - name: Build
        run: |
          cargo build --release --locked -p asagiri-win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\bin" | Out-Null
          Copy-Item target\release\asagiri-win.exe "$env:RUNNER_TEMP\bin\"
          $h = (Get-FileHash "$env:RUNNER_TEMP\bin\asagiri-win.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  asagiri-win.exe" | Set-Content -Encoding ascii "$env:RUNNER_TEMP\bin\SHA256SUMS"
          Get-Content "$env:RUNNER_TEMP\bin\SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ runner.arch }}
          path: ${{ runner.temp }}/bin
          retention-days: 14
