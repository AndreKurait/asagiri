name: Published Intel guest Cilium startup
on:
  push:
    branches: [qualification/intel-cilium-94]
    paths: [.github/workflows/intel-cilium.yml]
permissions:
  contents: read
  actions: read
jobs:
  cilium:
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Prepare pinned Helm and Cilium chart
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/cilium-tools"
          mkdir -p "$tools"
          export PATH="$tools:$PATH"
          archive="$RUNNER_TEMP/helm-v3.17.3-darwin-amd64.tar.gz"
          curl --fail --location --retry 3 https://get.helm.sh/helm-v3.17.3-darwin-amd64.tar.gz -o "$archive"
          echo "20ef8df4671349a6fc556a621be1170dd709c6c0cf5f7e83a2d9fb0515fd97fc  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$tools" --strip-components 1 darwin-amd64/helm
          helm version --short
          chart="$RUNNER_TEMP/cilium-1.20.2.tgz"
          curl --fail --location --retry 3 https://helm.cilium.io/cilium-1.20.2.tgz -o "$chart"
          echo "b2afd87b7f75f875f92a14559f14f59b7babbb479d968e3fd625a20bf30ec20e  $chart" | shasum -a 256 -c -
          echo "$tools" >> "$GITHUB_PATH"
          echo "chart=$chart" >> "$GITHUB_ENV"
      - name: Stage the chart's container images
        timeout-minutes: 20
        run: |
          set -euo pipefail
          command -v skopeo || brew install skopeo
          images="$RUNNER_TEMP/cilium-images"
          mkdir -p "$images"
          helm template cilium "$chart" --kube-version 1.35.5 --namespace kube-system --set kubeProxyReplacement=true --set k8sServiceHost=kind-control-plane --set k8sServicePort=6443 > "$images/rendered.yaml"
          awk '$1 == "image:" {gsub(/"/, "", $2); print $2}' "$images/rendered.yaml" | sort -u > "$images/refs"
          test -s "$images/refs"
          n=0
          while IFS= read -r ref; do
            n=$((n+1))
            source_ref=$ref
            if [[ $ref == *@* ]]; then
              name=${ref%@*}
              if [[ ${name##*/} == *:* ]]; then name=${name%:*}; fi
              source_ref="$name@${ref##*@}"
            fi
            skopeo copy --retry-times 3 --all --preserve-digests "docker://$source_ref" "oci-archive:$images/$n.tar:${ref%@*}"
          done < "$images/refs"
          echo "images=$images" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"
      - name: Start Cilium in a kind cluster on the bundled guest
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/cilium-tools"
          command -v kind || GOBIN="$tools" go install sigs.k8s.io/kind@v0.31.0
          command -v kubectl || brew install kubectl
          mkdir -p "$RUNNER_TEMP/build"
          gh release download v0.1.14-dev.188 -p Asagiri-0.1.14-dev.188-x86_64.tar.gz -D "$RUNNER_TEMP/build"
          cd "$RUNNER_TEMP/build"
          echo "9342f8db347380c5d0971a518d5169f9233fd24f218f6b81d070a5cf51c448f2  Asagiri-0.1.14-dev.188-x86_64.tar.gz" | shasum -a 256 -c -
          tar xzf Asagiri-0.1.14-dev.188-x86_64.tar.gz
          cd Asagiri.app/Contents/MacOS
          export HOME="$RUNNER_TEMP/edit-home" ASAGIRI_DATA_DIR="$RUNNER_TEMP/edit-store"
          scratch=$(mktemp -d /tmp/edit255.XXXXXX)
          export HOME="$scratch/home"
          export ASAGIRI_SOCKET="$HOME/.asagiri/run/docker.sock"
          mkdir -p "$HOME/.asagiri/run"
          echo '{"lang":"de","langAsked":true,"domainsAsked":true,"setupSkip":true}' > "$HOME/.asagiri/ui.json"
          ./asagiri daemon >"$scratch/daemon.log" 2>&1 &
          daemon=$!
          export PATH="$RUNNER_TEMP/build/Asagiri.app/Contents/Resources/bin:$PATH" DOCKER_HOST="unix://$ASAGIRI_SOCKET"
          unset DOCKER_CONTEXT
          for attempt in {1..60}; do docker version >/dev/null 2>&1 && break; kill -0 "$daemon"; sleep 1; done
          trap 'tail -60 "$scratch/daemon.log"' ERR
          for attempt in 1 2 3; do
            docker pull alpine:3.21 && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          export KUBECONFIG="$scratch/kubeconfig" KIND_EXPERIMENTAL_PROVIDER=docker
          # Keep the bundled VM awake while kind downloads and prepares its node.
          docker run -d --name qualification-keepawake alpine:3.21 sleep 3600
          trap 'kind delete cluster || true; docker rm -f qualification-keepawake || true; kill "$daemon" || true' EXIT
          cat > "$scratch/kind.yaml" <<'CONFIG'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            kubeProxyMode: none
          CONFIG
          kind create cluster --config "$scratch/kind.yaml" --image kindest/node:v1.35.5 --retain
          for archive in "$images"/*.tar; do
            docker exec -i kind-control-plane ctr -n k8s.io images import --all-platforms --digests - < "$archive"
          done
          while IFS= read -r ref; do
            docker exec kind-control-plane crictl inspecti "$ref" >/dev/null
          done < "$images/refs"
          helm install cilium "$chart" --namespace kube-system --set kubeProxyReplacement=true --set k8sServiceHost=kind-control-plane --set k8sServicePort=6443
          if ! kubectl -n kube-system rollout status ds/cilium --timeout=5m; then
            kubectl -n kube-system get events --sort-by=.lastTimestamp
            kubectl -n kube-system get pods -o wide
            kubectl -n kube-system logs ds/cilium -c cilium-agent --tail=80 || true
            exit 1
          fi
          kubectl -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg status --brief
          kubectl wait --for=condition=Ready nodes --all --timeout=2m
