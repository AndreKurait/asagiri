name: Verify ARM64 Compose dashboard rendering
on:
  push:
    branches: [qualification/ubuntu-compose-dashboard-246]
permissions:
  actions: read
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/fixtures/compose-dashboard
      - name: Exercise the packaged GTK dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb dbus-x11 gir1.2-atspi-2.0 at-spi2-core libfuse2t64
          tag=v0.1.14-dev.247
          asset="Asagiri-${tag#v}-aarch64.AppImage"
          digest=$(gh release view "$tag" -R AndreKurait/asagiri --json assets,isDraft --jq ". | select(.isDraft == false) | .assets[] | select(.name == \"$asset\") | .digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh release download "$tag" -R AndreKurait/asagiri --pattern "$asset"
          app="$PWD/$asset"
          echo "${digest#sha256:}  $app" | sha256sum -c -
          chmod +x "$app"
          export HOME="$RUNNER_TEMP/profile" GTK_MODULES=gail:atk-bridge
          mkdir -p "$HOME/.asagiri/run"
          sudo install -d /run/asagiri
          export ASAGIRI_SOCKET=/run/asagiri/docker.sock
          "$app" --appimage-extract >/dev/null
          sudo env HOME="$HOME" ASAGIRI_SOCKET="$ASAGIRI_SOCKET" ASAGIRI_DATA_DIR="$RUNNER_TEMP/engine" "$PWD/squashfs-root/usr/bin/asagiri" daemon &
          for _ in {1..50}; do [ -S "$ASAGIRI_SOCKET" ] && break; sleep .2; done
          sudo chown "$(id -u):$(id -g)" "$ASAGIRI_SOCKET"
          curl --fail --unix-socket "$ASAGIRI_SOCKET" http://localhost/_ping
          fixture="$PWD/tests/fixtures/compose-dashboard/compose.yaml"
          images=(node:22-alpine golang:1.25-alpine alpine:3.20)
          for image in "${images[@]}"; do
            docker --host unix:///var/run/docker.sock pull "$image"
          done
          export DOCKER_HOST="unix://$ASAGIRI_SOCKET"
          docker --host unix:///var/run/docker.sock save "${images[@]}" | docker load
          for image in "${images[@]}"; do
            docker image inspect "$image" >/dev/null
          done
          "$app" compose -p dashboard246 -f "$fixture" up -d --build
          docker ps --filter label=com.docker.compose.project=dashboard246 --format '{{.Names}}'
          test "$(docker ps -q --filter label=com.docker.compose.project=dashboard246 | wc -l)" -eq 4
          echo '{"lang":"en","setupSkip":["docker","builds"]}' > "$HOME/.asagiri/ui.json"
          cat > check_compose_view.py <<'PY'
          import time
          import gi
          gi.require_version('Atspi', '2.0')
          from gi.repository import Atspi, GLib
          def nodes(node):
              yield node
              for index in range(node.get_child_count()):
                  child = node.get_child_at_index(index)
                  if child:
                      yield from nodes(child)
          labels = []
          for attempt in range(40):
              try:
                  widgets = list(nodes(Atspi.get_desktop(0)))
                  labels = [widget.get_name() for widget in widgets]
                  if attempt % 5 == 0:
                      print([name for name in labels if name][:50], flush=True)
                  if {'Structure', 'Services', 'Compose file', 'Logs'}.issubset(labels) and 'Compose dashboard246' in labels:
                      print('Opened running dashboard246 project and observed its four detail tabs')
                      break
                  for label in ('Continue', 'English Same as Linux Hello', 'Keep building with Docker', 'Open Asagiri', 'Start engine', 'dashboard246', 'Compose Beta'):
                      button = next((w for name, w in zip(labels, widgets) if name == label and w.get_state_set().contains(Atspi.StateType.ENABLED) and w.get_n_actions()), None)
                      if button and button.do_action(0):
                          print(f'Activated {label}', flush=True)
                          break
              except GLib.Error as error:
                  print(f"Accessibility tree changed: {error}", flush=True)
              time.sleep(1)
          else:
              raise SystemExit(f'Compose heading missing: {labels[:120]}')
          PY
          export app
          # shellcheck disable=SC2016 # Expand variables inside the Xvfb session.

          dbus-run-session -- xvfb-run -a bash -ec '"$app" ui --view compose & pid=$!; trap "kill $pid 2>/dev/null || true" EXIT; /usr/bin/python3 check_compose_view.py'
