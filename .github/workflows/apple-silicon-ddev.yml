name: Published DDEV project on Apple Silicon
on:
  workflow_dispatch:
  push:
    branches: [qualification/apple-silicon-ddev-176]
    paths: [.github/workflows/apple-silicon-ddev.yml]
permissions:
  contents: read
jobs:
  published-app:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify Apple Silicon virtualization capability
        run: |
          uname -m
          sw_vers
          sysctl kern.hv_support
          test "$(uname -m)" = arm64
      - name: Exercise the published ARM64 app and guest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=Asagiri-0.1.14-dev.158-arm64.tar.gz
          gh release download v0.1.14-dev.158 -p "$asset" -D "$RUNNER_TEMP" -R AndreKurait/asagiri
          cd "$RUNNER_TEMP"
          echo "b623c6ec1aac8b4250f6c0856293fdec4957c715ef737b79a17d5dd689a7fe21  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          export PATH="$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin:$PATH"
          export HOME="$RUNNER_TEMP/qualification-home" ASAGIRI_DATA_DIR="$RUNNER_TEMP/qualification-store"
          scratch=$(mktemp -d /tmp/asagiri-176.XXXXXX)
          export ASAGIRI_SOCKET="$scratch/engine.sock" DOCKER_HOST="unix://$scratch/engine.sock"
          unset DOCKER_CONTEXT
          mkdir -p "$HOME/.docker"
          jq -n --arg dir "$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin/cli-plugins" '{cliPluginsExtraDirs:[$dir]}' > "$HOME/.docker/config.json"
          docker buildx version
          docker compose version
          Asagiri.app/Contents/MacOS/asagiri daemon >"$scratch/daemon.log" 2>&1 &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true; wait "$daemon" || true; tail -100 "$scratch/daemon.log"' EXIT
          for attempt in {1..60}; do
            if docker version >/dev/null 2>&1; then break; fi
            kill -0 "$daemon"
            sleep 1
          done
          docker version
          for attempt in 1 2 3; do
            if docker run --rm alpine:3.21 true; then break; fi
            test "$attempt" != 3
          done
          asset=ddev_macos-arm64.v1.25.2.tar.gz
          gh release download v1.25.2 -R ddev/ddev -p "$asset"
          echo "191a37ddc07fd7c37a4b2caf923f04ec08479fa30ebea04c8243d96153551f9a  $asset" | shasum -a 256 -c -
          mkdir ddev-bin && tar xzf "$asset" -C ddev-bin
          ddev_exe=$(find "$PWD/ddev-bin" -type f -name ddev -print -quit)
          export PATH="$(dirname "$ddev_exe"):$PATH" DDEV_NONINTERACTIVE=true
          mkdir -p "$HOME/project/public"
          cp "$GITHUB_WORKSPACE/tests/ddev/index.php" "$HOME/project/public/index.php"
          cd "$HOME/project"
          ln -s "$RUNNER_TEMP/Asagiri.app/Contents/Resources/bin/cli-plugins/docker-compose" "$(dirname "$ddev_exe")/docker-compose"
          docker-compose version
          ddev config global --use-docker-compose-from-path=true --instrumentation-opt-in=false --omit-containers=ddev-ssh-agent
          mkcert -install
          ddev config --project-name=asagiri-ddev --project-type=php --docroot=public --php-version=8.4 --database=mariadb:11.8 --router-http-port=8080 --router-https-port=8443 --performance-mode=none
          for action in start restart; do
            ddev "$action"
            test "$(curl -fsS --max-time 30 --resolve asagiri-ddev.ddev.site:8080:127.0.0.1 http://asagiri-ddev.ddev.site:8080/)" = asagiri-ddev:42
            test "$(curl -fsS --max-time 30 --cacert "$(mkcert -CAROOT)/rootCA.pem" --resolve asagiri-ddev.ddev.site:8443:127.0.0.1 https://asagiri-ddev.ddev.site:8443/)" = asagiri-ddev:42
            echo "PASS HTTP and trusted HTTPS with MariaDB after ddev $action"
          done
          ddev poweroff
