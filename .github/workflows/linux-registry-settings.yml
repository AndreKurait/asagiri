name: Linux WebKitGTK registry settings
on:
  push:
    branches: [qualification/linux-registry-settings-153]
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gir1.2-webkit2-4.1 python3-gi xvfb xauth
      - run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import runpy, gi
          gi.require_version('WebKit2', '4.1')
          from gi.repository import GLib, Gtk, WebKit2
          page = runpy.run_path('scripts/ui-test.py')['page']('tests/ui/mirrors.js', 'linux')
          window = Gtk.Window()
          window.set_default_size(760, 480)
          view = WebKit2.WebView()
          window.add(view)
          window.show_all()
          lines = []
          def result(view, task, data):
              value = view.evaluate_javascript_finish(task).to_string()
              if value:
                  lines.extend(value.splitlines())
                  Gtk.main_quit()
          def poll():
              view.evaluate_javascript("Array.from(document.querySelectorAll('#results')).map(e => e.textContent).join('\\n')", -1, None, None, None, result, None)
              return True
          view.load_html(page, 'about:blank')
          GLib.timeout_add(500, poll)
          GLib.timeout_add_seconds(45, Gtk.main_quit)
          Gtk.main()
          print('\n'.join(lines), flush=True)
          expected = [
              'PASS with no mirrors it says Docker Hub itself is used',
              'PASS opening Settings asks for the mirrors',
              'PASS adding an address shows it, and Save sends the whole list',
              "PASS the daemon's answer resets the page to the saved list",
              'PASS removing a mirror takes it out of the list Save sends',
              'PASS saving registry exceptions patches only the transport list',
              'PASS one save updates mirrors and removes the last registry exception',
              'PASS with no daemon the page says to start Asagiri',
              'ITEM settings tab Registry mirrors',
              'ITEM mirrors address field',
              'ITEM mirrors add button',
          ]
          assert lines == expected, lines
          PY
  registry:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exercise packaged GTK dashboard against a private daemon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb xauth dbus-x11 python3-pyatspi at-spi2-core
          gh run download 45098441101 -R AndreKurait/asagiri -n appimage-X64 -D package
          app="$PWD/package/Asagiri-0.0.0-x86_64.AppImage"
          echo "e8dc0b86afc72080c0ef8f9cac958a5782ba707bd3619227392ab2a928f94be3  $app" | sha256sum -c -
          chmod +x "$app"
          "$app" --appimage-extract >/dev/null
          export HOME="$RUNNER_TEMP/test-home" ASAGIRI_SOCKET="$RUNNER_TEMP/daemon.sock" ASAGIRI_DATA_DIR="$RUNNER_TEMP/test-store"
          mkdir -p "$HOME/.asagiri"
          echo '{"lang":"en","langAsked":true,"domainsAsked":true,"setupSkip":true}' > "$HOME/.asagiri/ui.json"
          sudo env HOME="$HOME" ASAGIRI_SOCKET="$ASAGIRI_SOCKET" ASAGIRI_DATA_DIR="$ASAGIRI_DATA_DIR" "$PWD/squashfs-root/usr/bin/asagiri" daemon >daemon.log 2>&1 &
          for i in {1..40}; do test -S "$ASAGIRI_SOCKET" && break; sleep 1; done
          sudo chown "$(id -u):$(id -g)" "$ASAGIRI_SOCKET"
          curl -fsS --unix-socket "$ASAGIRI_SOCKET" http://localhost/_ping
          export GTK_MODULES=gail:atk-bridge
          dbus-run-session -- xvfb-run -a bash -eu -s -- "$app" <<'SH'
          "$1" --appimage-extract-and-run ui --view settings >ui.log 2>&1 &
          /usr/bin/python3 - <<'PY'
          import pyatspi as a, time
          def controls():
              return a.findAllDescendants(a.Registry.getDesktop(0), lambda n: True)
          def press(label):
              for _ in range(45):
                  for n in controls():
                      if n.name == label:
                          try:
                              if n.queryAction().doAction(0): return
                          except NotImplementedError: pass
                  time.sleep(1)
              raise RuntimeError((label, [(n.getRoleName(), n.name) for n in controls() if n.name][-100:]))
          press('Registry mirrors')
          time.sleep(2)
          print([(n.getRoleName(),n.name) for n in controls() if n.name or n.getRoleName()=='text'],flush=True)
          PY
          SH
