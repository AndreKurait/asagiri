name: Engine comparison

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'xtask/**'
      - '.cargo/**'
      - Cargo.toml
      - Cargo.lock
      - scripts/ci/build-linux.sh
      - scripts/ci/build-linux-native.sh
      - scripts/ci/verify-linux-native.py
      - packaging/linux/native-build.json
      - scripts/ci/images.json
      - '.github/actions/container-cache/**'
      - scripts/reference-bench.py
      - scripts/ci/reference-run.py
      - scripts/ci/reference-pair.py
      - scripts/ci/reference-images.json
      - tests/ci-reference-performance.py
      - tests/ci-reference-pair.py
      - tests/ci-hyperfine.py
      - tests/fixtures/hyperfine/**
      - bench/hyperfine.jq
      - bench/api.sh
      - bench/suite.sh
      - bench/report.sh
      - .github/workflows/reference-performance.yml
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Optional full ancestor commit SHA for a comparison on the same machine'
        required: false
        type: string

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1

concurrency:
  group: reference-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: Docker, Podman and Asagiri
    if: github.event_name != 'workflow_dispatch' || inputs.baseline == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check measurement and cleanup boundaries
        run: |
          python3 tests/ci-reference-performance.py
          python3 tests/ci-reference-pair.py
          python3 tests/ci-hyperfine.py
      - name: Restore Linux dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v2-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/ci/images.json', 'scripts/ci/build-linux.sh') }}
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] cache action from the measured checkout
      - name: Compile this commit
        run: sh scripts/ci/build-linux.sh "$RUNNER_TEMP/asagiri-bin" "$RUNNER_TEMP/cargo-target" "$RUNNER_TEMP/cargo-registry" build
      - name: Measure three private engines
        run: |
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_EVENT_NAME,ImageOS,ImageVersion \
            python3 scripts/ci/reference-run.py --binaries "$RUNNER_TEMP/asagiri-bin" \
              --out "$RUNNER_TEMP/reference-performance" --runs 400
      - name: Keep the report readable and summarize the measured run
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/reference-performance" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/reference-performance"
          fi
          if [ -f "$RUNNER_TEMP/reference-performance/report.md" ]; then
            cat "$RUNNER_TEMP/reference-performance/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engine-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-performance/*
          if-no-files-found: ignore
          retention-days: 90

  paired-compare:
    name: Baseline and candidate on the same machine
    if: github.event_name == 'workflow_dispatch' && inputs.baseline != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check pairing, raw samples and cleanup boundaries
        run: |
          python3 tests/ci-reference-performance.py
          python3 tests/ci-reference-pair.py
      - name: Restore Linux dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: linux-musl-v2-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/ci/images.json', 'scripts/ci/build-linux.sh') }}
      - uses: ./.github/actions/container-cache # zizmor: ignore[self-repository] cache action from the measured checkout
      - name: Compile both sources and measure baseline, candidate, candidate, baseline
        env:
          BASELINE_COMMIT: ${{ inputs.baseline }}
        run: |
          python3 scripts/ci/reference-pair.py --baseline "$BASELINE_COMMIT" \
            --out "$RUNNER_TEMP/reference-pair" --target "$RUNNER_TEMP/cargo-target" \
            --registry "$RUNNER_TEMP/cargo-registry"
      - name: Summarize the paired measurements
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/reference-pair/report.md" ]; then
            cat "$RUNNER_TEMP/reference-pair/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engine-comparison-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-pair/**
          if-no-files-found: ignore
          retention-days: 90
