name: Repeat Windows watcher regression
on:
  push:
    branches: [qualification/repeat-watch-232]
permissions:
  contents: read
  actions: read
jobs:
  watch:
    name: Windows drive bind notifications
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c501a37d18d1c6d5c5dc50e8531a16b66eaf26a8
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45369036201
          name: windows-X64
          path: ${{ runner.temp }}/windows-X64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45369036201
          name: linux-X64
          path: ${{ runner.temp }}/linux-X64
      - name: Observe host creates, edits, renames and deletes in a container
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/windows-bind-watch.ps1
