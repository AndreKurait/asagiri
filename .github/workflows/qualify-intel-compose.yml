name: Trace dev.253 registry reachability on Intel macOS
on:
  push:
    branches: [qualification/compose-registry-network-168]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare public and local tags on one engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d /private/tmp/ak168.XXXXXX)"
          test "$(uname -m)" = x86_64
          asset=Asagiri-0.1.14-dev.253-x86_64.tar.gz
          gh release download v0.1.14-dev.253 -R AndreKurait/asagiri -p "$asset"
          echo "4d8d0f6d17d7b88084fb544e22de4338b96ffa050d42f54015ddfb0894759d65  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          python3 "$GITHUB_WORKSPACE/scripts/ci/compose-health-client.py" "$PWD/client"
          export HOME="$PWD/home" CFFIXED_USER_HOME="$PWD/home" ASAGIRI_DATA_DIR="$PWD/engine-data" ASAGIRI_SOCKET="$PWD/docker.sock" DOCKER_HOST="unix://$PWD/docker.sock" PATH="$PWD/Asagiri.app/Contents/Resources/bin:$PATH"
          mkdir "$HOME"
          Asagiri.app/Contents/MacOS/asagiri daemon >engine.log 2>&1 &
          daemon=$!
          trap 'kill "$daemon" || true; wait "$daemon" || true' EXIT
          for _ in {1..60}; do docker version >/dev/null 2>&1 && break; sleep 1; done
          for delay in 0 3 8; do sleep "$delay"; docker pull alpine:3.21 && break; done
          docker image inspect alpine:3.21 >/dev/null
          unset GH_TOKEN
          result=0
          python3 "$GITHUB_WORKSPACE/tests/compose-health.py" "$ASAGIRI_SOCKET" alpine:3.21 --compose-plugin "$PWD/client/docker-compose" --buildx-plugin "$PWD/Asagiri.app/Contents/Resources/bin/cli-plugins/docker-buildx" --output "$RUNNER_TEMP/public-build.json" || result=$?
          builder=$(docker ps --format '{{.Names}}' | awk '/^buildx_buildkit_/ {print; exit}')
          test -n "$builder"
          {
            echo "public_build_exit=$result builder=$builder"
            docker inspect --format '{{.HostConfig.NetworkMode}}' "$builder"
            docker logs --tail 100 "$builder" 2>&1 | grep -Ei 'lookup|resolve|dial|request|manifest|timeout' || true
            docker exec "$builder" sh -c '
              cat /etc/resolv.conf
              for name in registry-1.docker.io auth.docker.io; do
                for rr in A AAAA; do echo "query $name $rr"; nslookup -type="$rr" "$name" || true; done
                wget -T 8 -S -O /dev/null "https://$name/v2/" 2>&1 || true
              done'
          } | tee "$RUNNER_TEMP/registry-network.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intel-registry-network
          path: |
            ${{ runner.temp }}/registry-network.txt
            ${{ runner.temp }}/public-build.json
