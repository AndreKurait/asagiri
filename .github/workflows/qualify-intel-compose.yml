name: Trace dev.253 registry reachability on Intel macOS
on:
  push:
    branches: [qualification/compose-registry-network-168]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare public and local tags on one engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d /private/tmp/ak168.XXXXXX)"
          test "$(uname -m)" = x86_64
          asset=Asagiri-0.1.14-dev.253-x86_64.tar.gz
          gh release download v0.1.14-dev.253 -R AndreKurait/asagiri -p "$asset"
          echo "4d8d0f6d17d7b88084fb544e22de4338b96ffa050d42f54015ddfb0894759d65  $asset" | shasum -a 256 -c -
          tar xzf "$asset"
          codesign --verify --deep --strict Asagiri.app
          python3 "$GITHUB_WORKSPACE/scripts/ci/compose-health-client.py" "$PWD/client"
          export HOME="$PWD/home" CFFIXED_USER_HOME="$PWD/home" ASAGIRI_DATA_DIR="$PWD/engine-data" ASAGIRI_SOCKET="$PWD/docker.sock" DOCKER_HOST="unix://$PWD/docker.sock" PATH="$PWD/Asagiri.app/Contents/Resources/bin:$PATH"
          mkdir "$HOME"
          Asagiri.app/Contents/MacOS/asagiri daemon >engine.log 2>&1 &
          daemon=$!
          trap 'kill "$daemon" || true; wait "$daemon" || true' EXIT
          for _ in {1..60}; do docker version >/dev/null 2>&1 && break; sleep 1; done
          for delay in 0 3 8; do sleep "$delay"; docker pull alpine:3.21 && break; done
          docker image inspect alpine:3.21 >/dev/null
          unset GH_TOKEN
          docker pull python:3.12-alpine
          name=registry-1.docker.io
          ip=$(python3 -c 'import socket; print(socket.getaddrinfo("registry-1.docker.io",443,socket.AF_INET,socket.SOCK_STREAM)[0][4][0])')
          cat > probe.py <<'PYTHON'
          import socket, ssl, sys, time
          name, ip = sys.argv[1:]
          print('target', name, ip, flush=True)
          with socket.create_connection((ip,443),timeout=8) as tcp:
              print('tcp connected', flush=True)
              with ssl.create_default_context().wrap_socket(tcp,server_hostname=name) as tls:
                  print('tls', tls.version(), flush=True)
                  tls.sendall(f'GET /v2/ HTTP/1.1\r\nHost: {name}\r\nConnection: close\r\n\r\n'.encode())
                  print(tls.makefile('rb').readline(1024).decode().strip(),flush=True)
          PYTHON
          probe() {
            rc=0
            "$@" <probe.py || rc=$?
            echo "exit=$rc"
          }
          probe python3 - "$name" "$ip" >host.txt 2>&1 &
          host_pid=$!
          probe docker run --rm -i --network bridge python:3.12-alpine python - "$name" "$ip" >bridge.txt 2>&1 &
          bridge_pid=$!
          wait "$host_pid" "$bridge_pid"
          for side in host bridge; do echo "$side"; cat "$side.txt"; done | tee "$RUNNER_TEMP/registry-network.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intel-registry-network
          path: |
            ${{ runner.temp }}/registry-network.txt
