<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Asagiri app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232A4D"/>
      <stop offset="1" stop-color="#161B33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F2684A" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#F2684A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA36C"/>
      <stop offset="1" stop-color="#F2684A"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded tile with 100px safe margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <!-- mark: 70% of the tile wide, centred -->
  <g transform="translate(193.8 149) scale(9.945)">
    <clipPath id="ic"><rect x="0" y="0" width="64" height="29.5"/><rect x="0" y="39" width="64" height="4"/></clipPath>
    <g clip-path="url(#ic)" fill="url(#sun)"><circle cx="32" cy="33" r="20"/></g>
    <g fill="#F3F1F7"><rect x="3" y="31.5" width="41" height="5.5" rx="2.75"/><rect x="19" y="45" width="42" height="5.5" rx="2.75"/><rect x="9" y="54.5" width="30" height="5.5" rx="2.75"/></g>
  </g>
</svg>
